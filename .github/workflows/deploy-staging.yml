name: Deploy to Staging

# ════════════════════════════════════════════════════════════════════════════
# Trigger: Manual deployment to staging only via workflow_dispatch.
#
# Automatic deployment to staging after CI passes has been disabled.
#
# This workflow:
# 1. Runs on manual dispatch (workflow_dispatch)
# 2. Runs the full staging deploy (db + backend + frontend)
# 3. Notifies on success/failure
# 4. Queues concurrent deployments (one at a time)
#
# To manually trigger: gh workflow run deploy-staging.yml -f ref=develop
# ════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy to staging"
        required: false
        default: develop

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    # Use the "staging" environment to access FLY_API_TOKEN and other environment secrets
    environment: staging

    # Run only for manual dispatch (automatic deployment has been disabled)
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the specified ref (or default to develop)
          ref: ${{ github.event.inputs.ref || 'develop' }}
          fetch-depth: 0 # Full history for git merge-base checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm (match lockfile / packageManager)
        run: npm install -g npm@11.6.2

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Fly CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Create backend venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip

      - name: Install backend dependencies
        run: task install:backend

      - name: Install frontend dependencies
        run: task install:frontend

      - name: Create config/secrets.env
        run: |
          cat > config/secrets.env << 'EOF'
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDFLARE_PAGES_API_TOKEN=${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          EOF
          printf 'VITE_CARTO_BASEMAP_KEY=%s\n' "$VITE_CARTO_BASEMAP_KEY" >> config/secrets.env
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          VITE_CARTO_BASEMAP_KEY: ${{ secrets['VITE_CARTO_BASEMAP_KEY'] }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      - name: Create config/secrets.staging.env
        run: |
          cat > config/secrets.staging.env << 'EOF'
          ADMIN_EMAIL=${{ secrets.STAGING_ADMIN_EMAIL }}
          DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
          SESSION_SECRET=${{ secrets.STAGING_SESSION_SECRET }}
          VAPID_PUBLIC_KEY=${{ secrets.STAGING_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.STAGING_VAPID_PRIVATE_KEY }}
          OBJECT_STORAGE_ENDPOINT=${{ secrets.STAGING_OBJECT_STORAGE_ENDPOINT }}
          OBJECT_STORAGE_ACCESS_KEY_ID=${{ secrets.STAGING_OBJECT_STORAGE_ACCESS_KEY_ID }}
          OBJECT_STORAGE_SECRET_ACCESS_KEY=${{ secrets.STAGING_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          EOF
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
          STAGING_VAPID_PUBLIC_KEY: ${{ secrets.STAGING_VAPID_PUBLIC_KEY }}
          STAGING_VAPID_PRIVATE_KEY: ${{ secrets.STAGING_VAPID_PRIVATE_KEY }}
          STAGING_OBJECT_STORAGE_ENDPOINT: ${{ secrets.STAGING_OBJECT_STORAGE_ENDPOINT }}
          STAGING_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.STAGING_OBJECT_STORAGE_ACCESS_KEY_ID }}
          STAGING_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STAGING_OBJECT_STORAGE_SECRET_ACCESS_KEY }}

      - name: Create backend/credentials/service-account.json (if provided)
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p backend/credentials
            cat > backend/credentials/service-account.json << 'EOF'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EOF
          fi
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy to staging
        # :cwd primitive — deploys whatever `actions/checkout` put in CWD above.
        # No worktree, no re-fetch of "develop": the checkout `ref` above already
        # pins the exact commit to deploy (see Taskfile.yml naming convention).
        run: task deploy:staging:remote:cwd
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.STAGING_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.STAGING_VAPID_PRIVATE_KEY }}

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Staging deployment succeeded"
          echo "   Branch/SHA: ${{ github.event.inputs.ref || 'develop' }}"
          echo "   Actor: ${{ github.actor }}"
          echo "   URL: https://develop.joinmovida.com"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed"
          echo "   Branch/SHA: ${{ github.event.inputs.ref || 'develop' }}"
          echo "   Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1

      - name: Email deploy result to owner
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-relay.brevo.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Movida CI <noreply@joinmovida.com>
          to: ${{ secrets.CI_NOTIFY_EMAIL || secrets.STAGING_ADMIN_EMAIL }}
          subject: "${{ job.status == 'success' && '✅' || '❌' }} Staging deploy ${{ job.status }} — ${{ github.event.inputs.ref || 'develop' }}"
          body: |
            Staging deployment: ${{ job.status }}

            Branch/SHA: ${{ github.event.inputs.ref || 'develop' }}
            Actor:  ${{ github.actor }}
            Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
