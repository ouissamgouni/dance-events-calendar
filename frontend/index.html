<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <!-- iOS standalone splash screens (pixel-perfect matches only) -->
  <link rel="apple-touch-startup-image"
    media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    href="/splash/splash-750x1334.png" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
    href="/splash/splash-1334x750.png" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    href="/splash/splash-1170x2532.png" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
    href="/splash/splash-2532x1170.png" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    href="/splash/splash-1290x2796.png" />
  <link rel="apple-touch-startup-image"
    media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)"
    href="/splash/splash-2796x1290.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Movida" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#a12d42" />

  <!-- Security -->
  <!-- Keep CSP static to avoid unresolved env placeholders in builds without Umami vars. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https:; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; frame-src https://accounts.google.com; object-src 'none';" />

  <title>Movida — Salsa, Bachata &amp; Dance Events Near You</title>
  <meta name="description"
    content="Discover upcoming salsa and latin parties, socials, classes, workshops, and international and local dance events. Browse by date, location, and style." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Movida — Dance Events Calendar" />
  <meta property="og:description"
    content="Discover upcoming salsa and latin parties, socials, workshops, and international and local dance events." />
  <meta property="og:image" content="/og-fallback.png" />
  <meta property="og:site_name" content="Movida" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Movida — Dance Events Calendar" />
  <meta name="twitter:description"
    content="Discover upcoming salsa and latin parties, socials, classes, workshops, and international and local dance events." />

  <script src="https://accounts.google.com/gsi/client" async></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
