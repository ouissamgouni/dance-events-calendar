  <!-- Security -->
  <!-- Keep CSP static to avoid unresolved env placeholders in builds without Umami vars. -->
  <!-- img-src allows loopback origins: local object storage (MinIO) serves pictures over http. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' https:; font-src 'self' data:; frame-src 'self' https://accounts.google.com; object-src 'none';" />
