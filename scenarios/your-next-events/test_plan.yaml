test_plan:
  name: "Compact Your Next Event"
  description: >
    Verify the shared compact next-event section on /for-you and /mine.
    Only the viewer's upcoming Going events qualify. The earliest event is
    displayed, later Going events are summarized by a right-aligned link,
    and saved-only events do not appear or count.

  preconditions:
    - "task start:scenario SCENARIO=your-next-events"
    - "Sign in as viewer@example.com."
    - "The viewer is Going to evt-yne-002, evt-yne-005 and evt-yne-003; evt-yne-001 is saved only."

  steps:
    - id: 1
      title: "For You shows one compact next event"
      description: "Open /for-you at approximately 400px wide."
      expected: >
        YOUR NEXT EVENT appears without a count. One full-width card shows
        Bachata Studio Class, the exact Trending Trail date rail on the left,
        Madrid, a relative countdown, the local dance-floor image, and a
          mutual-friend row reading "Paul +3 friends going". The card has a subtle border and no
        Save or Going action.

    - id: 2
      title: "Card and remaining link navigate correctly"
      description: >
        Tap the card, return, then tap "View 2 more upcoming events →".
      expected: >
        The card opens Event Details with src=for-you. The remaining link is
        right aligned and opens /mine/calendar?filter=going with Going selected
        and past events hidden.

    - id: 3
      title: "Saved-only events are excluded"
      description: "Inspect the card and remaining count."
      expected: >
        Salsa Kickoff Party (saved only) does not appear and is not included
        in the remaining count. Kizomba Free Fresher (neither saved nor Going)
        is also excluded.

    - id: 4
      title: "MyDance uses the same compact presentation"
      description: "Open /mine."
      expected: >
        The same earliest Going event and two-remaining link render on the
        Overview page. Tapping the card opens the existing Mine event modal.

    - id: 5
      title: "No-picture event expands naturally"
      description: >
        Remove the Going RSVP from Bachata Studio Class and return to either
        target page.
      expected: >
        Rooftop Bachata Sunset becomes the displayed event. No image or
        placeholder is shown; content expands into the media area and the card
        becomes slightly shorter. The link reads "View 1 more upcoming event →".

    - id: 6
      title: "One event hides the remaining link"
      description: "Also remove the Going RSVP from Berlin Salsa Marathon."
      expected: >
        Rooftop Bachata Sunset remains visible and no remaining-events link is
        rendered.

    - id: 7
      title: "Zero Going events show the compact empty state"
      description: "Remove the final Going RSVP."
      expected: >
        A roughly 88px neutral box shows the calendar-with-x icon,
        "No upcoming events", "Find your next dance event", and a right-aligned
        "Explore →" link. The saved-only Salsa Kickoff Party does not suppress
        this state. Explore opens the preference-aware Explore page.

    - id: 8
      title: "Desktop remains compact"
      description: "Restore the fixture and inspect both pages at desktop width."
      expected: >
        The section remains a single bounded row rather than becoming a
        carousel; there are no collapse controls, scroll dots, or heavy shadow.
