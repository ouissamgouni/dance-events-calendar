test_plan:
  name: "Event status — unpublish, remove and restore"
  description: >
    Verify the admin status actions in the event side panel footer:
    Unpublish / Republish, Remove… (with notify) and Restore, the status chip
    and row colours in the Events grid, and that unpublished and removed
    events are absent from every public endpoint while staying visible to
    admins. Uses 4 pre-seeded events: 2 published, 1 unpublished, 1 removed
    by an admin.

  preconditions:
    - "Run the scenario with: `SCENARIO=event-hide-block task start:scenario BROWSER=isolated RESET_BROWSER=1`."
    - "Signed in as admin (Dev Mock)."

  steps:
    # ── Admin list: initial state ──────────────────────────────
    - id: 1
      title: "Status column shows each event's status"
      description: >
        Open Admin → Events, clear the filters and look at the four seeded
        events.
      expected: >
        "Friday Salsa Social" and "Bachata Sensual Night" read Published on a
        white row. "Salsa On2 Workshop (unpublished)" reads Unpublished on its
        unpublished row colour. "Kizomba Urban Night (removed)" reads Removed
        on its removed row colour. The Status filter pills count 2 / 1 / 1.

    - id: 2
      title: "The side panel header shows the status and why it was removed"
      description: "Open Kizomba Urban Night (removed)."
      expected: >
        The header shows a Removed chip and a "Removed by admin" chip. The
        footer offers only Restore.

    # ── Public API excludes unpublished / removed ──────────────
    - id: 3
      title: "Unpublished and removed events are not public"
      description: "Open the home page signed out."
      expected: >
        Friday Salsa Social and Bachata Sensual Night are listed; Salsa On2
        Workshop and Kizomba Urban Night are not.

    - id: 4
      title: "An unpublished event's page is not found"
      description: "Open /event/evt-hide-003 signed out."
      expected: 'The page shows "Event not found".'

    # ── Unpublish / Republish ──────────────────────────────────
    - id: 5
      title: "Unpublish a published event"
      description: "As Admin open Friday Salsa Social and click Unpublish in the footer."
      expected: >
        The header chip turns Unpublished and the panel takes the unpublished
        colour. The footer now offers Republish and Remove…. The event is gone
        from the public home page but still listed in Admin → Events.

    - id: 6
      title: "Republish an unpublished event"
      description: "Open Salsa On2 Workshop (unpublished) and click Republish."
      expected: >
        The chip turns Published; the footer offers Unpublish, Cancel event…
        and Remove…. The workshop appears on the public home page.

    # ── Remove ─────────────────────────────────────────────────
    - id: 7
      title: "Remove… asks for confirmation inline"
      description: "Open Bachata Sensual Night and click Remove…."
      expected: >
        The footer is replaced by "Remove for everyone? It will not come back
        on the next sync.", a "Notify attendees" checkbox (checked), Back and
        "Yes, remove". No browser dialog appears.

    - id: 8
      title: "Back keeps the event"
      description: "Click Back."
      expected: "The normal footer returns and the event is still Published."

    - id: 9
      title: "Yes, remove removes it for everyone"
      description: "Click Remove… again, then Yes, remove."
      expected: >
        The chips read Removed and "Removed by admin"; the footer offers only
        Restore. Bachata Sensual Night is gone from the public home page.

    # ── Restore ────────────────────────────────────────────────
    - id: 10
      title: "Restore asks for confirmation"
      description: "Open Kizomba Urban Night (removed) and click Restore."
      expected: '"Restore this event?" with Back and "Yes, restore"; no notify checkbox.'

    - id: 11
      title: "Restore brings the event back"
      description: "Click Yes, restore."
      expected: >
        The event is listed again: Kizomba Urban Night appears on the public
        home page, and a later sync does not remove it again.

    - id: 12
      title: "An unpublished event can be removed too"
      description: "Open Friday Salsa Social (unpublished in step 5) → Remove… → Yes, remove."
      expected: >
        The chips read Removed and "Removed by admin"; the footer offers only
        Restore. The event stays absent from the public list.
