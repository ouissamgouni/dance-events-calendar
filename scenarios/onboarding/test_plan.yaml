test_plan:
  name: "Mobile onboarding: dances, international area, near home, review"
  description: >
    Hard-gated four-step onboarding for a fresh user. Dance preferences and one
    international geographic profile are required; a second near-home profile
    is optional. All choices remain draft state until Start exploring.

  preconditions:
    - "Run with: task start:scenario SCENARIO=onboarding"
    - "Sign in as the fresh scenario user with no onboarded_at timestamp."
    - "Dance-style and reach tag groups are onboarding eligible."
    - "Paris is available from popular cities and city autocomplete."

  steps:
    - id: 1
      title: "Choose required dance styles"
      expected: >
        Step 1/4 shows four dance pills followed by More styles as the fifth
        pill when additional styles exist. More styles expands all remaining
        styles inline on the same screen. Continue is sticky and disabled until
        at least one style is selected. There is no Skip, and continuing does
        not persist profiles or complete onboarding.

    - id: 2
      title: "Choose an international area preset"
      expected: >
        Step 2/4 shows compact two-column cards for Europe, North America,
        Latin America, Asia, Africa, Oceania, Worldwide and Custom, each with a
        distinct geographic icon and a bounds icon for Custom. Selecting any
        card immediately opens the shared editor while progress remains 2/4.
        Custom opens on a broad world-centered view and is named exactly Custom.

    - id: 2a
      title: "Customize the fixed international square"
      expected: >
        The International area editor has only a back arrow in its header. A
        fixed 1:1 square sits over the map: dragging anywhere else, including
        inside the square, pans the map underneath it; pinch or wheel zooms the
        map; and each 44px corner target resizes from the opposite corner while
        keeping the frame square. The area outside the square is subtly dimmed.
        Geographic bounds update after pan, zoom and resize, and every gesture
        stops or restores the previous view before the square becomes smaller
        than about 1000 km per side.

    - id: 2b
      title: "Confirm and optionally name the international area"
      expected: >
        A compact Use this area button appears inside the square near its bottom
        edge. Tapping it focuses the horizontal Name field and selects its full
        value. An untouched Europe preset remains Europe; meaningful pan, zoom
        or resize changes it to Custom; tiny settling movement does not. A name
        typed by the user, such as Summer Europe, survives later map changes.
        Below the map, only the muted helper Move, zoom or resize to customize
        your area appears. New event alerts appears once and defaults on, and
        the sticky Continue action advances to Step 3.

    - id: 3
      title: "Skip near home"
      expected: >
        Step 3/4 initially shows only Yes, find events near home and Not now.
        Add it later in Settings appears beneath the choices. Not now advances
        directly to Review, where Near home reads Not set.

    - id: 3a
      title: "Configure near home"
      expected: >
        Choosing Yes replaces the choice screen with the Near home editor.
        Radius and map remain hidden until a city is selected. Selecting Paris
        reveals a local map with a labeled center point and circular radius,
        snapped 5, 10, 25, 50 and 100 km controls with 25 km selected, and one
        local alerts toggle defaulted on. No square bbox appears in this step.

    - id: 4
      title: "Review and edit each section"
      expected: >
        Step 4/4 contains tappable Dance styles, International area and Near
        home cards without a separate alerts summary. Dance edits return
        directly to Review after Save. The
        international card opens the existing area editor rather than presets.
        Near home opens its configured editor, or the choice screen when unset.
        Draft selections remain unchanged while moving between these screens.

    - id: 5
      title: "Start exploring persists the draft"
      expected: >
        Start exploring updates or creates one active international profile,
        conditionally updates or creates one inactive Near home profile, saves
        preferences and alert flags, then completes onboarding once. Explorer
        opens with the international profile active. No confirmation modal is
        shown and repeated Review edits do not create duplicate profiles.
