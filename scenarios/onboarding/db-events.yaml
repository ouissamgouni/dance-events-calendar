# Upcoming, geocoded events for the onboarding wizard preview surfaces.
#
# Two features read these rows:
#   1. Step 3 "Here's what you'll see" — the live preview keyed on the picked
#      dance styles + reach + the chosen map AREA, using the same GET /events
#      Explorer query. Because it is area-aware, a narrow area far from any
#      seeded venue naturally yields the empty state ("turn on alerts").
#   2. Local step "popular cities" pills — GET /api/events/popular-cities
#      aggregates these by (city, country). Paris has the most upcoming
#      events, so it ranks first.
#
# Coverage: all four dance styles (salsa, bachata, kizomba, zouk), six
# continents, a mix of local/regional/international reach, and dates spread
# across ~18 weeks so the timeline never looks bunched.
#
# `base_week: 0` anchors relative dates to the current week's Monday; `wN`
# offsets are weeks into the future so every row is upcoming.
