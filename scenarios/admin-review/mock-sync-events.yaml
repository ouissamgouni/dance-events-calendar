# The emulated Google source, synced at startup.
# - ev-new-* exist only here: they arrive as New, each with an open
#   "New event" change.
# - ev-live-friday starts at 21:00 here but 20:00 in db-events.yaml, so the
#   first sync proposes a pending Google change.
# - ev-live-sunday is identical in both files: no change.
base_week: 0
events:
