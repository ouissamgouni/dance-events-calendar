    calendar_id: salsa-src
    title: Zouk Night (new)
    location: Club Havana, Oranienstraße 25, 10999 Berlin
    latitude: 52.5016
    longitude: 13.4189
    start: w2 Sat 22:00
    end: w2 Sat 23:59

  - id: ev-new-kizomba
    calendar_id: salsa-src
