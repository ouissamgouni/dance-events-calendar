# --- Following Reviews source. alice/bob/carla are my followees and post
#     public (non-anonymous) reviews → they appear. dave is my followee but
#     posts ANONYMOUSLY → excluded from the Following Reviews feed. ---
ratings:
  - event_id: evt-tribe-p01
    email: alice@example.com
    overall_sentiment: amazing
    comment: "Best marathon of the year — DJs were on fire."
    aspect_scores: { music: 5, atmosphere: 5 }
    aspect_tags:
      - music:great-dj
      - atmosphere:high-energy
    audience_tags:
      - audience:late-night-dancers
    comment_status: approved
    status: approved
    is_anonymous: false

  - event_id: evt-tribe-p02
    email: bob@example.com
    overall_sentiment: great
    comment: "Huge festival, great workshops, a bit pricey."
    aspect_scores: { music: 4, atmosphere: 4, value: 3 }
    aspect_tags:
      - atmosphere:international-crowd
      - value:overpriced
    audience_tags:
      - audience:workshop-lovers
    comment_status: approved
    status: approved
    is_anonymous: false

  - event_id: evt-tribe-p03
    email: carla@example.com
    overall_sentiment: okay
    comment: "Good line-up but the main room was overcrowded."
    aspect_scores: { music: 4, atmosphere: 3, venue-quality: 2 }
    aspect_tags:
      - venue-quality:crowded
      - music:good-variety
    audience_tags:
      - audience:advanced
    comment_status: approved
    status: approved
    is_anonymous: false

  - event_id: evt-tribe-p04
    email: dave@example.com
    overall_sentiment: great
    comment: "Fun social — anonymous review, must not surface in the feed."
    comment_status: approved
    status: approved
    is_anonymous: true
