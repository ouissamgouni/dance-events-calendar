test_plan:
  name: "Program Overview – two-level festival program"
  description: >
    Salsa Grand 2026 (Zagreb) is seeded from docs/programs/salsa-grand-2026.schedule.json
    with both levels: a high-level Overview transcribed from salsagrand.com/program
    (registration, workshops, bootcamp parts, socials, parties with show/artist-hour
    moments) and the detailed Full schedule (35 sessions in 4 rooms). Live Overview
    Social is an overview-only program seeded relative to the start time so the Now
    badge and default-day behaviour can be checked.

  preconditions:
    - "Run: SCENARIO=program-overview task start:scenario RESET_BROWSER=1"
    - "Sign in as Overview Dancer for attendee checks or Dev Admin for editor checks."
    - "Use a phone-sized viewport first, then repeat key steps on desktop."

  steps:
    - id: 1
      title: "Overview opens by default"
      description: "Open Salsa Grand 2026 > Program and select Fri 27."
      expected: >
        Overview and Full schedule tabs appear above the day pills with Overview selected.
        Friday lists, in time order: Registration & Open Office Hours (13:00–20:30),
        Workshops (13:00–17:00), Bootcamp part 1/3 (14:00–16:00, "6-hour class with stage
        performance"), Afternoon social dancing (17:00–20:00), Bootcamp part 2/3, the
        night Registration (22:30–02:00) and Friday Party (22:30–05:00, "All I want for
        Christmas is ... Salsa!") with Artists presentation & Shows (00:00) and Artist hour
        (02:00) listed inside the party card.

    - id: 2
      title: "Category chips filter top-level blocks only"
      description: "Tap Registration, then Party, then All."
      expected: >
        Registration shows only the two registration rows. Party shows only Friday
        Party, still with its two moments. All restores the full day.

    - id: 3
      title: "Drill down from Workshops"
      description: "Tap Workshops (13:00–17:00)."
      expected: >
        The card shows "3 sessions" with a chevron. Tapping opens Full schedule on Friday
        scrolled to 13:00; the three Friday workshops briefly flash and then look normal.
        The URL contains view=schedule&focus=…. Phone/browser Back returns to the Overview.

    - id: 4
      title: "Drill down from a party"
      description: "On Saturday tap Saturday Grand Gala Night, then Back."
      expected: >
        The grid opens on Saturday at 22:30 with Gala Salsa & Mambo Night flashing. The
        Gala's moments (Show performances 23:30, Artist hour 02:00) stay on Saturday's
        Overview even though they are after midnight (day starts at 07:00).

    - id: 5
      title: "Blocks without a detailed schedule"
      description: >
        Tap a Bootcamp part, Friday's Artist hour moment, a Registration row and
        Artists presentation & Shows.
      expected: >
        Bootcamp opens an info sheet with day, time, venue, a "Bootcamp details"
        link that opens salsagrand.com in a new tab and an "In My Plan · Remove" footer
        (part 1/3 is pre-planned). Artist hour opens a sheet with
        "Catch your favorite artist on the dance floor!" and "Part of Friday Party".
        Registration rows and Artists presentation & Shows are static (no tap
        affordance) because they have no description, link or detailed schedule.

    - id: 6
      title: "Full schedule filters show socials and parties"
      description: "Switch to Full schedule and open Filter schedule."
      expected: >
        Activity type chips include Workshop, Social and Party (previously the combined
        "Social & Party" type was hidden). Switching tabs keeps the selected day.

    - id: 7
      title: "Overview-only program"
      description: "Open Live Overview Social > Program."
      expected: >
        No Overview/Full schedule tabs and no Filter schedule bar are shown. Today is
        selected. Doors & registration shows a Now badge and opens its info sheet.
        Riverside Salsa Night lists Live band set and Last dance inside its card;
        Live band set opens its sheet. Tomorrow shows Recovery picnic with a
        "Picnic map" link.

    - id: 8
      title: "Edit the Overview as admin"
      description: >
        As Dev Admin open Salsa Grand 2026 > Program > Edit program. Inspect the Overview
        section on Friday, then use "+ Add moment" on Friday Party and save a
        "Midnight toast" at 00:30.
      expected: >
        Overview is the first section and opens by default. Linked items show
        "→ N sessions in full schedule" (Workshops → 3, Friday Party → 1). The new moment
        pre-fills Part of = Friday Party and hides "Has detailed schedule". After saving,
        Publish shows one change; the attendee route only shows the moment after publishing.

    - id: 9
      title: "Editor validation"
      description: >
        Edit Workshops and set the end before the start; then turn on "Has detailed
        schedule" for Registration & Open Office Hours (13:00–20:30).
      expected: >
        Saving with an invalid range shows an error and keeps the dialog open. The
        Registration editor shows a live "N sessions start in this window" hint; if saved
        with the link on, attendees would drill into the grid, so keep it off for
        Registration.

    - id: 10
      title: "Export and re-import"
      description: "In Settings, click Download schedule, then Reset to current draft and Preview import (Merge)."
      expected: >
        The downloaded JSON contains overview_items with parent_external_id on moments.
        The preview reports no updates (everything unchanged).

    - id: 11
      title: "Bootcamp parts in My Plan"
      description: >
        As Overview Dancer open Salsa Grand 2026 > Program on Fri 27, then open My Plan.
      expected: >
        Each Bootcamp card has a bookmark button; part 1/3 shows it filled (pressed) and a
        Bootcamp Buddy avatar under the card. Part 2/3 can be added with one tap (no sheet).
        My Plan lists Bootcamp part 1/3 (subtitle "6-hour class with stage performance",
        brown Bootcamp left stripe) next to Salsa Romantica, both with a "Time conflict" warning.
        Workshops, parties and registration cards have no bookmark button.

    - id: 12
      title: "Friends and calendar export"
      description: >
        Open Bootcamp part 1/3, tap the Who's attending row, go back; then in My Plan open the
        share/export menu and download the calendar.
      expected: >
        The attendee list shows Bootcamp Buddy. The .ics contains the bootcamp part with its
        Overview time (14:00–16:00 Zagreb) alongside the planned session. Removing part 1/3
        from My Plan clears the conflict on Salsa Romantica.

    - id: 13
      title: "Organizer changes reach planners"
      description: >
        As Dev Admin edit Bootcamp part 1/3, move it to 14:30 and Publish. Sign back in as
        Overview Dancer (with the item still planned) and open Notifications.
      expected: >
        A Program update notification says the bootcamp part "has a new time"; tapping it
        opens My Plan with the bootcamp sheet. In the editor only top-level items show
        "Attendees can add to My Plan" (hidden for moments); plannable items show a green
        "Attendees can add to My Plan" line on their Overview card.

    - id: 14
      title: "Activity-type colors"
      description: >
        Switch to Full schedule on Friday, open Filter schedule, then as Dev Admin change
        Settings > "Color sessions in the grid" to By room / By activity type and publish.
      expected: >
        The imported program uses "Activity type stripe": cells keep their room tint and get a colored left
        stripe per activity type (workshops blue, yoga/talk/social/party in their colors) while
        room headers keep the room tints; filter chips and Overview category chips show the
        matching color dot. "By room" restores room-tinted cells; "By activity type" tints whole
        cells by type. The printable export follows the same mode.
