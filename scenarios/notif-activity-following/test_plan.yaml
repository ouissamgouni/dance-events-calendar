test_plan:
  name: "Friends & social — activity notification"
  description: >
    The `social_activity` feature: when someone follows you
    (`new_follower`) or you become mutual friends (`new_friend`),
    followers get an in-app row immediately (plus push when enabled),
    and the activity folds into the batched activity digest email.
    Split apart from `friends_going` (Going-to-event) — this scenario
    covers follows + friendships only.

  preconditions:
    - "Start Mailpit: `mailpit --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025`"
    - >-
      Start scenario:
      `SCENARIO=notif-activity-following RESET=1 task start:scenario`
    - "Open the Mailpit inbox at http://127.0.0.1:8025 and clear existing messages."
    - >-
      For the push step: in a Chromium browser sign in as Bob
      (bob@example.com), open /account#notifications and click "Enable
      push notifications" so a live PushSubscription row is bound to Bob.

  cast:
    - "Bob   — recipient; social_activity email + push ON."
    - "Dave  — recipient; social_activity email + push OFF (opt-out probe)."
    - "Alice — actor; mutual friend of Bob (new_friend)."
    - "Carol — actor; follows Bob and Dave (new_follower)."

  steps:
    - id: 1
      title: "In-app rows fire for the recipients"
      description: >
        `GET /api/notifications` as Bob and Dave.
      expected: >
        Bob has a `new_follower` row from Carol ("Carol started following
        you") and a `new_friend` row from Alice ("You and Alice are now
        friends"). Dave has a single `new_follower` row from Carol.

    - id: 2
      title: "Actors are not self-notified"
      description: >
        `GET /api/notifications` as Carol.
      expected: >
        Carol has no `new_follower` rows for the follows she initiated.
        (Alice does have a `new_friend` row from Bob — the mutual pair
        notifies both sides.)

    - id: 3
      title: "Immediate push + instant email to Bob"
      description: >
        Trigger a plain dispatch tick:
        `SCENARIO=notif-activity-following task notify:trigger:scenario`.
        Neither push nor instant email is gated by the digest schedule;
        settings.yaml enables social_activity INSTANT email mode.
      expected: >
        `activity.pushed` counts Bob's rows (pushed_at stamped) AND Bob
        receives an INSTANT email right away (instant_emailed_at stamped)
        containing "Carol started following you" and "You and Alice are
        now friends". Dave (email + push OFF) receives neither.

    - id: 4
      title: "Digest email on the forced tick"
      description: >
        `SCENARIO=notif-activity-following task notify:trigger:scenario -- --immediate-emails`
        `--immediate-emails` passes `force=True` so the per-user digest
        schedule is bypassed for this run only. Digest mode is still on
        (default) alongside instant.
      expected: >
        Bob (email ON) receives a second, DIGEST email (emailed_at
        stamped) containing "Carol started following you" and "You and
        Alice are now friends". Dave (email OFF) receives 0 emails.

    - id: 5
      title: "Per-feature Send now (admin)"
      description: >
        In the admin Notifications tab, open the "Friends & social" card
        and use its "Send now" with Bob selected.
      expected: >
        Only Bob's `new_follower` / `new_friend` activity is replayed as
        an immediate email — other features' pending activity is
        untouched.
