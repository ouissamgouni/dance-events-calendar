# Series detection matches across calendars (a festival's yearly editions are
# often listed by different organizers/aggregators). "city-aggregator" holds
# cross-posted copies and other editions to prove both matching across
# calendars and the guards around it (same occurrence, no location).
calendars:
  - id: "riverside-dance"
    name: "Riverside Dance"
    color: "#7c3aed"
  - id: "city-aggregator"
    name: "City Aggregator"
    color: "#0ea5e9"
