# Auto-detection is intentionally OFF so the scenario exercises the manual
# "Scan now" action in the Series panel. The detection thresholds are left
# at their defaults (title 72%, 395 days, 300 m venue radius, 50 km cutoff,
# cross-calendar on, approved series reopened on a new occurrence) and are
# edited from the Series panel's Settings tab during the test plan.
settings:
  series_auto_detect_enabled: false
