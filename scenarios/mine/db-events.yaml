# --- My Reviews: three approved reviews authored by me. The remaining three
#     attended past events (p04/p05/p06) are intentionally left unrated so
#     they surface as pending review prompts (Overview + /mine/reviews). ---
ratings:
  - event_id: evt-mine-p01
    email: me@example.com
    overall_sentiment: great
    comment: "Lovely floor and friendly crowd — my go-to Friday social."
    aspect_scores: { music: 5, atmosphere: 5, venue-quality: 4 }
    aspect_tags:
      - music:great-dj
      - atmosphere:friendly-crowd
      - venue-quality:great-dance-floor
    audience_tags:
      - audience:meet-new-people
    comment_status: approved
    status: approved
    is_anonymous: false

  - event_id: evt-mine-p02
    email: me@example.com
    overall_sentiment: amazing
