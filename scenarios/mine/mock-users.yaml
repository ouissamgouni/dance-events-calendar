#   * me    — the POV account. Rich retrospective journey (6 past attended
#     events across 6 cities / 5 countries incl. international) plus a
#     couple of upcoming saved/going events. Passport is public. Authors
#     3 approved reviews; 3 attended past events are left unrated so they
#     surface as pending review prompts.
#   * nina, omar — mutual friends of me (feed the passport friends count
#     and the Tribe network). See db-follows.yaml.
#   * priya — follows me one-way (a follower, no follow-back).
#   * quinn — pending inbound follow request (Network requests panel).
#   * admin — matches ADMIN_EMAIL (kept for parity with other scenarios).
