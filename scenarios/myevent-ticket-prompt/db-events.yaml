    calendar_id: ticket-prompt-cal
    title: Paris International Salsa Congress Gala
    location: Studio Harmonic, Paris, France
    latitude: 48.8566
    longitude: 2.3522
    start: now+144h
    end: now+149h
    tags: [dance-style:salsa, format:social, reach:international]

  - id: evt-tp-festival
