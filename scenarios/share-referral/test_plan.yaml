test_plan:
  name: "Phase E (D2) — share-link doubles as referral"
  description: >
    Verify the share-link invite: an anon visitor arriving on a
    ``?ref=share&src=<share_code>`` event URL gets a one-time sheet
    offering to follow the sharer. After sign-up they land back on the
    event and the follow is applied automatically (one-way; the sharer is
    NOT auto-followed back). Self-shares and already-connected viewers
    see nothing, and the invite belongs to the tab that opened the link
    (cleared on sign-out). Share-link conversions do NOT show up in the
    E7 referral leaderboard. Friend-invite links (``&inv=<invite code>``,
    mutual friendship) are covered by the rsvp-people-sheet scenario.

  preconditions:
    - "task start:scenario SCENARIO=share-referral"
    - "Pre-seeded users: sharer, viewer, admin."
    - "Use a fresh browser profile or incognito when switching users."

  steps:
    - id: 1
      title: "Capture the sharer's share_code"
      description: >
        Sign in as sharer (Dev Mock). Open DevTools → GET /api/auth/me
        and copy the ``share_code`` field. Sign out.
      expected: "share_code is a lowercase 8-char base32 token."

    - id: 2
      title: "Anon visitor lands on a ?ref=share&src=<code> URL → invite sheet"
      description: >
        In an INCOGNITO window, navigate to
        ``/event/evt-sr-001?ref=share&src=<share_code>`` (the
        scenario seeds ``evt-sr-001`` for exactly this purpose). Stay
        signed out.
      expected: >
        A one-time sheet ``data-testid="share-referral-sheet"`` opens
        over the event page (bottom sheet on mobile, centered modal on
        desktop): "Sharer shared this event", "Follow them to see where
        they're dancing next.", buttons "Not now" + "Sign up to follow".
        No banner under the nav, and the generic ``SignUpBanner`` stays
        hidden while the invite is pending. sessionStorage holds
        ``movida_share_prompt``.

    - id: 3
      title: "Sign up as viewer → auto-follow and land back on the event"
      description: 'Click "Sign up to follow", complete the Dev Mock login as viewer (and onboarding if shown).'
      expected: >
        The sign-in sheet opens in place (no jump to the home page).
        After sign-in (and onboarding, which returns to the event), a
        single POST /api/auth/redeem-share-follow fires automatically
        (``follow_created: true``) and a toast reads "You're now following
        Sharer". The user is on ``/event/evt-sr-001``. The reverse edge
        is NOT created.

    - id: 4
      title: '"Not now" closes the invite for this tab'
      description: >
        Repeat step 2 in a fresh incognito, click "Not now", then reload
        the page (URL still carries ``?ref=share``).
      expected: >
        The sheet closes and does not reappear on reload
        (``movida_share_prompt`` is marked done). No follow is created.

    - id: 5
      title: "Already following → no prompt"
      description: >
        As viewer (who follows sharer after step 3), open the same link
        in a new tab.
      expected: >
        GET /api/social/share-source/<code> returns ``viewer_follows:
        true``; no sheet is shown.

    - id: 6
      title: "Negative: sharer arriving on their own link sees nothing"
      description: >
        Sign in as sharer, then visit
        ``/event/<id>?ref=share&src=<their own share_code>``.
      expected: >
        No sheet — self-shares are filtered client-side
        (`user.share_code === shareCode`).

    - id: 7
      title: "Two accounts on one device: the invite does not carry over"
      description: >
        In one browser: open the link signed out, sign in as viewer
        WITHOUT accepting (close the sign-in sheet, then sign in via the
        menu), sign out, then sign in as admin and browse to the event
        without the ``?ref=share`` params.
      expected: >
        Sign-out clears ``movida_share_prompt``; admin never sees the
        invite sheet. The invite also never shows on other pages
        (e.g. ``/browse``) — only on the shared event.

    - id: 8
      title: "Negative: share-link conversion does NOT bump E7 leaderboard"
      description: >
        Sign in as sharer. Open the share-link Account card. Note
        ``used_count`` on the displayed referral. (It will be 0
        because the sharer never minted an E7 invite code.) DevTools:
        GET /api/social/me/referral confirms ``used_count: 0`` even
        after step 3 redeemed the share-link.
      expected: >
        ``used_count`` remains 0. Share-link conversions are
        tracked separately and do NOT credit the inviter on the
        E7 leaderboard (D2 decision).
