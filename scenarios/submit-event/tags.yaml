tag_groups:
  # Slugs are load-bearing: db-events.yaml references them as "<group>:<tag>",
  # and a scenario tags.yaml replaces the default file rather than merging.
  - slug: format
    label: Event type
    ordinal: 10
    allow_multiple: true
    color: "#f472b6"
    tags:
      - slug: social
        label: Social
      - slug: party
        label: Party
      - slug: class
        label: Class
      - slug: workshop
        label: Workshop
      - slug: festival
        label: Festival
      - slug: congress
        label: Congress
      - slug: bootcamp
        label: Bootcamp
      - slug: competition
        label: Competition
      - slug: performance
        label: Performance

  # Eight styles so the Step 2 chip row overflows and must scroll horizontally.
  - slug: dance-style
    label: Dance style
    ordinal: 20
    allow_multiple: true
    onboarding_eligible: true
    color: "#fb923c"
    tags:
      - slug: salsa
        label: Salsa
      - slug: bachata
        label: Bachata
      - slug: kizomba
        label: Kizomba
      - slug: zouk
        label: Zouk
      - slug: semba
        label: Semba
      - slug: rueda
        label: Rueda
      - slug: cha-cha
        label: Cha-Cha
      - slug: son
        label: Son

  - slug: reach
    label: Event reach
    ordinal: 25
    allow_multiple: false
    onboarding_eligible: true
    color: "#a78bfa"
    tags:
      - slug: local
        label: Local
      - slug: regional
        label: Regional
      - slug: international
        label: International

  - slug: level
    label: Level
    ordinal: 30
    allow_multiple: true
    color: "#60a5fa"
