        label: Beginner-Friendly
      - slug: intermediate
        label: Intermediate
      - slug: advanced
        label: Advanced
      - slug: all-levels
        label: All Levels

  - slug: venue
    label: Venue
    ordinal: 40
    allow_multiple: true
    color: "#34d399"
    tags:
      - slug: indoor
        label: Indoor
      - slug: outdoor
        label: Outdoor
      - slug: rooftop
        label: Rooftop

  - slug: music
    label: Music / format
    ordinal: 45
    allow_multiple: true
    color: "#f59e0b"
