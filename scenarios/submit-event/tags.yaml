  - slug: access
    label: Audience / access
    ordinal: 48
    allow_multiple: true
    color: "#38bdf8"
    tags:
      - slug: couples
        label: Couples
      - slug: singles-welcome
        label: Singles welcome
      - slug: lgbtq-friendly
        label: LGBTQ+ friendly
