#   dana  — 0 friends, follows cur1 + cur2 (like after onboarding)
#   gina  — 0 friends, has an unreviewed event (review prompt wins the session)
#   eli   — 5 friends (f1..f5)
#   fay   — 12 friends (f1..f12)
#   newbie1 — joined yesterday, friends with f1          → eli + fay notified
#   newbie2 — joined yesterday, follows cur1 only         → nobody (1 curator)
#   newbie3 — joined yesterday, follows cur1 + cur2       → dana notified (2 curators)
#   newbie4 — joined yesterday, private, follows f1       → nobody
#   newbie5 — joined yesterday, hidden from suggestions   → nobody
