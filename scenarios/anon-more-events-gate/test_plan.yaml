test_plan:
  name: "Anonymous 30-day horizon gate"
  description: >
    Verify the signed-out time-horizon gate: anonymous visitors only see
    events starting within the next N days (admin setting "Signed-out
    horizon (days)", default 30) across the explorer list, explorer map and
    calendar. Later events are replaced by a sign-in lock. The event API is
    unchanged (frontend-only rule). Event discussions are readable only when
    signed in.

  preconditions:
    - "Run with: task start:scenario SCENARIO=anon-more-events-gate BROWSER=isolated RESET_BROWSER=1"
    - >
      Use a fresh isolated browser profile and stay signed out until the step
      explicitly says to sign in.
    - >
      Seed data contains 13 public events in weeks 1–4 (evt-gate-001..013,
      inside the 30-day horizon) and 5 more events in weeks 6–11
      (evt-gate-014..018, past the horizon).

  steps:
    - id: 1
      title: "Anonymous list shows every in-horizon event, then the lock"
      description: >
        Open / on a desktop viewport as an anonymous visitor. Keep the default
        "Next 3 months" period. Page through the list with "+ N more".
      expected: >
        • All 13 in-horizon events (evt-gate-001..013) can be reached via the
          normal "+ N more" pagination.
        • After the last one, a blue lock panel
          (data-testid="event-list-more-events-gate") reads "Sign in to unlock
          5 more events after <date 30 days from today>." with a "Sign in to
          see more" button.
        • No "Search later dates" button is shown.

    - id: 2
      title: "Explorer map hides events past the horizon"
      description: >
        Look at the desktop map (or open the full-screen map on mobile).
      expected: >
        • Only markers for evt-gate-001..013 are shown; none for
          evt-gate-014..018.
        • A chip (data-testid="explorer-map-horizon-lock") reads "5 more events
          after <date> Sign in"; clicking it opens the sign-in sheet with the
          headline "See every upcoming event".

    - id: 3
      title: "Changing filters or dates does not bypass the horizon"
      description: >
        Switch to a wider preset such as "Next 6 months", or toggle a tag
        filter.
      expected: >
        • Events past the horizon still never appear in the list or on the map.
        • The lock count updates to match the current filters.

    - id: 4
      title: "Calendar locks days past the horizon"
      description: >
        Switch to the Calendar view and navigate forward with the "next"
        arrow until you pass the horizon date.
      expected: >
        • Day cells after the horizon are hatched/muted and contain no events.
        • A lock card (data-testid="calendar-horizon-lock") above the calendar
          shows how many matching events in the visible range are locked.
        • The calendar map shows no markers for locked events.

    - id: 5
      title: "Event discussion is locked for anonymous visitors"
      description: >
        Open any event detail page that has discussion posts and switch to the
        Discussion tab.
      expected: >
        • The tab shows the post count and a "Sign in to read" panel
          (data-testid="discussion-signin-lock"), with no post bodies, author
          names or avatars.
        • GET /api/events/<id>/messages returns items: [] with the real total.

    - id: 6
      title: "Signing in unlocks everything in place"
      description: >
        Click "Sign in to see more" from the list lock and use the dev-auth
        button for "Gate Viewer".
      expected: >
        • The app stays on the same explorer route and query string.
        • The lock panel, map chip and calendar hatching are gone.
        • Later fixtures appear: "Prague Salsa Marathon Preview"
          (evt-gate-014), "Vienna Bachata Exchange" (evt-gate-015),
          "Zurich Sunday Social" (evt-gate-016), "Copenhagen Salsa Boat Party"
          (evt-gate-017), and "Dublin Bachata Weekender Kickoff"
          (evt-gate-018).

    - id: 7
      title: "Admin can change or disable the horizon"
      description: >
        As an admin, open Admin → settings and set "Signed-out horizon (days)"
        to 7, then 0. Re-check / signed out after each change.
      expected: >
        • With 7, only events in the next 7 days are visible to signed-out
          visitors and the lock date moves accordingly.
        • With 0, signed-out visitors see every event and no lock is shown.
