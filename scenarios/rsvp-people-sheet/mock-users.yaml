#   - ana, bea   — mutual friends of viewer         -> "Your people going"
#   - leo        — viewer follows (one-way)         -> "Your people going"
#   - paz        — viewer has a PENDING request     -> excluded everywhere
#   - mia        — stranger, friends with ana + bea -> "Also going", 2 mutual friends
#   - sam        — stranger, friends with ana       -> "Also going", 1 mutual friend
#   - tom, zoe   — strangers, no mutuals            -> "Also going" (zoe falls past the cap of 3)
#   - kai        — friends-only RSVP, not a friend  -> hidden from viewer
#   - hid        — private RSVP                     -> never shown
#   - newbie     — receiver of the friend-invite share (no follows)
