test_plan:
  name: "Milestones — personal unlock email routing"
  description: >
    Personal Dance Passport milestone unlocks (`milestone_unlocked`) are
    configurable notification with its own admin "Milestones" box. In-app
    and push are always immediate. Email delivery is admin-routed per
    feature. Milestones discovered by one evaluation render and deliver as
    one group while retaining one database row per milestone. With instant
    OFF / digest ON (the default), the group arrives through the activity
    digest; with instant ON, the milestone service sends one rich grouped
    email immediately.

  preconditions:
    - "Start Mailpit: `mailpit --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025`"
    - >-
      Start scenario:
      `SCENARIO=notif-milestone-email RESET=1 task start:scenario`
    - "Open the Mailpit inbox at http://127.0.0.1:8025 and clear existing messages."
    - >-
      Alice attends five past events, enough to unlock "First Steps" and
      "Regular" in one evaluation.

  cast:
    - "Alice — the only dancer; unlocks First Steps + Regular. Milestone email + push ON."
    - "Admin — signs in to the admin panel to configure the Milestones box."

  steps:
    - id: 1
      title: "Milestones box renders in the admin panel"
      description: >
        Sign in as Admin and open the Notifications section of the admin
        panel.
      expected: >
        A dedicated "Milestones" box shows a master toggle (ON), a per-user
        count line ("N email · M push enabled"), and a "Milestone unlocked"
        card with Email delivery Instant/Digest checkboxes (Instant off,
        Digest on) plus a "Send now" control.

    - id: 2
      title: "Digest mode (default) — unlock defers email to the digest"
      description: >
        With Instant OFF / Digest ON, trigger a dispatch tick:
        `SCENARIO=notif-milestone-email task notify:trigger:scenario`.
      expected: >
        Alice gets ONE visible in-app item saying she unlocked 2 milestones
        and naming First Steps and Regular. Two atomic `milestone_unlocked`
        rows share a non-null group_key and member_ids contains both IDs.
        ONE immediate push names both milestones; both rows have pushed_at
        stamped. NO email arrives yet because instant is off.

    - id: 3
      title: "Digest email delivered on the forced tick"
      description: >
        Trigger a forced tick so the per-user digest schedule is bypassed:
        `SCENARIO=notif-milestone-email task notify:trigger:scenario -- --immediate-emails`.
      expected: >
        Alice receives ONE activity digest email with one logical milestone
        item saying she unlocked 2 milestones and naming First Steps and
        Regular. Both raw rows have emailed_at stamped.

    - id: 4
      title: "Master toggle OFF suppresses milestone notifications"
      description: >
        In the Milestones box, turn the master toggle OFF, RESET the
        scenario, and trigger a dispatch tick.
      expected: >
        No `milestone_unlocked` row is created, no push, and no email —
        the master switch gates the whole feature
        (`{"skipped": "milestone_notifications_disabled"}`).

    - id: 5
      title: "Instant mode — rich immediate email"
      description: >
        Re-enable the master toggle, tick the "Instant" Email-delivery
        checkbox on the "Milestone unlocked" card, RESET the scenario, and
        trigger a plain dispatch tick (no `--immediate-emails`).
      expected: >
        Alice receives ONE rich grouped email immediately with no schedule
        wait, naming First Steps and Regular. Both rows have
        instant_emailed_at stamped. ONE grouped push also fires immediately;
        the digest track is untouched (emailed_at stays NULL).

    - id: 6
      title: "Send now delivers pending milestone email on demand"
      description: >
        Back in digest mode (Instant OFF), after a tick has created a
        pending milestone row, use the Milestones card "Send now" for Alice.
      expected: >
        Alice immediately receives the pending milestone via the digest
        send-now path, bypassing the schedule and the once-per-day gate.

    - id: 7
      title: "Dedup on repeat ticks"
      description: >
        Trigger a second dispatch tick without any new attendance.
      expected: >
        Alice still has exactly two atomic `milestone_unlocked` rows and one
        visible grouped item. The `subject_key` dedupe prevents duplicate
        rows, email, and push.

    - id: 8
      title: "A later evaluation forms a separate group"
      description: >
        After the first group is delivered, add enough new past attendance to
        cross another milestone threshold and trigger another dispatch tick.
      expected: >
        The newly unlocked milestone has a different group_key and appears as
        a separate in-app item. Reading either item does not mark the other
        item read.
