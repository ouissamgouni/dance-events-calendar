# Pre-seeded organizer claims for the Organizer Claims scenario.
#
#   - kind: "badge"  → organizer request; may carry events decided in the
#                       same review. Approval flips ``is_verified_organizer``.
#   - kind: "events" → later event claims from an already-verified organizer.
#   Approved events are attributed to the organizer, who is auto-marked
#   Going (public).
#
# Seeded:
#   1. Olive — approved badge claim plus an approved events claim covering
#      evt-organizer-001 ("Organized by @olive ✓" from boot).
#   2. Carl — pending organizer request with evt-organizer-002 attached.
organizer_claims:
  # Olive — verified-organizer status (badge approved).
  - submitter_email: organizer@example.com
    kind: badge
    grant_badge: true
    status: approved
    admin_notes: Verified via instagram bio link.

  # Olive — events claim approved for evt-organizer-001.
  - submitter_email: organizer@example.com
    kind: events
    status: approved
    admin_notes: Confirmed organizer of the Friday social series.
    events:
      - event_id: evt-organizer-001
        decision: approved

  # Carl — pending organizer request with one event attached. Admin
  # decides the badge and the event in the same review.
  - submitter_email: claimant@example.com
    kind: badge
    grant_badge: true
    status: pending
    events:
      - event_id: evt-organizer-002
        decision: pending
