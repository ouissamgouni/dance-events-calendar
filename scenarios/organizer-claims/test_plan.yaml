test_plan:
  name: "Organizer Claims — critical path"
  description: |
    Verify the user-submitted organizer-claim feature end-to-end.

    One organizer request covers the verified badge and, optionally, up
    to 20 events — decided together by an admin. Requests start from
    Settings → "Are you an event organizer?" or from an event's •••
    menu ("I organize this event"); both open the same bottom sheet,
    which lets the user add a bio and social link in place. While a
    request is pending, claiming more events adds them to it. Once
    verified, further claims are events-only. Approved events show
    "Organized by" and the organizer is auto-marked Going (public).
    Organizer edits and cancellation requests wait for admin review.
    Organizers manage their events from /hosting; their profile gets a
    "Hosting" tab. Admins can also assign organizers directly.

    Seeded:
      - Olive Organizer: verified and attributed to evt-organizer-001.
      - Carl Claimant: bio + Instagram set, pending organizer request
        with evt-organizer-002 attached.
      - Nora NoProfile: no bio / no socials.

    Sign-in tip: at /login, dev mode shows one button per mock user.
    Use "Dev Admin" for admin steps, "Carl Claimant" / "Olive Organizer"
    / "Nora NoProfile" for user-facing steps.

  steps:
    - id: 1
      title: "Verified organizer pill on event detail"
      description: |
        Sign in as "Dev User" (or stay signed-out). Open
        evt-organizer-001 from the calendar.
      expected: |
        Below the date row, an "Organized by @olive ✓" pill is
        rendered (blue verified mark). Clicking it navigates to
        /u/olive.

    - id: 2
      title: "Organizer's own calendar shows the attributed event"
      description: |
        Open Olive's public profile at /u/olive.
      expected: |
        evt-organizer-001 appears in her "Going" / public calendar
        section — the events-claim approval automatically marked her as
        publicly going on it.

    - id: 3
      title: "Requirements unlock in place, no refresh"
      description: |
        Sign in as "Nora NoProfile" (no bio, no socials). Open
        evt-organizer-003, open the ••• menu and tap "I organize this
        event". In the bottom sheet, add a bio (Save bio), then an
        Instagram handle (Save link).
      expected: |
        The sheet shows "Open Kizomba Class" as a chip and a checklist.
        "Send request" stays disabled until both items are ticked, then
        enables immediately — no page reload. Sending shows "Request
        sent" with a "Track your request in Settings" link. On /account
        the bio and Instagram editors already show the new values.

    - id: 4
      title: "Settings — Carl's request in review"
      description: |
        Sign in as "Carl Claimant" and open /account (or /account#organizer).
      expected: |
        The organizer card shows "In review" with evt-organizer-002
        listed (removable ✕), plus "Add events" and "Withdraw request".

    - id: 5
      title: "Add events to a pending request"
      description: |
        Still as Carl, tap "Add events", search "Kizomba", pick
        evt-organizer-003 and tap "Add 1 event to my request". Then open
        evt-organizer-001's ••• menu.
      expected: |
        The card now lists both events under the same request.
        evt-organizer-001 (already organized by Olive) has no
        "I organize this event" item; in the sheet search it shows
        "Has an organizer" and can't be picked.

    - id: 6
      title: "Admin review queue (mobile)"
      description: |
        Sign in as "Dev Admin" on a phone-sized viewport. Open /admin →
        Data tab → "Organizer Claims". Tap Carl's request.
      expected: |
        The queue is full-screen with "To review / Approved / Not
        approved" chips. The review bottom sheet shows Carl's joined
        date, organized-events count, bio, Instagram/Profile buttons,
        and one Approve/Reject switch per event (Approve by default).
        Footer: "Reject" and "Approve organizer + 2 events".

    - id: 7
      title: "Admin approves Carl with one event"
      description: |
        Switch evt-organizer-003 to Reject, then tap
        "Approve organizer + 1 event".
      expected: |
        The request leaves "To review". Carl is verified,
        evt-organizer-002 shows "Organized by @carl ✓" and appears on
        /u/carl (Hosting tab and public calendar); evt-organizer-003
        stays unattributed. Carl gets an "Your organizer request was
        approved" notification that opens /account#organizer.

    - id: 8
      title: "Rejecting with a reason"
      description: |
        As Nora's request reviewer (Dev Admin), open Nora's request →
        Reject → pick "We couldn't confirm you organize these events." →
        Confirm rejection. Sign in as Nora and open /account.
      expected: |
        Nora's card reads "Your last request wasn't approved" with the
        reason, and offers "Request again".

    - id: 9
      title: "Hosting hub"
      description: |
        Sign in as Carl. Open the menu → "Hosting" (or /hosting).
      expected: |
        Upcoming lists evt-organizer-002 with going / saved / views
        counts and "Edit" / "Cancel event" actions.

    - id: 15
      title: "Organizer edit goes to review"
      description: |
        As Olive, open evt-organizer-001 → ••• → "Edit event", move the
        start one hour later → Next → Next → "Submit for review".
      expected: |
        "Changes sent for review". The event page still shows the old
        time; /hosting shows "Change in review". Events I added lists
        the change as "Waiting for review".

    - id: 16
      title: "Admin applies the organizer edit; attendees are told"
      description: |
        As Dev User, save evt-organizer-001 first. As Dev Admin, open
        evt-organizer-001 in the side panel and apply Olive's pending
        change. Then check Dev User's and Olive's notifications.
      expected: |
        The new time is live. Dev User has an "Event updated · …"
        notification with the time diff; Olive gets "change applied".

    - id: 17
      title: "Admin reverts an organizer edit"
      description: |
        As Dev Admin, open evt-organizer-001 in the side panel → Show change
        history → Revert on Olive's change.
      expected: |
        The original time is back on the event page. History adds an
        applied "Admin draft" entry with the inverse diff; Dev User gets a
        second "Event updated" notification because the first one notified
        attendees.

    - id: 18
      title: "Organizer cancellation is reviewed, then announced"
      description: |
        As Olive, on evt-organizer-001 open ••• → "Cancel event", type
        "Venue flooded" and tap "Request cancellation". As Dev Admin,
        apply the pending change.
      expected: |
        Nothing changes until the admin applies it. Afterwards the event
        page shows a red "This event is cancelled — Venue flooded" banner,
        cards show a "Cancelled" chip, and Dev User gets "Event updated ·
        Cancelled: Venue flooded".

    - id: 19
      title: "Admin assigns an organizer directly"
      description: |
        As Dev Admin, /admin → Users → Nora → "Organizer". Search
        "Kizomba" and tap "Assign". Then open evt-organizer-003 in the
        admin event side panel.
      expected: |
        Nora becomes verified and evt-organizer-003 lists under her
        events; the side panel's Organizer field shows @nora with
        Change / Remove.

    - id: 14
      title: "Feature flag off → UI disappears"
      description: |
        As Dev Admin, in /admin → Configuration tab, toggle
        "Organizer claims" off. Reload evt-organizer-001 and /account.
      expected: |
        The "Organized by" pills and "I organize this event" items are
        hidden. On /account, the organizer card disappears and /hosting
        says it isn't available. The "Organizer Claims" button in the
        admin Data toolbar still works (admin endpoints are not
        flag-gated).
