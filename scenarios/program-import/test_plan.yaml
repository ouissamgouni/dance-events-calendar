test_plan:
  name: "Reviewed JSON schedule import"
  description: >
    Starts with an empty private schedule draft. The checked-in schedule-import.json
    exercises examples, default taxonomies, preview, merge, replace, stable external
    IDs and separate publishing. Publishing and notification choices are covered in
    depth by the program-admin scenario.

  preconditions:
    - "Run: SCENARIO=program-import task start:scenario RESET_BROWSER=1"
    - "Sign in as Dev Admin and open Schedule Import Lab > Schedule > Settings."
    - "Use scenarios/program-import/schedule-import.json as the upload file."

  steps:
    - id: 1
      title: "Compare example and current draft"
      description: >
        In Settings, click Load example, inspect the sample venue/session external IDs,
        then click Reset to current draft.
      expected: >
        Load example shows a populated standalone Sample document while Reset returns
        to the empty current draft. Neither action changes the draft until Preview and Apply.

    - id: 2
      title: "Preview a merge import"
      description: "Choose schedule-import.json, keep Merge selected, and click Preview import."
      expected: >
        The preview reports the prospective creates and no schedule warnings. The
        schedule grid remains empty because preview rolls the transaction back.

    - id: 3
      title: "Apply only after preview"
      description: "Click Apply to draft after the preview completes."
      expected: >
        The private draft refreshes with Kulturhaus, two rooms, Open Level, Workshop,
        Registration and Party types, two Friday sessions and four Overview items
        (Registration, Workshops, Friday Party with a Teacher demo moment). Nothing is public yet.

    - id: 4
      title: "Verify idempotent merge"
      description: "Preview and apply the same JSON again."
      expected: "No duplicate rows are created; the import reports unchanged records."

    - id: 5
      title: "Verify replace semantics"
      description: >
        Remove fri-partnerwork from the JSON text, choose Replace program,
        preview, then apply.
      expected: >
        The mode hint says the draft becomes exactly the JSON. Preview reports the
        Partnerwork Lab removal plus the unused seeded taxonomy the JSON does not
        list (for example Bootcamp and Beginner). Applying soft-deletes Partnerwork
        Lab while keeping every row the JSON still lists, such as Studio Two and
        Open Level, with the same identity.

    - id: 6
      title: "Publish the imported program"
      description: >
        Open Publish, review the diff, keep "Notify attendees" on and tap
        "Publish & notify".
      expected: >
        A new immutable publication is created only now. The attendee Program shows
        the imported draft state, with Berlin local wall-clock times preserved. The
        default message is "The program is live: N sessions over N days. Build your
        plan." and does not repeat the event name.

    - id: 7
      title: "Preview the attendee Program in place"
      description: "Click Preview in the schedule header."
      expected: >
        The draft Program renders inside the modal without a blocked-content message.
        Open in new tab remains available as a fallback.

    - id: 12
      title: "Omitting overview_items leaves the Overview untouched"
      description: >
        In Settings, delete the whole "overview_items" key from the JSON text, choose
        Replace program, preview and apply. Open the Overview section.
      expected: >
        Preview reports no Overview removals and the four Overview items are still
        there. Only an explicit list replaces the Overview.

    - id: 13
      title: "An explicit empty list clears the Overview"
      description: >
        Set "overview_items": [] with Replace program, preview, then cancel
        without applying.
      expected: >
        Preview reports four removals (the moment is removed with its party) and the
        change list shows overview_item removals. Cancelling leaves the draft unchanged.

    - id: 14
      title: "Invalid nesting is rejected without writes"
      description: >
        Change Teacher demo's parent_external_id to "fri-missing" and preview. Then set it
        back, add "opens_detail": true to Teacher demo and preview again.
      expected: >
        Both previews fail with a clear validation message (unknown overview parent,
        moments cannot open the full schedule) and nothing is written.

    - id: 11
      title: "Verify attendee entry points"
      description: >
        Sign in as Import Preview Dancer. Open the announcement from Notifications,
        then inspect the event modal, Explorer card, and Mine > Next up card.
      expected: >
        The notification opens the Program directly. Published events show Program actions
        in all three surfaces; a currently running event remains in Next up and says Happening now.

    - id: 15
      title: "Renaming onto an existing name is explained, not a crash"
      description: >
        Run right after step 4 (before Replace removes the seeded taxonomy). Reset to
        current draft, rename the "party" activity type to "Workshop" and preview. Then
        rename it to "Bootcamp" and preview again.
      expected: >
        "Workshop" fails with a clear message that two activity types would share the
        name; nothing is written and there is no "Failed to fetch". "Bootcamp" (a seeded
        default no session uses) previews fine: the unused default makes way and the
        imported type keeps its identity, so sessions using it are unaffected.

    - id: 16
      title: "Skip individual changes before applying"
      description: >
        Edit two session titles in the JSON, preview, open the change details and untick
        one of them, then Apply to draft.
      expected: >
        Each change has a checkbox; the unticked one is struck through and the hint says
        "1 change will be skipped". After applying, only the ticked title changed. Skipping
        a new room that a ticked session still uses fails with a clear message instead of
        leaving a broken draft.
