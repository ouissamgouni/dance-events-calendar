test_plan:
  name: "Dance Passport — journey, sharing & profile visibility"
  description: |
    Feature-level acceptance plan for the Dance Passport. It is written around
    what a dancer can DO and what they should SEE, independent of any specific
    layout, wording or implementation detail.

    The passport aggregates a dancer's PAST attended ("Going") events into a
    private journey: headline counts (events / cities / countries), collections
    of visited cities and countries, a chronological timeline, and a grid of
    achievement milestones. On top of that private view, a dancer can:
      - control who sees their passport on their public profile
        (Anyone / Friends / Only me) and which sections are shared,
      - share a link to a read-only summary, optionally restricted to
        signed-in viewers,
      - let viewers follow them straight from the shared/profile passport.

    Seeded dancers (sign in at /login via the dev "Sign in as ..." buttons):
      - Alba (alba) — rich journey: 13 attended events, 11 cities, 7 countries,
        3 international, 10 approved reviews. Passport visibility: PUBLIC.
        Has an opt-in "Dancing since 2018" origin (off by default on the card).
      - Yara (yara) — multi-year journey: 7 attended events spanning a prior
        year and the current year (5 current-year, 2 prior-year), a clustered
        "most active" current-year month, consecutive current-year months,
        salsa-dominant. Passport visibility: PUBLIC. Used for the YEAR card.
      - Hana (hana) — activity heatmap: 15 attended events clustered so months
        land in different intensity buckets (a "heavy" ~8-event month, a
        "medium" ~3-event month, single-event months, plus a prior-year row).
        Passport visibility: PUBLIC, timeline shared. Used for the activity
        heatmap (Timeline matrix + share-card views).
      - Bram (bram) — borderline: 10 attended events, 9 cities, 5 countries,
        10 reviews. Passport visibility: FRIENDS-ONLY. Mutual friend of Alba.
      - Nadia (nadia) — minimal: 1 attended event, 0 reviews. Passport
        visibility: PRIVATE.
      - Felix — Going only on a FUTURE event (empty passport).
      - Bea — signed in but never Going (empty passport).
      - Milestone "cusp" users (each one attend away from a milestone):
        Dana (14/15 events), Elio (4/5 cities), Sami (2/3 countries).
      - Consistency users (recurring "active in N of the last 12 months"
        achievements, shown as a chronological milestone TRAIL — every unlock is
        a permanent card, repeats never collapsed. Attend a shared monthly
        ladder ~6 weeks apart, so the number of attended events equals the
        number of active months):
        Cara (3 → Consistent), Cole (5 → Committed), Yuki (8 → Year-Rounder,
        whose period label spans ~10 months and crosses a calendar year),
        Bo (2 → below the entry, no period), Mira (an old lapsed 3-month
        period then a fresh Consistent reach → Consistent earned twice as two
        separate cards), Nia (reached Year-Rounder in one long period, then the
        two oldest months aged out so the current count cooled to 6 — earned
        cards persist while the header and locked cards show the lower count).
        All PUBLIC.

    Relationships (db-follows.yaml): Alba <-> Bram are mutual friends.
    Privacy invariants baked into the seed: a future event never counts, an
    anonymous-device attendance never leaks into anyone's passport, and a
    null-geo event counts toward the event total but toward no city/country.

  steps:
    # ── Journey & aggregation ───────────────────────────────────
    - id: 1
      title: "A dancer sees their own journey"
      description: >
        As a signed-in dancer I open my Dance Passport and review the story of
        the past events I attended. Sign in as Alba and open the Dance
        Passport.
      expected: >
        The passport is owner-only (signed-out visitors are prompted to sign
        in). The burgundy header shows Alba's avatar, name, handle, journey
        dates, compact share icon and decorative mini map, with no stats or
        heatmap. Milestones is the default of exactly three tabs: Milestones,
        Journey and Places. The light 2x3 stats panel shows 13 events, 11
        cities, 7 countries and 10 reviews (a rejected review is not counted).
        Places is map-first with Cities/Countries switching; Journey contains
        the heatmap, newest-first history and Add past event. Duplicate cities
        collapse to one entry with a count; the null-geo event is counted as an
        event but shown in no city/country.
        At 390-400px wide the identity header, mini map, 2x3 stats, category
        rows and two-column detail cards do not clip or overlap; share sheets
        remain scrollable above the existing bottom navigation.
      verification: "Passport aggregates only past personal attendance."

    - id: 2
      title: "Only real, past, personal attendance counts"
      description: >
        As a dancer I trust my passport reflects only events I actually
        attended in the past. Compare Alba's rich journey with Felix (future
        RSVP only) and Bea (never Going); confirm no user's passport includes
        the anonymous-only event.
      expected: >
        Felix and Bea both see an empty passport (0 events / 0 cities /
        0 countries). Alba's upcoming/future RSVP never appears. The
        anonymous-device event and its city never appear in any dancer's
        passport.
      verification: "Future, anonymous and non-Going events are excluded."

    # ── Milestones ──────────────────────────────────────────────
    - id: 3
      title: "Milestones celebrate progress once"
      description: >
        As a dancer I unlock achievement badges as my journey grows and I'm
        congratulated the first time each unlocks. Open Alba's passport on her
        first visit, then revisit; compare with Nadia (single event).
      expected: >
        Five compact category rows show Events, Consistency, Cities, Countries
        and Reviews with unlocked counts, state icons and chevrons. Opening a
        row shows a compact summary and two-column card grid: unlocked cards
        have success/check treatment and dates, the next attainable card is
        highlighted with its progress fraction, and later cards remain muted
        and locked. Newly-unlocked milestones are celebrated exactly once on
        first view and never again on revisit.
      verification: "Celebration fires once per milestone."

    - id: 4
      title: "A milestone unlocks live when the dancer qualifies"
      description: >
        As a dancer sitting one event short of a milestone, marking one more
        past event as Going unlocks it immediately. For each cusp user (Dana →
        15th event, Elio → 5th city, Sami → 3rd country), mark Going on the one
        spare past event that crosses the threshold and reopen the passport.
      expected: >
        Each user starts with the target milestone locked one short of its
        threshold. After the single extra attendance the matching badge
        unlocks and is celebrated once; unrelated milestones are unaffected.
      verification: "Threshold crossing unlocks the matching badge live."

    - id: 5
      title: "Milestone unlocks notify per the dancer's channel settings"
      description: >
        As a dancer I'm notified when I unlock a milestone, respecting my
        email/push preferences. After a cusp user unlocks a milestone, let the
        notification dispatch run, then check the notifications panel and
        Settings → Notifications.
      expected: >
        Each unlock produces exactly one in-app notification (no duplicates on
        re-run) that links back to the passport. Email and push honour the
        per-user toggles (Dana: push only; Elio: in-app only; Sami: both).
        A "Dance Passport achievements" preference row is available with email
        and push switches.
      verification: "One in-app notification; email/push honour toggles."

    # ── Public profile visibility ───────────────────────────────
    - id: 6
      title: "Dance Passport leads the public profile"
      description: >
        As someone viewing another dancer's profile, the Dance Passport is the
        first thing I see when I'm allowed to. Open Alba's public profile (she
        is PUBLIC) and note the tab order.
      expected: >
        "Dance Passport" is the first profile tab and is selected by default.
        For Alba it shows her shared passport (the sections she opted to
        share), with her stats, badges and softened timeline.
      verification: "Dance Passport is the first, default profile tab."

    - id: 7
      title: "Friends-only passport is gated by friendship"
      description: >
        As a dancer I can restrict my passport to friends, and only friends can
        open it from my profile. Open Bram's profile (FRIENDS-ONLY passport)
        first as Alba (his mutual friend), then as Nadia (not his friend), then
        signed out.
      expected: >
        The "Dance Passport" tab is always present. Alba (a friend) sees Bram's
        passport. Nadia and signed-out visitors instead see a clear message
        that Bram shares his Dance Passport with friends only and that they can
        follow each other to view it — his stats and journey are not exposed.
      verification: "Only mutual friends can open a friends-only passport."

    - id: 8
      title: "Private passport stays private on the profile"
      description: >
        As a dancer with a private passport, no one but me sees it on my
        profile. Open Nadia's profile (PRIVATE passport) as any other dancer,
        then as Nadia herself.
      expected: >
        Other viewers see a message that Nadia keeps her Dance Passport
        private, with no stats or journey data. Nadia herself sees her full
        passport on her own profile tab.
      verification: "Private passport is visible only to its owner."

    # ── Sharing ─────────────────────────────────────────────────
    - id: 9
      title: "Sharing settings live behind 'Share my passport'"
      description: >
        As a dancer I decide who can see my passport and what it includes at
        the moment I choose to share it. As Alba, open the Dance Passport and
        tap the compact share icon, choose "As link" in the bottom sheet, and
        open the link-sharing sheet. Change the
        audience (Anyone / Friends / Only me), toggle which sections are shared
        (badges, cities, countries, timeline), then reopen the dialog / a
        profile view to confirm.
      expected: >
        The initial bottom sheet contains only As link and As card. Link
        controls are not shown until As link is selected. Audience and section changes are saved and take
        effect for profile viewers and share links: hidden sections stop
        appearing; setting the audience to "Only me" removes the passport from
        the public profile while the owner still sees it privately.
      verification: "Audience & section choices persist and take effect."

    - id: 10
      title: "Sharing produces a link (optionally sign-in gated)"
      description: >
        As a dancer I share a read-only summary of my passport, and I can
        require viewers to be signed in. In the sharing dialog choose "Anyone
        with the link" and share — a /shared/passport/<token> link is produced
        (via the native share sheet or copied). Open it signed out. Then
        reshare with "Only signed-in dancers" and open the link signed out
        again, then signed in.
      expected: >
        The link opens a read-only summary showing only the dancer's first
        name, the shared sections and stats/badges — never the exact venues,
        map coordinates, email or full name. With "Anyone with the link" a
        signed-out viewer sees the passport. With "Only signed-in dancers" a
        signed-out viewer is asked to sign in and only sees it after signing
        in. An unknown/removed link shows an unavailable message.
      verification: "Link is read-only; sign-in gating is enforced."

    - id: 11
      title: "Shared timelines reveal city, not venue"
      description: >
        As a dancer sharing my timeline, viewers see where in the world I
        danced but not the precise venues. With the timeline section shared,
        view Alba's timeline via her profile tab and via a share link, and
        compare with her own private passport timeline.
      expected: >
        On her own passport Alba sees full event detail. On shared/profile
        views the timeline shows city-level locations only (e.g. "Paris,
        France") with no exact venue and no map pin coordinates for those
        timeline entries.
      verification: "Shared timeline shows city only, no venue or coordinates."

    - id: 12
      title: "Viewers can follow from a shared passport"
      description: >
        As someone impressed by a dancer's passport, I can follow them right
        there. Open Alba's shared link and profile passport as: a signed-in
        dancer who doesn't follow her, a signed-in dancer who already follows
        her, Alba herself, and a signed-out visitor.
      expected: >
        A non-following signed-in viewer gets a Follow action that, once used,
        reflects the new following (or pending) state. An already-following
        viewer sees a following indicator, not another Follow action. Alba sees
        no follow control on her own passport. A signed-out visitor is invited
        to sign in to follow.
      verification: "Follow CTA adapts to viewer state; owner sees none."

    # ── Shareable card (image) ──────────────────────────────────
    - id: 13
      title: "Share as an image card — all-time story"
      description: >
        As a dancer I turn my passport into a shareable image for social
        stories. Sign in as Alba, tap the Passport share icon and choose "As
        card" in the bottom sheet (distinct from the read-only link).
      expected: >
        The generated card leads with the dancer's name and, to the RIGHT of it,
        an all-time headline anchored to when she joined ("Journey on Movida
        since <Mon YYYY>"), shows her headline stats as compact cells, and a
        grid of up to six highlights with no section label (the highlights
        speak for themselves). A small QR code plus a "<host>/u/alba" caption
        sit in the footer. The QR is modestly sized (roughly a fifth smaller
        than a bold hero code) and the card renders cleanly at story
        proportions.
      verification: "All-time card: name + right-aligned join headline, stats, highlights, QR + handle."

    - id: 14
      title: "Highlights favour the most impressive achievements"
      description: >
        As a dancer my card should showcase my most impressive badges, not just
        the most recent. Review the highlights on Alba's all-time card.
      expected: >
        Highlights are ranked by how impressive/rare each unlocked milestone is
        (prestige), not by recency, and are capped at six. Only the top badge in
        each family shows — "World Dancer" (5 countries) stands in for the whole
        countries family, never displayed alongside the overshadowed "Passport
        Stamped" (3 countries), and likewise for the other categories. Badges are
        grouped by family: consistency (the recurring active-months achievement +
        the "Danced every N days" cadence) leads and the review "Critic" badge
        trails, so the least-prestigious badge is the first dropped when the row
        overflows. Each milestone highlight is described by her ACTUAL totals
        (e.g. World Dancer → "7 countries"), never the fixed milestone threshold
        wording. The cadence and "Top style · <style>" highlights sit within this
        ordering (cadence with consistency, style just ahead of reviews).
      verification: "Highlights: consistency-first/reviews-last, one-per-category, ≤6, actual-total descriptions."

    - id: 15
      title: "Active months and top style surface as first-class facts"
      description: >
        As a consistent dancer my regularity and signature style show on the
        card. On Alba's all-time card check the stat cells and highlights.
      expected: >
        Her most-danced style appears as a "❤️ Top style · Salsa" highlight on
        the ALL-TIME card. A "📅 Active months" stat cell (active in N of the
        last 12 months, shown as N/12) sits alongside the headline counts ONLY
        when no consistency achievement (e.g. "Consistent") already occupies a
        highlight — when such a badge is shown the active-months cell is
        suppressed so the same fact isn't repeated. Dancers with no active month
        never show an active-months cell.
      verification: "Top-style highlight always shows; active-months cell only when no consistency badge is shown."

    - id: 16
      title: "Card controls stay compact and export mechanics stay intact"
      description: >
        As a dancer I configure a card without leaving the Passport share
        sheet. Open Alba's As card flow and exercise each visible control.
      expected: >
        The bottom sheet shows All time/current-year scope, Map, Badges and
        Activity controls, preview, Download and Share. Toggling presentation
        options updates only the preview; Download and Share retain the
        existing PNG generation, filename and native-share/download fallback.
        No extra Dancing since control appears in this compact flow.
      verification: "Card sheet exposes only approved controls and preserves export/share mechanics."

    - id: 17
      title: "A year card tells the story of a single year"
      description: >
        As a dancer I can share just this year's story. Sign in as Yara, open
        the Dance Passport share card and switch it to the current-year view.
      expected: >
        The card headline reads "My <year> in Dance" (to the right of her name)
        with no "Journey on Movida since" and no "Dancing since" line. Its stats
        and highlights are limited to that year's events (a genuine subset of
        her all-time totals, since two of her events are in a prior year). Year
        highlights include a "Danced every N days" cadence badge and a
        "Most active · <Month>" badge with that month's event count, plus new
        countries (🌍) / new cities (✈️) reached that year — each listing up to
        three place names then ", …" when more remain. A geography milestone
        unlocked that year (e.g. a countries badge) absorbs the matching
        new-places detail rather than showing two overlapping cards. Any other
        milestone unlocked that year carries a small "Unlocked" tag to the right
        of its name. The number of months active THIS year shows as a stat cell
        spelled out ("N months active"). The all-time "Top style" highlight is
        NOT shown on the year card.
      verification: "Year card: 'My <year>' headline, year-scoped stats/highlights, cadence, place-name lists, geo merge, 'Unlocked' tag, months-active cell, no top style."

    - id: 18
      title: "The card QR leads to the dancer's profile on this environment"
      description: >
        As someone who scans a shared card I land on the dancer's profile so I
        can follow them. Scan / open the QR (and read the footer caption) on
        cards for Alba (public), Bram (friends-only) and Nadia (private).
      expected: >
        The QR encodes "<origin>/u/<handle>" for the CURRENT environment and
        the footer caption matches ("<host>/u/<handle>"). It always resolves to
        the dancer's profile — for a public passport the profile shows the
        passport; for friends-only/private it still resolves to the profile
        with a Follow gate (never a dead link or a raw token URL).
      verification: "QR → /u/<handle> on current env; always resolves to profile."

    - id: 19
      title: "An empty or thin journey degrades gracefully on the card"
      description: >
        As a brand-new dancer my card still looks intentional. Generate a card
        for Felix/Bea (empty) and Nadia (single event).
      expected: >
        An empty passport yields a "just getting started" style card with no
        active-months cell and no highlights, rather than a broken or blank card.
        A single-event journey shows the minimal stats it has and no
        active-months cell, and never fabricates highlights it hasn't earned.
      verification: "Empty/thin journeys render a graceful minimal card."

    # ── Recurring consistency achievements ──────────────────────
    - id: 20
      title: "Consistency keeps every earned period and what's next"
      description: >
        As a dancer who keeps showing up I earn recurring "Consistency"
        achievements for being active in N of the last 12 months, without
        needing consecutive months. Open the Dance Passport for each consistency
        user, open the Consistency row on the Milestones tab and scan its grid.
      expected: >
        Consistency opens as a compact two-column milestone grid. Each unlocked
        level is its own permanent earned card showing the
        level ("N/12 active months") and the period it was reached (first
        contributing active month → reach month), followed by the remaining
        locked levels showing progress from the current count. Cara (3 active
        months) has one earned card, Consistent; Cole (5) has Consistent +
        Committed; Yuki (8) has Consistent + Committed + Year-Rounder, then
        locked Unstoppable (8/10) and Dance Lifestyle (8/12). Bo, with only 2
        active months and no open period, sees no earned cards — just locked
        progress toward Consistent (2/3), Committed (2/5) and so on.
      verification: "Each unlock is a separate grid card with its period; the next locked level shows current progress."

    - id: 21
      title: "Achievements recur as new cards and never regress or vanish"
      description: >
        As a dancer my consistency achievements can be earned again in distinct
        periods, and a quiet spell never erases what I reached. Open Mira's
        passport (an old lapsed 3-month period plus a fresh Consistent reach) and
        Nia's (reached Year-Rounder, then cooled to 6 active months).
      expected: >
        Mira has TWO separate "Consistent" earned cards, one per period, with
        their own period labels — never merged into a single "×2" card in the
        trail. Nia's trail keeps her Consistent, Committed and Year-Rounder
        earned cards permanently even though her current rolling count has cooled
        to 6: the header reads "Current · 6/12", and the locked Unstoppable /
        Dance Lifestyle cards progress from 6 (6/10, 6/12) rather than
        downgrading or deleting the earned Year-Rounder card. No re-celebration
        fires for a decrease, and a data correction (a cancelled attendance that
        removes an active month) is the only thing that can retract an already
        earned card — an ordinary decline never does.
      verification: "Repeats appear as separate cards (no ×2 in the trail); earned cards persist on a decline; only a real cancellation prunes them."

    - id: 22
      title: "Consistency reaches drop a timeline moment and headline the all-time/yearly cards"
      description: >
        As a dancer I want each consistency unlock recorded when it happened and
        summarised on my shareable cards. Open Yuki's timeline and share cards,
        and switch the share card between all-time and a specific year.
      expected: >
        Yuki's timeline shows one item per upward reach — "Year-Rounder · 8/12
        active months · <period>" — anchored to the event that triggered it (no
        items for progress changes, decreases or period endings; simultaneous
        unlocks sharing one triggering event collapse into a single moment). The
        ALL-TIME share card shows only the strongest lifetime highlight with a
        recurrence note (e.g. "🎆 Year-Rounder · 8/12 active months", or
        "Consistent ×2 · 3/12 active months, twice" for Mira), prioritising the
        highest level over repetition of a lower one and never listing periods.
        The YEARLY card is computed independently from that calendar year's
        Jan–Dec active months and shows the matching level (e.g. "🎆
        Year-Rounder · 8/12 active months") as a yearly highlight only — it does
        not mint another lifetime unlock.
      verification: "Timeline: one item per reach with period, no progress/decrease items; all-time: strongest level + ×N, no periods; yearly: independent Jan–Dec classification."

    # ── Activity heatmap (activity over time) ───────────────────
    - id: 23
      title: "Journey opens with an activity-over-time heatmap"
      description: >
        As a dancer I can see how my dancing has ebbed and flowed over the
        months. Sign in as Hana and open the Journey tab of her Dance Passport.
      expected: >
        Above the timeline list a compact "Activity over time" grid renders one
        row per calendar year (oldest first, with any gap years shown as empty
        rows) and twelve month columns (J..D). Each cell is shaded by that
        month's attended-event count across five fixed intensity buckets
        (none / 1–2 / 3–4 / 5–7 / 8+), so Hana's clustered "heavy" month reads as
        the darkest cell, her "medium" month a mid tone, and her single-event
        months the lightest active tone. A "Less → More" legend explains the
        ramp. Dancers with no attended events show no heatmap.
      verification: "Journey shows a Year x Month grid with per-month intensity buckets and a legend; empty passports omit it."

    - id: 24
      title: "Hovering and clicking a month connects the heatmap to the timeline"
      description: >
        As a dancer I can read exact counts and jump to a month's events. Hover a
        cell in Hana's heatmap, then click a month that has activity.
      expected: >
        Hovering a cell reveals the exact count and month (e.g. "8 events · Jul
        2026"). Clicking a month with activity scrolls the timeline to that
        month's events (loading older pages as needed) and briefly highlights the
        landed rows. Empty months are not clickable.
      verification: "Hover shows exact count/month; clicking an active month scrolls+highlights the timeline; empty months inert."

    - id: 25
      title: "The share card can include an activity view, gated by a checkbox"
      description: >
        As a dancer I choose whether my card shows my activity rhythm. Open
        Hana's Dance Passport share card and toggle the new "Activity" option in
        the card options for both the all-time and current-year views.
      expected: >
        With "Activity" enabled the ALL-TIME card shows a compact Year × Month
        matrix capped at the last two calendar years (so it never crowds the
        card), and the CURRENT-YEAR card shows a single Jan–Dec month strip with
        the same intensity buckets. Unchecking "Activity" removes the view from
        the card entirely. The option is independent of the Map/Badges toggles.
      verification: "Activity checkbox adds a last-2-years matrix (all-time) or month strip (year) to the card; unchecking removes it."

    - id: 26
      title: "The activity heatmap follows the shared timeline privacy toggle"
      description: >
        As a viewer I only see a dancer's activity heatmap when they've shared
        their timeline. View Hana's public passport (timeline shared), then a
        passport whose owner has the timeline section turned OFF.
      expected: >
        On Hana's shared/profile passport the "Activity over time" heatmap
        renders (her timeline is shared). When the owner has NOT shared their
        timeline section, neither the timeline nor the activity heatmap appears —
        the per-month activity data is withheld along with the timeline.
      verification: "Shared heatmap shows only when the timeline section is shared; withheld otherwise."
