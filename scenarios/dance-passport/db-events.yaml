# Dance Passport scenario — a rich, retrospective dance journey.
#
# Events are PAST (w-N relative dates) so they count toward the passport,
# plus one FUTURE event (must NOT count) and one NULL-geo event (counts as an
# event but not toward cities/countries). city/country/country_code are seeded
# directly so no live geocoding is needed. tags.yaml is intentionally omitted
# so the scenario inherits the default taxonomy (which includes the ``reach``
# group with ``international`` used by the "first international" milestone).
