  # Cara: evt-cons-01..03 -> 3 active months -> Consistent.
  - { event_id: evt-cons-01, email: consistent@example.com, share_audience: public }
  - { event_id: evt-cons-02, email: consistent@example.com, share_audience: public }
  - { event_id: evt-cons-03, email: consistent@example.com, share_audience: public }

