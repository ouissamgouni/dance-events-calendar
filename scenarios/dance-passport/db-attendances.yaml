# Pre-seeded "Going" state driving each user's passport.
#
# Audiences are mixed (public/friends/private) for alba — the passport is
# self-only, so ALL audiences must count for her. An anonymous device-only
# attendance on evt-dp-anon must NOT leak into any user's passport.
