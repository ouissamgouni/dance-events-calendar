# Mock users pre-seeded for the Dance Passport scenario.
# At /login, dev mode renders one "Sign in as <Name>" button per entry.
users:
  # Primary rich journey: 13 attended events (11 distinct cities, 7 countries,
  # 3 international, 4 dance styles, 10 approved reviews).
  # Passport is PUBLIC so anyone can view her profile "Dance Passport" tab and
  # her share link resolves for signed-out viewers.
  - email: alba@example.com
    name: Alba (rich journey)
    handle: alba
    account_visibility: public
    passport_visibility: public
    passport_show_timeline: true
    # Opt-in "Dancing since" origin (default OFF on the share card). Enabling
    # the share-card toggle surfaces a small "Dancing since 2018" line.
    dancing_since: 2018-03-15
  # Multi-year public dancer used to exercise the YEAR share card. Yara has
  # events in a PRIOR calendar year AND the current year, a clustered "most
  # active" current-year month, a run of consecutive current-year months, a
  # dominant style (salsa), plus a milestone unlocked in the prior year (must
  # NOT appear on the current-year card) and one unlocked this year.
  - email: yara@example.com
    name: Yara (multi-year journey)
    handle: yara
    account_visibility: public
    passport_visibility: public
    passport_show_timeline: true
  # Exactly-at-threshold journey: 10 attended events, 9 cities, 5 countries,
  # 10 reviews. Passport is FRIENDS-ONLY — Alba (a mutual friend, see
  # db-follows.yaml) can view it; strangers see the friends-only placeholder.
  - email: borderline@example.com
    name: Bram (borderline)
    handle: bram
    account_visibility: public
    passport_visibility: friends
    passport_show_timeline: true
  # Minimal journey: exactly 1 attended event, 0 reviews. Passport is PRIVATE —
  # only Nadia herself can see it; every other viewer sees the private message.
  - email: novice@example.com
    name: Nadia (novice)
    handle: nadia
    account_visibility: public
    passport_visibility: private
  # Negative: only Going on a FUTURE event -> 0 attended.
  - email: future-only@example.com
    name: Felix (future only)
  # Negative: signed in but never marked Going -> empty passport.
  - email: bystander@example.com
    name: Bea (bystander)
  # --- Milestone-testing "cusp" users: each sits exactly one attend away from
  # a specific milestone, so a tester can mark Going on one more past event and
  # watch that milestone unlock live (with the celebration toast). ---
  # 14 attended events -> mark Going on evt-vol-13 to unlock Dedicated (15).
  - email: cusp-dedicated@example.com
    name: Dana (14/15 events → Dedicated)
    # Phase C: email off, push on — exercises per-channel milestone gating.
    email_milestone_unlocked_enabled: false
    push_milestone_unlocked_enabled: true
  # 4 distinct cities -> mark Going on a 5th-city event to unlock City Hopper.
  - email: cusp-explorer@example.com
    name: Elio (4/5 cities → City Hopper)
    # Phase C: both channels off — in-app milestone notification only.
    email_milestone_unlocked_enabled: false
    push_milestone_unlocked_enabled: false
  # 2 countries -> mark Going on a 3rd-country event to unlock Passport Stamped.
  - email: cusp-stamped@example.com
    name: Sami (2/3 countries → Passport Stamped)
  # --- Consistency users: each attends a prefix of the evt-cons ladder to land
  # on a specific recurring "Consistency achievement" level (active in N of the
  # last 12 months). Passports are PUBLIC so the level/current-period card and
  # celebration toasts are visible on the Dance Passport tab. ---
  # 3 active months -> Consistent (first entry into a consistency period).
  - email: consistent@example.com
    name: Cara (3 months → Consistent)
    handle: cara
    account_visibility: public
    passport_visibility: public
    passport_show_timeline: true
  # 5 active months -> Committed.
  - email: committed@example.com
    name: Cole (5 months → Committed)
    handle: cole
    account_visibility: public
    passport_visibility: public
    passport_show_timeline: true
  # 8 active months -> Year-Rounder.
  - email: yearround@example.com
    name: Yuki (8 months → Year-Rounder)
    handle: yuki
    account_visibility: public
    passport_visibility: public
    passport_show_timeline: true
  # Two active months only -> below the 3-month entry, no period yet (shows the
  # "next entry" progress toward Consistent instead of a current-period card).
  - email: belowentry@example.com
    name: Bo (2 months → below entry)
    handle: bo
    account_visibility: public
    passport_visibility: public
  # A first period (3 old months) that lapsed, then a fresh Consistent reach —
  # demonstrates that consistency achievements RECUR (Consistent ×2), with the
  # older period preserved in history.
  - email: comeback@example.com
    name: Mira (comeback → Consistent ×2)
    handle: mira
    account_visibility: public
    passport_visibility: public
    passport_show_timeline: true
  # Reached Year-Rounder (8) inside one long period, then the two oldest active
  # months aged out of the rolling window so the current count has cooled to 6.
  # The earned Consistent/Committed/Year-Rounder cards stay permanently; the
  # header shows the lower current count and the locked cards progress from it.
  # The Year-Rounder card's period also spans ~10 months, crossing a year.
  - email: dip@example.com
    name: Nia (dip → Year-Rounder, now 6)
    handle: nia
    account_visibility: public
    passport_visibility: public
    passport_show_timeline: true
  # Multi-year heatmap dancer used to exercise the Timeline "Activity over time"
  # matrix and the share-card activity views. Events are deliberately clustered
  # so different months land in different intensity buckets (1-2 / 3-4 / 5-7 /
  # 8+), across the current AND a prior calendar year. Passport PUBLIC + timeline
  # ON so the heatmap also renders on her shared/profile passport.
  - email: heatmap@example.com
    name: Hana (activity heatmap)
    handle: hana
    account_visibility: public
    passport_visibility: public
    passport_show_timeline: true
  - email: admin@example.com # matches ADMIN_EMAIL -> admin
    name: Dev Admin
