test_plan:
  name: "Program – attendee view, Overview and My Plan"
  description: >
    Everything an attendee sees in an event program. Back 2 Mambo 2026 uses the
    real five-day first-weekend program (66 sessions transcribed from the official
    poster): simultaneous Friday 14:00 workshops, multi-hour bootcamps, combined-hall
    socials/shows, cross-midnight night parties, a roomless Monday afterparty and one
    cancelled session. Its draft renames the first workshop so publication isolation
    is visible. Salsa Grand 2026 (Zagreb) is seeded from
    docs/programs/salsa-grand-2026.schedule.json with both levels: the Overview
    transcribed from salsagrand.com/program and the Full schedule (35 sessions in 4
    rooms). Live Overview Social is an Overview-only program seeded relative to the
    start time for the Now badge and default-day checks. Prague Salsa Weekender,
    Brno Bachata Lab (draft only) and Vienna Social Night (no program) cover the
    program states. Editor, publishing and organizer checks live in program-admin.

  preconditions:
    - "Run: SCENARIO=program task start:scenario RESET_BROWSER=1"
    - "Sign in as Maya Dancer unless a step says otherwise."
    - "Use a phone-sized viewport first, then repeat key steps on desktop."

  steps:
    - id: 1
      title: "Open and filter the published mobile program"
      description: >
        Open Back 2 Mambo 2026 and choose Program, then the Full schedule tab.
        Select Friday 16 October, then open Filter schedule and inspect the Level,
        Activity type and Instructor controls. Open the Instructor picker, search for
        a name, select it, close and reopen the filter sheet, and try a combination
        with no matching sessions.
      expected: >
        Program and My Plan are above a compact Filter schedule bar, followed
        immediately by the day selector. The grid shows only rooms used Friday,
        with time labels fixed while rooms scroll. The published title is
        "Shines / Partnerwork", not the draft-only title. The three Level pills
        remain on one row, Activity type pills wrap, and all controls have
        comfortable mobile tap targets. Instructor opens a nested sheet with a
        stable header, search and single-select radio rows; choosing one returns
        to the filter sheet. Reset is disabled with no draft filters and enabled
        after a selection. Unapplied drafts survive closing and reopening without
        changing the grid. The result count updates immediately, the bottom CTA
        stays fixed while content scrolls, and zero matches shows a disabled
        "No sessions match" action. Applied filters appear only in the compact
        summary bar.

    - id: 2
      title: "Compare simultaneous choices"
      description: "Tap the 14:00 time label."
      expected: >
        A sheet shows three sessions in Grand Hall, Lounge Hall and Nyx (Jemis &
        Dyanna, Joana Coimbra, Alexis Ruiz) plus the Main Hall Afternoon Social
        Party. Room, venue, instructor, title and level are readable without
        fabricated copy.

    - id: 3
      title: "Open details and toggle My Plan"
      description: "Open Musicality Intro, add it to My Plan, then remove it."
      expected: >
        The details sheet has one primary plan action whose saved state updates
        immediately. Returning to the grid preserves the scroll position.

    - id: 4
      title: "Inspect seeded conflicts and cancellation"
      description: "Switch to My Plan."
      expected: >
        Friday's two 14:00 workshops show a subtle overlap warning. Saturday's
        cancelled Groovy ChaCha Partnerwork (Rumen & Yulia, Nyx 20:00) remains
        visible and explicitly says it was cancelled.

    - id: 5
      title: "Check late-night grouping"
      description: "Return to Friday's Program and scroll past midnight."
      expected: >
        Shows (00:00) and Mambo Night Party (01:00–07:00) remain grouped under
        Friday because the schedule day cutoff is 06:00. Mambo Night Party keeps
        its full six-hour height and notes that it ends on Saturday. The grid
        extends into Saturday morning. Shows Rehearsals cannot be added to My Plan.

    - id: 6
      title: "Program states across events"
      description: "Open Prague Salsa Weekender, Brno Bachata Lab and Vienna Social Night."
      expected: >
        Prague has a distinct published Program (sign in as Lina Weekender to see
        her plan). Brno's program is still a private draft and Vienna has none, so
        neither shows a Program action.

    - id: 7
      title: "Check remove actions and back navigation"
      description: >
        Remove a My Plan row with its cross, inspect the session-sheet remove action,
        and navigate Event → Program → Event → Back.
      expected: >
        The row uses a cross rather than a menu. The sheet action has subtle red
        text and border. Back returns through Event to the original surface and
        never loops between Event and Program.

    - id: 8
      title: "Share the program from the view tabs"
      description: >
        Open Back 2 Mambo 2026 → Program, pick Saturday in Full schedule, and tap
        Share (Copy link on desktop). Then open Prague Salsa Weekender → Program.
      expected: >
        Share sits on the same line as the Overview / Full schedule tabs, aligned
        right, with the same share icon as My Plan's "Share & export"; the header
        no longer has it. The link opens the same view and day
        (…/program?view=schedule&day=2026-10-17) and carries Maya's referral code.
        Prague has no Overview tabs, and Share still sits right-aligned above the
        day pills.

    - id: 9
      title: "Overview opens by default"
      description: "Open Salsa Grand 2026 > Program and select Fri 27."
      expected: >
        Overview and Full schedule tabs appear above the day pills with Overview selected.
        Friday lists, in time order: Registration & Open Office Hours (13:00–20:30),
        Workshops (13:00–17:00), Bootcamp part 1/3 (14:00–16:00, "6-hour class with stage
        performance"), Afternoon social dancing (17:00–20:00), Bootcamp part 2/3, the
        night Registration (22:30–02:00) and Friday Party (22:30–05:00, "All I want for
        Christmas is ... Salsa!") with Artists presentation & Shows (00:00) and Artist hour
        (02:00) listed inside the party card.

    - id: 10
      title: "Category chips filter top-level blocks only"
      description: "Tap Registration, then Party, then All."
      expected: >
        Registration shows only the two registration rows. Party shows only Friday
        Party, still with its two moments. All restores the full day.

    - id: 11
      title: "Drill down from Workshops"
      description: "Tap Workshops (13:00–17:00)."
      expected: >
        The card shows "3 sessions" with a chevron. Tapping opens Full schedule on Friday
        scrolled to 13:00; the three Friday workshops briefly flash and then look normal.
        The URL contains view=schedule&focus=…. Phone/browser Back returns to the Overview.

    - id: 12
      title: "Drill down from a party"
      description: "On Saturday tap Saturday Grand Gala Night, then Back."
      expected: >
        The grid opens on Saturday at 22:30 with Gala Salsa & Mambo Night flashing. The
        Gala's moments (Show performances 23:30, Artist hour 02:00) stay on Saturday's
        Overview even though they are after midnight (day starts at 07:00).

    - id: 13
      title: "Blocks without a detailed schedule"
      description: >
        Tap a Bootcamp part, Friday's Artist hour moment, a Registration row and
        Artists presentation & Shows.
      expected: >
        Bootcamp opens an info sheet with day, time, venue, a "Bootcamp details"
        link that opens salsagrand.com in a new tab and an "In My Plan · Remove" footer
        (part 1/3 is pre-planned). Artist hour opens a sheet with
        "Catch your favorite artist on the dance floor!" and "Part of Friday Party".
        Registration rows and Artists presentation & Shows are static (no tap
        affordance) because they have no description, link or detailed schedule.

    - id: 14
      title: "Full schedule filters show socials and parties"
      description: "Switch to Full schedule and open Filter schedule."
      expected: >
        Activity type chips include Workshop, Social and Party. Switching tabs keeps
        the selected day.

    - id: 15
      title: "Overview-only program"
      description: "Open Live Overview Social > Program."
      expected: >
        No Overview/Full schedule tabs and no Filter schedule bar are shown; Share is
        alone on the right. Today is selected. Doors & registration shows a Now badge
        and opens its info sheet. Riverside Salsa Night lists Live band set and Last
        dance inside its card; Live band set opens its sheet. Tomorrow shows Recovery
        picnic with a "Picnic map" link.

    - id: 16
      title: "Bootcamp parts in My Plan"
      description: "Open Salsa Grand 2026 > Program on Fri 27, then open My Plan."
      expected: >
        Each Bootcamp card has a bookmark button; part 1/3 shows it filled (pressed) and a
        Bootcamp Buddy avatar under the card. Part 2/3 can be added with one tap (no sheet).
        My Plan lists Bootcamp part 1/3 (subtitle "6-hour class with stage performance",
        brown Bootcamp left stripe) next to Salsa Romantica, both with a "Time conflict" warning.
        Workshops, parties and registration cards have no bookmark button.

    - id: 17
      title: "Friends and calendar export"
      description: >
        Open Bootcamp part 1/3, tap the Who's attending row, go back; then in My Plan open the
        share/export menu and download the calendar.
      expected: >
        The attendee list shows Bootcamp Buddy. The .ics contains the bootcamp part with its
        Overview time (14:00–16:00 Zagreb) alongside the planned session. Removing part 1/3
        from My Plan clears the conflict on Salsa Romantica.
