# Suggestions surfaces scenario.
#
# Cast:
#   - newbie: fresh user for onboarding follow suggestions.
#   - viewer: mutual friends with alice/bob/carol; sees blended FoF suggestions.
#     Rich network (pop1-pop14 + privatepop = 15 graph candidates) ->
#     demonstrates ranking, "Show more", and "Shuffle" (pool > /discover
#     page size 12).
#   - thinviewer: mutual friend of dave only; dave follows just pop1/pop2, so
#     /discover shows 2 network rows THEN the organizer + curator top-up rows.
#     This is the witness that organizers ARE suggested for a signed-in
#     networked viewer (top-up fills the spare slots, like curators).
#   - dave: thinviewer's only friend; follows pop1/pop2 to seed a thin FoF pool.
#   - loner: zero graph; should see Discover organizer + curator fallback only.
#   - alice/bob/carol: viewer's mutual friends, used as suggestion witnesses.
#   - pop1-pop14: 14 FoF candidates with varying mutual-friend counts.
#     pop1(3 mutuals) and pop2(2 mutuals) lead on the graph signal. pop3
#     and privatepop TIE at 1 mutual, so the blended relevance score
#     (shared interests + recency) breaks the tie: privatepop ranks ABOVE
#     pop3 even though "pop3" sorts first alphabetically. pop4-pop14 have
#     1 mutual and are ranked by secondary signals. Together with privatepop
#     this pool (15 graph candidates) exceeds /discover page size (12) to show
#     "Show more" and "Shuffle".
#   - privatepop: friends-only but suggestable; shares salsa with viewer and
#     is the most recently active candidate -> outranks pop3.
#   - hiddenpop: explicit suggestion opt-out; must never be shown.
#   - salsahub/afrohub: verified organizers surfaced via the /discover
#     organizer top-up (and onboarding). salsahub shares salsa with viewer and
#     is more recently active, so it leads afrohub within the organizer tier.
#   - curator-paris/curator-bachata: admin-managed fallback/top-up candidates.
#     curator-bachata shares bachata with viewer so it leads curator-paris.
#   - curator-hidden: admin-managed but opted out of suggestions.
#   - admin: site admin control, excluded by backend discovery helpers.
#
# Ranking signals seeded below (see backend/api/routes/social.py
# _relevance_scores): mutual friends come from db-follows.yaml; popularity
# (approved followers) also from db-follows.yaml; shared interests from
# per-user `preferred_tags`; activity from `last_visit_at`. Events-in-common
# is covered by backend unit tests rather than this UI scenario.
users:
  - email: newbie@example.com
    name: Nora Newbie
    handle: newbie
    account_visibility: public
  - email: viewer@example.com
    name: Vera Viewer
    handle: viewer
    account_visibility: public
    preferred_tags: [salsa, bachata]
    last_visit_at: "2026-08-07T09:00:00"
  - email: thinviewer@example.com
    name: Tom Thin
    handle: thinviewer
    account_visibility: public
    # Thin network (one friend, dave, who follows only pop1/pop2). Discover's
    # first page has room after the 2 network rows, so the organizer + curator
    # top-up rows appear right below them -> proves organizers ARE suggested
    # for a signed-in networked viewer, not only in onboarding.
