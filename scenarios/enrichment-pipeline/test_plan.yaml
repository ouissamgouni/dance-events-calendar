test_plan:
  name: "Enrichment Pipeline — Structured Extractor QA"
  description: |
    Verify that calendar events enter through the sync pipeline, structured
    extractor metadata is applied once by the owning handlers, and the raw
    calendar source remains available to administrators for auditing.

    The fixture also retains prose-only prices and links on older events to
    prove those legacy heuristics no longer populate structured fields.

  preconditions:
    - "Run with: task start:scenario SCENARIO=enrichment-pipeline RESET=1"
    - "Sign in as Dev Admin for admin-panel checks."

  steps:
    - id: 1
      title: "Sync the mock calendars"
      description: |
        Open the admin Calendars section and trigger a full sync. Wait for
        enrichment to finish, then return to the public event list.
      expected: |
        All 16 mock calendar events are imported. The latest sync finishes
        without a failed extractor_image, geocoding, or tag_suggestion stage.
      verification: "16 events imported; enrichment_status=completed"

    - id: 2
      title: "Extractor envelope is removed from displayed copy"
      description: |
        Open "Extractor Metadata Showcase" from the public event list.
      expected: |
        The description contains only "This human-readable introduction is
        the only copy visitors should see." No extractor marker or JSON is
        visible on the card or event detail.
      verification: "description is clean; EXTRACTOR_JSON is absent"

    - id: 3
      title: "Structured links and price are applied"
      description: |
        Inspect the same event's details and price display.
      expected: |
        The event has links to example.com/extractor-showcase and
        example.com/extractor-tickets. Its price range is EUR 12-18.
      verification: "2 links; price_min=12; price_max=18; currency=EUR"

    - id: 4
      title: "All extractor price formats are normalized"
      description: |
        Open each event whose title begins with "Extractor" and compare its
        displayed price with price_range in the Calendar source section.
      expected: |
        Metadata Showcase displays EUR 12–18. Minimum Price (EUR 120+)
        displays EUR 120+. Fixed Price (EUR 15) displays EUR 15. Extended
        Price Range (EUR 100-300+) displays EUR 100–300. Free Event (EUR 0)
        displays Free. Unavailable Tickets (empty string) displays no price.
      verification: |
        Values are respectively 12/18/EUR, 120/null/EUR, 15/15/EUR,
        100/300/EUR, 0/0/free, and null/null/null.

    - id: 5
      title: "Extractor image uses managed image storage"
      description: |
        Check the showcase card and event detail, then open the event in the
        admin editor's Picture section.
      expected: |
        A picture appears on the card and detail page. The admin preview also
        shows it as a managed event image, using the same controls as an image
        imported by URL in the event editor.
      verification: "managed image_key set; thumb and full image URLs render"

    - id: 6
      title: "Extractor tags create taxonomy suggestions"
      description: |
        In Admin, open Tag Suggestions and filter or scan for "Extractor
        Metadata Showcase".
      expected: |
        Pending heuristic suggestions include Salsa, Social, and
        Beginner-Friendly. Their matched terms include values supplied by
        the extractor payload, even though the displayed description does not
        contain those words.
      verification: "pending Salsa, Social, and Beginner-Friendly suggestions"

    - id: 7
      title: "Administrator can audit the raw calendar source"
      description: |
        Open the showcase event in the admin event detail. Compare the
        Displayed description with the collapsed Calendar source section.
      expected: |
        Displayed description contains only the human-readable introduction.
        Calendar source contains that introduction plus the complete extractor
        envelope, including links, image, tags, and price_range.
      verification: "source_description retains the complete source payload"

    - id: 8
      title: "Legacy prose inference remains disabled"
      description: |
        Open "Salsa Congress – Paris" and "Online Salsa Masterclass". Their
        source descriptions contain prose prices and URLs but no extractor
        envelope.
      expected: |
        Neither event receives structured links or prices from its prose.
        Their description text remains unchanged.
      verification: "links and price fields remain empty on enrich-001 and enrich-007"

    - id: 9
      title: "Administrator edits are preserved on later syncs"
      description: |
        In the showcase event editor, replace the displayed description and
        picture. Save, then trigger another full calendar sync.
      expected: |
        The administrator's description and managed picture remain unchanged.
        Calendar source still reflects the calendar payload, and the event is
        not reverted merely because the extractor payload is unchanged.
      verification: "admin-owned description and image survive full re-sync"
