test_plan:
  name: "Movida mobile product walkthrough"
  description: |
    Explore Movida with production-derived event listings and a complete
    community of dancers, organizers, and curators. Use Elena Moreau (@elena)
    for established-member journeys and Amira Haddad (@amira-haddad) for the
    first-time experience.

  preconditions:
    - "Start privately with: task showcase:mobile RESET=1"
    - "Open the printed HTTPS address on a phone connected to the same tailnet."
    - "Use a fresh browser profile when checking installation or onboarding."

  steps:
    - id: 1
      title: "Complete first-time onboarding"
      description: |
        Sign in as Amira Haddad and complete dance-style, location, and follow
        preferences.
      expected: |
        The onboarding flow introduces preferences progressively, suggests
        verified organizers and Movida Picks, and lands on a personalized Home.
      verification: "Amira can complete onboarding without encountering seeded QA language."

    - id: 2
      title: "Browse Elena's personalized Home"
      description: |
        Sign in as Elena Moreau and open Home.
      expected: |
        Your next event shows Seville Salsa Weekender. You might like reflects Elena's
        Salsa and Bachata profile, Friends are going uses her network, Build
        your tribe suggests relevant organizers, and New contains unseen events.
      verification: "All populated sections render independently and card actions work."

    - id: 3
      title: "Explore by search, filters, and map"
      description: |
        Open Browse and search for Rovinj, SALSARAVE, Salsa Grand, elSol, and
        London Salsa Sessions. Switch Elena between her Europe and Paris 25km
        search profiles, then apply dance, format, date, price, and area filters.
      expected: |
        Results preserve production calendar colors, taxonomy tags, dates,
        locations, pricing, links, popularity, and map positions. Profile names
        remain distinct from their geographic area labels.
      verification: "List and map stay in sync and clearing filters restores the catalog."

    - id: 4
      title: "Inspect event pictures and member avatars"
      description: |
        Browse all twelve Movida Community Events, then open attendee lists,
        reviews, Tribe, and profiles for several different members.
      expected: |
        Every community event uses the local picture whose filename matches its
        title, upcoming production events retain their production pictures, and
        each seeded identity has a distinct portrait with Elena's portrait
        consistent across the app.
      verification: "Event thumbnails, detail images, avatar stacks, and profiles load from the local object store."

    - id: 5
      title: "Save and join with privacy controls"
      description: |
        Save an event, mark another Going, and change each audience between
        Public, Friends, and Private.
      expected: |
        Button states update immediately, privacy choices persist, and the
        events move into Elena's calendar without leaving the current screen.
      verification: "Reloading preserves both actions and their audiences."

    - id: 6
      title: "Inspect attendance and popularity"
      description: |
        Open Back 2 Mambo 2026, Transilvania Salsa Fest, and Rovinj Croatian
        Summer Salsa Festival.
      expected: |
        Back 2 Mambo leads trending with 26 attendees, Transilvania follows with
        25, and Rovinj follows with 24. Public, friends-only, and private
        attendance are reflected without exposing private profiles.
      verification: "Counts, avatar stacks, attendee sheet, and privacy boundaries agree."

    - id: 7
      title: "Use the social graph"
      description: |
        Open Tribe and inspect Elena's network and suggestions. Visit
        @clara-dubois to see Elena's pending request, then sign in as Clara to
        approve it.
      expected: |
        Mutual friends, one-way follows, friend suggestions, pending state,
        approval, follower counts, and profile visibility update consistently.
      verification: "Approving the request creates the friendship and calendar subscription."

    - id: 8
      title: "Browse subscribed calendars"
      description: |
        As Elena, open Tribe > Calendars and switch among subscriptions, Going,
        and Saved views. Open Elena's own calendar and its export menu.
      expected: |
        Follow-created calendar subscriptions include people and Movida Picks.
        Elena's network snapshot contains several upcoming events with multiple
        friends going. Her Going and Saved events are populated and exportable.
      verification: "The live iCalendar URL opens on the phone and updates from local actions."

    - id: 9
      title: "Read and manage notifications"
      description: |
        Open Notifications, then Account > Notifications and email.
      expected: |
        Elena has social, discussion, and suggested-event activity. Rows deep-link
        to their subject, read state updates, and channel preferences persist.
      verification: "Notification badge count and inbox read state stay consistent."

    - id: 10
      title: "Open curator and organizer profiles"
      description: |
        Visit @movida-picks, @sea-sun-salsa, and @rave-republic, then follow
        their attributed events back to event details.
      expected: |
        Movida Picks shows public Going and Saved activity. Both organizer
        profiles are verified and display their attributed events.
      verification: "Profile, organizer block, and event navigation agree."

    - id: 11
      title: "Use an event promo code"
      description: |
        Open Rovinj, Salsa Grand, SALSARAVE, or elSol and inspect the available
        offer.
      expected: |
        Approved promo codes show their description, source, and expiry where
        available, with Penny Valdez shown as the community contributor.
      verification: "The promo-code action opens and copies the displayed value."

    - id: 12
      title: "Read recurring-event reviews"
      description: |
        Search for Alfama Thursday Salsa, open the upcoming edition, and inspect
        Community Experience and the linked series.
      expected: |
        The upcoming event belongs to a three-edition series and aggregates
        approved reviews from its two previous editions. Reviews include
        realistic aspect scores, experience tags, and audience recommendations.
      verification: "Series navigation, sentiment summary, structured review tags, and authors render correctly."

    - id: 13
      title: "Join an event discussion"
      description: |
        Open London Salsa Sessions and inspect Discussion, then add a reply
        to an accommodation, ride, or meetup thread.
      expected: |
        Existing threads and replies are visible by category. A new reply posts
        in place and participates in notification delivery.
      verification: "Thread authors, reply counts, composer state, and notification link work."

    - id: 14
      title: "Explore public Dance Passports"
      description: |
        Open Elena's Dance Passport, then visit @maya-rivera and @noah-kim and
        open their Dance Passport and Timeline views.
      expected: |
        Elena's passport includes past festivals in Europe, the Americas,
        Africa, Asia, and Oceania. Maya and Noah also show past history across
        cities and countries.
      verification: "Passport totals and maps exclude future events."

    - id: 15
      title: "Build and share a festival plan"
      description: |
        Open Back 2 Mambo 2026, select Program, filter by day, room, level, and
        instructor, then open My Plan and its share/export actions.
      expected: |
        The published four-day program is populated across rooms. Elena starts
        with three non-conflicting sessions and can add or remove more.
      verification: "Plan count, schedule filters, shared plan, and export preview stay aligned."

    - id: 16
      title: "Suggest an event"
      description: |
        Open Suggest event and submit a complete event with location, schedule,
        links, price, and tags.
      expected: |
        Validation is field-specific, successful submission gets a clear
        confirmation, and no production calendar credentials are required.
      verification: "The contribution completes through the ordinary-user flow."

    - id: 17
      title: "Install Movida and enable push"
      description: |
        In Safari use Share > Add to Home Screen, or use the browser install
        action on Android. Launch the installed app and enable notifications.
      expected: |
        The app launches standalone on the private HTTPS origin, keeps Elena's
        session, and registers notification permission and a push subscription.
      verification: "Installed navigation, safe-area layout, and notification state work on mobile."

    - id: 18
      title: "Tour every notification type"
      description: |
        Sign in as Alex Navarro (@alex-navarro) and open the notifications
        sheet, then repeat as Penny Valdez (@penny-valdez).
      expected: |
        Both inboxes are ordered by importance: urgent plan changes first,
        then actions and decisions, direct activity, friends' activity,
        post-event prompts, discovery, and read history. Both open on a red
        "Event cancelled" row for Lisbon Rooftop Salsa Social and an "Event
        updated" venue change for Lisboa Beach Bachata Social 2027.
        Alex's inbox then mixes a planned-session change, reminder, follow
        request with Approve/Decline, ticket prompt, discussion reply,
        approved request, Follow back, grouped friends going, plan activity,
        review and memories prompts, promo code added, interest match, and
        older read history (new friend, friend saved, friend review,
        discussion posts, suggested event, milestones). Penny's inbox shows
        program updated and available, a reminder with Ask a question,
        "You're the organizer" for Salsa Sunset Amalfi Coast 2027, organizer
        claim decision, promo code rejected and approved, a discussion post,
        and review and memories prompts for the Athens weekender.
      verification: "Each row deep-links to its subject and neither inbox is dominated by interest matches."

    - id: 19
      title: "Write reviews for past weekenders"
      description: |
        Sign in as Penny Valdez (@penny-valdez), open My Events > Past, and
        review each previous weekender edition she attended.
      expected: |
        Penny's only past events are the previous Seville, Milan, Budapest,
        Brussels, and Athens weekender editions, none reviewed by her yet.
        All but Athens already show community reviews and attendees, and each
        links to its upcoming edition through the series.
      verification: "Submitted reviews appear on the event and roll up into the upcoming edition."

    - id: 20
      title: "Open tickets and memories"
      description: |
        As Elena, open My Events, then Seville Salsa Weekender, Brussels Latin
        Weekender, Athens Bachata Weekender, and London Salsa Sessions. Then open the previous Milan, Brussels, and Athens
        weekender editions. Finally
        sign in as one of Elena's friends and open the same past weekenders.
      expected: |
        The four upcoming events show a Ticket chip and Elena's saved passes.
        Each past weekender shows five of Elena's
        photos in Memories. Her friends see the photos; strangers do not.
      verification: "Ticket PDFs and images open in the viewer and memories respect friends visibility."
