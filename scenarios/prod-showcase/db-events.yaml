  description: 'Event: https://facebook.com/events/s/watapana-weekend-2026/689670434146473/


    💃🕺 Watapana Weekend 2026 | Salsa & Bachata Festival 🕺💃


    Van 4 t/m 6 september 2026 verandert Arnhem opnieuw in het kloppend hart van salsa
    & bachata.

    Watapana Weekend is een 3-daags dansfestival vol energie, verbinding en inspiratie,
    georganiseerd in het prachtige Musis Sacrum, midden in de stad.


    ✨ Wat kun je verwachten?

    • Meer dan 25 workshops voor alle niveaus

    • Internationale én lokale artiesten

    • 2 avondfeesten met salsa & bachata in aparte areas

    • Dag socials om lekker door te dansen en te connecten

    • Live salsa concert op zaterdagavond

    • Shows verspreid over het hele weekend

    • Een warme, open community waar iedereen zich welkom voelt


    Of je nu komt om te leren, te dansen, te verbinden of gewoon om te genieten van
    de sfeer, Watapana Weekend draait om samen zijn, groeien en plezier maken op de
    dansvloer.


