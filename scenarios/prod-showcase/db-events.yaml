  title: M. Mambo Marathonios
  description: 'Embark on the Next Chapter of Mythical Mambo! ✨


    Following the resounding success of our inaugural journey and fueled by your incredible
    passion, we are thrilled to announce M. Mambo Marathonios - Edition #2! Prepare
    to dive even deeper into an unparalleled dance experience that captivated hearts
    and ignited souls. ❤️‍🔥


    Where Myth Meets Mambo:

    All under one magnificent roof, your Mambo Odyssey continues at the breathtaking
    Royal & Imperial Belvedere Resort in Hersonissos, Crete, Greece. 🏝️🏨


    🗓️ Dates:

    The main event runs from April 21st - 26th, 2026.



    What Awaits You: An Elevated All-Inclusive Mambo Marathon


    Non-Stop Rhythm: Immerse yourself in 52+ hours of pure, uninterrupted social dancing!
    💃🕺 Days flowing into nights with seamless transitions, ensuring your dance flow
    is never broken. 🔄


    Enjoy 4 days and 4 nights of non-stop social dancing! 🌙


    Experience 4 day socials by the pool ☀️💦 and 4 vibrant night parties! 🎉


    Dance freely in our spacious dancing hall and large pool & bar areas. ✨


    Expect 5+ hours of daytime dancing and 8 hours of nighttime dancing every single
    day! 🔥


    The Maestros Return: Get ready to surrender to the sublime sounds of our same
    incredible lineup of 5 international DJs! 🎧🌍 They''re back to weave their magic,
    promising diverse styles and electrifying sets that keep you moving. Featuring:
    DJ ThePatrick 🇦🇹, DJ Patrick El Clásico 🇨🇭, DJ Tuli 🇬🇧, DJ Anael 🇫🇷, and DJ Asmadi
    🇳🇱! 🌟


    ALL-INCLUSIVE Luxury with Direct Hotel Booking & Special Prices! 🍹🍽️🔑

    We have arranged a special promo code that you will find in our website to book
    special MMM prices directly with the Royal & Imperial Belvedere Resort for a truly
    seamless and luxurious experience! 🏷️ Your stay includes:


    Full Board: Delicious breakfast 🍳, lunch 🥗, and dinner 🍝, offering a rich variety
    of authentic Cretan and Greek dishes. Fuel your dance with exquisite sustenance!
    🇬🇷


    All-Day Snack Bars: Convenient snack bars are available throughout the entire
    day for quick bites! 🥐🍕


    Drinks & Cocktails: Enjoy ALL-INCLUSIVE soft drinks, beverages, and cocktails
    until 23:30 (11:30 PM) daily! Sip, socialize, and stay refreshed! 🥂💦


    Golden Rays & Balmy Nights: Bask in the glorious sunny and warm weather of Europe''s
    southernmost island! ☀️ Embrace daytime temperatures around 22°C (72°F) that feel
    like a perfect 25-26°C (77-79°F) due to the Cretan climate – ideal for sun-kissed
    dances. 🏖️ As the stars emerge, the evenings offer a refreshing coolness, perfect
    for those sensual Mambo moments. 🌬️ (Yes, it''s still basically north of Africa
    😉🙃)


    The Same Dream Team: We''re proud to bring back the very team that made Edition
    #1 so special, including the visionary Alun behind the camera, capturing every
    mythical moment! 🎥💫


    Exclusive Pricing Tiers – Secure Your Spot! 🚀


    PRE-REGISTRATION: €100 (Register now, pay until August 15th! 🗓️)


    Secure your pass today and pay later, locking in the lowest price! To pre-register,
    simply send us an email at mambo@neo.dance! 📧


    EARLY BIRD PASS: €120 (From August 16th until November 30th) 🕊️


    REGULAR PASS: €140 (From December 1st until February 28th) 🎟️


    LATE PASS: €160 (From March 1st until April 21st) 🚨


    Getting Here:

    The closest airport is Heraklion International Airport (HER) ✈️, conveniently
    located approximately 20-25 minutes from the Belvedere Hotel by taxi (€35-€45
    🚕) or 30-40 minutes by direct bus (KTEL bus towards Malia or Agios Nikolaos, stopping
    at Bus Station #24 Belvedere Resort). 🚌 Buses run frequently, every 30-60 minutes;
    check the exact schedule at the bus stop located just outside the airport. ⏰


    Pre-register for your Mythical Experience!


    Chersonissos, Heraklion, Greece 🇬🇷'
