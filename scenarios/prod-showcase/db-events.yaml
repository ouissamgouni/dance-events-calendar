  title: MAMBO FLOW Warsaw Mambo Weekend
  description: 'Warsaw is home to a fast-growing international Mambo community and
    vibrant social dancing. Join us at MAMBO FLOW WEEKEND for a weekend full of dancing,
    great music, and good vibes!


    ➡️ What to expect:

    ▪️ The “Dance & Sleep” Concept: we focus on daytime and evening dancing only.
    No exhausting all-nighters! You’ll get plenty of floor time and still wake up
    feeling refreshed and ready for more.

    ▪️ Role-balanced event: we care about your dance time, so we monitor the lead/follow
    ratio.

    ▪️ The Venue: a stunning industrial space with a huge terrace surrounded by nature,
    the perfect setting for a summer dance weekend.

    ▪️ Warsaw in Summer: experience the city at its best: lush parks, famous open-air
    Chopin concerts, stylish specialty coffee shops, and much more.

    ▪️ The Vibe: dance with old friends, meet new ones from all over the world, and
    enjoy the warmth of a welcoming community.


    💛 Invite the friends you’d love to share the dance floor with in Warsaw.


    If you value flow, musicality, solid technique, and a welcoming social atmosphere,
    this weekend is for you. Let’s bring together dancers who inspire each other,
    enjoy genuine social dancing, and make the community even stronger.'
