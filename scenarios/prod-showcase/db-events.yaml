  description: '💖The most magical dance event of the year!🩷


    😍 Are you ready for some Magic? 🐉


    💥 Magic Slovenian Salsa Festival - MSSF 2027 will be held from January 14 to 18
    🔥


    😎 𝗠𝗼𝗼𝗱 𝗺𝗮𝗸𝗲𝗿𝘀 & 𝗮𝗿𝘁𝗶𝘀𝘁 𝗹𝗶𝗻𝗲𝘂𝗽 will be published in a few days 😎


    ✌️ We want to provide 𝗮𝘀 𝗺𝘂𝗰𝗵 𝘀𝗽𝗮𝗰𝗲 𝗮𝘀 𝗽𝗼𝘀𝘀𝗶𝗯𝗹𝗲 for dancing and socializing.  As
    numbers approach critical mass, we''ll warn you to hurry and reserve your passes.
    The sale will start at the end of August 2027. 🔝

    Follow our 📣 announcements, and we will also inform you in time through the promoters
    about how many places are still available.🆓


    ✌️We started this festival with a vision of providing you with a high level dance
    experience and we would like to keep this high standard .💃🏻


    💙𝗩𝘆𝗻𝗶𝗹 𝗔𝗳𝘁𝗲𝗿𝗻𝗼𝗼𝗻 𝘀𝗼𝗰𝗶𝗮𝗹.  Like at last festival, we are opening the grand hall
    for a last hour of the afternoon social dance on Saturday and Sunday.


    💙𝗧𝗵𝘂𝗿𝘀𝗱𝗮𝘆 𝗲𝘃𝗲𝗻𝗶𝗻𝗴 𝗽𝗿𝗲𝗽𝗮𝗿𝘁𝘆 will be at Festivalna dvorana (Festival hall) which
    is exclusive beautiful dance hall with long tradition and perfect wooden floor
    and bar for socialising and drinks.🍸


    💙Since the venue hotel is as always pretty occupied, you can also check in at
    the 𝗛𝗼𝘁𝗲𝗹 𝗟𝗲𝘃, which is 2 minutes away with a shuttle that we will organize during
    the parties, so that you can move smoothly from your rooms to the congress center
    where the festival is held.


    Start a year with the most magical event from 14 th to 18thJanuary 2027 in Ljubljana
    - Slovenia.


    As always, we will do our best, to feel you magical, with good energy and amazing
    vibe. 🫶🏻


    ❤️ See you people at Magic! ❤️


    Your MSSF team 🍀

    '
