    📅 Datum: 4–6 september 2026

    🎟️ Tickets: Vanaf €110 voor een Full Pass


    👉 Tickets & info: watapanaweekend.com


    Nodig je dansvrienden uit en beleef samen een weekend vol muziek, beweging en
    verbinding ❤️'
