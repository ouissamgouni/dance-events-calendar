test_plan:
  name: "Home review prompt + similar events"
  description: >
    The Home page auto-opens the existing review wizard (bottom sheet on
    mobile, modal on desktop) once per session for the latest attended,
    unreviewed event, under server-side frequency caps. After submitting,
    a success bottom sheet (party popper, "Thanks for your review!") shows
    similar upcoming events (same dance styles, area sized by the reviewed
    event's reach) in a scrollable rail with dots and "See more" into a
    pre-filtered Explorer, plus "Rate next" (any entry point, only while
    unrated events remain), "Explore more events" and "Not now". Admins
    can force the prompt for chosen attendees.

  preconditions:
    - >-
      Start scenario:
      `SCENARIO=review-home-prompt RESET=1 task start:scenario`
    - "Use a mobile viewport (e.g. iPhone 14) for the sheet checks."

  cast:
    - "Alice — attended ev-lyon-wed, ev-lyon-congress (international) and ev-lyon-sat last week; reviewed nothing; international search area = Europe."
    - "Bob   — attended ev-lyon-sat, email + push review prompts OFF."
    - "Admin — admin@example.com."

  steps:
    - id: 1
      title: "Prompt opens on Home"
      description: "Sign in as Alice, open `/` and wait ~1s."
      expected: >
        The review wizard opens (bottom sheet on mobile) titled "How was Lyon
        Salsa Saturday?" with the date · place line, the incentive line
        "Share how it went, then discover similar events!" and a "Not now"
        button. The header menu avatar shows a dot; the menu's Reviews row
        shows "3".

    - id: 2
      title: "Success sheet: local rail with 12 cards"
      description: "Pick Great → Continue through the steps (add a comment) → Submit."
      expected: >
        Success sheet: party popper, "Thanks for your review!", the
        community line, and "Your comment will appear once our team has
        checked it." (never described as published). "Similar events you
        might like" lists 12 Lyon-area salsa cards (picture, title, date,
        place, heart) — no Paris (too far), Lyon Bachata (other style) or
        Madrid. The next card peeks at the right edge, dots under the rail
        follow horizontal scrolling, and the page behind doesn't scroll.
        Buttons: "Rate next", "Explore more events", "Not now"; ✕ top-right.

    - id: 3
      title: "Rail interactions"
      description: "Swipe the rail horizontally, tap a heart, then tap a card."
      expected: >
        Horizontal swipes scroll the rail (cards snap) without dismissing the
        sheet; the heart saves the event without opening it; tapping the card
        closes the sheet and opens the event page.

    - id: 4
      title: "Rate next → international rail"
      description: "On Saturday's success sheet click Rate next, then review Lyon Salsa Congress."
      expected: >
        The wizard opens for Lyon Salsa Congress in the same sheet (no prompt
        header, entry point rate-next). Its success sheet lists 12 salsa
        festivals across Europe (Barcelona, Milan, Berlin …) and none of the
        local socials; "Rate next" is still shown (Wednesday pending).

    - id: 5
      title: "Rate next from another entry point + last one"
      description: >
        Close the sheet. Open Lyon Salsa Wednesday from the menu → Reviews
        (or the "Share your experience" card) and submit a review.
      expected: >
        The success sheet looks the same as from the Home prompt. It has no
        "Rate next" (nothing left to rate) and the Reviews badge is gone.
        (Repeat on a fresh scenario from the event page to see "Rate next"
        appear outside the Home prompt.)

    - id: 6
      title: "Dismissal + navigation"
      description: >
        On a success sheet try each: swipe the sheet down from the top, ✕,
        "Not now", "Explore more events", "See more →".
      expected: >
        Swipe-down (≥ 80px), ✕ and "Not now" close the sheet. "Explore more
        events" opens `/browse`. "See more →" opens Explorer with Salsa
        selected and the area chip ("Lyon … · 25 km" for a local event, the
        Europe area for the congress); the area_* params are removed from
        the URL.

    - id: 7
      title: "Once per session + cooldown"
      description: >
        As Bob, open `/`, click "Not now". Reload `/`, then open a new tab
        (new session) and open `/`.
      expected: >
        The first visit shows the prompt; the reload doesn't (session flag);
        the new session doesn't either (72h cooldown).

    - id: 8
      title: "Admin force"
      description: >
        As Admin: /admin → Configuration → Notifications → Review prompt →
        Send now: pick "Lyon Salsa Saturday", select Bob, keep only the
        "In-app" and "Home prompt" channels, click Preview, then Confirm send.
        Then as Bob, in a new session, open `/`.
      expected: >
        Bob's row shows channel chips (Email/Push "opted out"). The preview
        reads "Would send to 1 of 1 user(s) (1 in-app, 0 email, 0 push,
        1 Home)" and nothing is sent until Confirm. After Confirm, Bob gets
        the in-app notification but no email or push, and his Home shows the
        prompt again despite the cooldown.

    - id: 10
      title: "Second user on the same tab"
      description: >
        As Alice, open `/` and see the prompt, close it, sign out, then sign
        in as Bob in the same tab (no reload) and open `/`.
      expected: >
        Bob's Home prompt check runs (the session flag is per user), so Bob
        gets his own prompt if he is eligible.

    - id: 9
      title: "Admin flags, settings + stats"
      description: >
        As Admin, open Configuration → Notifications → "Home review prompt &
        similar events". Turn "Similar events after review" off, then review
        an event as Bob.
      expected: >
        Both toggles ("Home review prompt", "Similar events after review")
        are ON by default. Caps/radii are editable (cooldown 72, max asks 2,
        max age 14, fatigue 4 / 30 days, radii 25/150/1500, cards 12 from
        this scenario's env). With similar events off, the Home prompt has no
        incentive line and the success sheet has no rail. "Last 30 days"
        lists shown/dismissed/reviewed with conversion, and reviews by entry
        point include "Home prompt" and "Rate next (chain)".
