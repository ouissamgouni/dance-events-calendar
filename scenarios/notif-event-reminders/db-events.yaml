# Focused reminders fixture — two near-future events inside the
# scenario's REMINDER_LEAD_HOURS window (240 h = 10 days), one popular
# (>= EVENT_MESSAGE_CTA_MIN_GOING → reminder carries the "Ask a question"
# CTA) and one quiet (< threshold → reminder omits the CTA), plus one
# control event beyond the window.
base_week: 0
events:
  - id: ev-remind
    calendar_id: salsa-cal-001
    title: Rooftop Salsa Social
    description: "Popular near-future event (4 Going) — reminder carries the ask CTA."
    location: "Skybar, Lisbon, Portugal"
    latitude: 38.7139
    longitude: -9.1394
    start: w1 Tue 20:00
    end: w1 Tue 23:00
    tags:
      - format:social
      - dance-style:salsa
      - reach:international

  # Quiet in-window event BELOW the ask-CTA threshold — proves a reminder
  # without the "Ask a question" CTA (only 1 Going < EVENT_MESSAGE_CTA_MIN_GOING).
  - id: ev-remind-quiet
    calendar_id: salsa-cal-001
    title: Bachata Sunset Practice
    description: "Quiet near-future event (1 Going) — reminder without the ask CTA."
    location: "Riverside Studio, Porto, Portugal"
    latitude: 41.1496
    longitude: -8.6109
    start: w1 Thu 19:00
    end: w1 Thu 21:00
    tags:
      - format:social
      - dance-style:bachata
      - reach:local

  # Control event OUTSIDE the reminder window — proves the
  # REMINDER_LEAD_HOURS filter (nobody should be reminded about this).
  - id: ev-later
    calendar_id: salsa-cal-001
    title: Weekend Mambo Marathon
    description: "Control event beyond the reminder window."
    location: "Dance Loft, Amsterdam, Netherlands"
    latitude: 52.3676
    longitude: 4.9041
    start: w2 Sat 18:00
    end: w2 Sun 01:00
    tags:
      - format:social
      - dance-style:salsa
      - reach:regional
