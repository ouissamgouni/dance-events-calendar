test_plan:
  name: "Explorer UX overhaul — mobile-first landing page"
  description: >
    Verify the Explorer (landing page) UX overhaul. The overhaul is
    delivered as five coordinated phases on top of the existing
    Home → Explorer surface and MUST satisfy:
      1. Default date window is "next 3 months" (NOT "this weekend").
      2. The EventListPanel groups events under sticky day headers
         with a per-day count tail, shows the first 10 events, and
         paginates the rest via a "Show 10 more" CTA. When the
         current period is exhausted, the CTA becomes
         "Show X next available events" and skips empty future
         windows. If filters empty the list, a blue-50 panel offers
         Find next events / Clear / Suggest CTAs.
      3. A compact SummaryBar above the map/list shows the active
        period chip, removable colored tag chips, the active
        interest chip, and a "Clear all" link. Counts live in the
        EventListPanel header so the strip stays compact.
      4. On mobile (< lg), a "Filters" trigger opens a bottom-sheet
         FilterSheet hosting the DateRange / Tags / Interest
         controls. The trigger badges the active-filter count and
         the sheet footer shows "Show N events" tied to the live
         count. Desktop (≥ lg) keeps the inline filter stack.
      5. The map has a fullscreen toggle (⤴ / ×) on DESKTOP that promotes
         the map to a fixed full-viewport surface. On mobile/tablet
         (< lg) the Explorer is timeline-first: a short map miniature
         sits below the filter chips; tapping it (or the Map icon
         toggle in the SummaryBar) opens a fullscreen map with a
         compact "← [Filters] [area]" header and a bottom
         "View list · N" CTA. A "Search this area" pill appears at the
         top of the map whenever the viewer pans / zooms to a custom
         bounds — clicking it applies that bounds as a session override
         (cleared via the SummaryBar area chip × or "Clear all"). The
         area is edited via a dedicated area picker sheet reached from
         the SummaryBar area chip.
      6. The first non-past event card shows a subtle pulse on its
         Save/Going action cluster plus a dismissible blue-50 hint
         panel ("Tap the bookmark to save events to your calendar,
         or the check to mark you're going."). Dismissal persists
         in localStorage under `explorer.coachmark.saveGoing.shown`.

    All UI MUST honor frontend.instructions.md:
      • Square corners (no `rounded-*` except avatars / status dots /
        circular icon toggles).
      • Primary CTAs `bg-blue-500 text-white hover:bg-blue-600`.
      • Secondary `border border-slate-200 bg-white text-slate-700
        hover:bg-slate-50`.
      • No `window.alert/confirm/prompt`, no raw `fetch`/`axios`,
        no new top-level dependencies or icon sets.

  preconditions:
    - "Run with: task start:scenario SCENARIO=explorer-ux-overhaul"
    - >
      Seed (db-events.yaml) has ~80 events spanning a rolling 2-year
      horizon (weeks 0–103) across every continent — Europe-heavy
      (~55%) with North America, Asia, South America, Africa, Oceania,
      and the Middle East represented. Events are mostly salsa with
      reach:international, and carry the production tag taxonomy
      (dance-style / format / reach / level / venue / scale / misc)
      copied verbatim into the scenario's tags.yaml. Roughly 60% are
      paid (price_min/max in region-appropriate currencies) and ~40%
      are free. Enough events sit inside the default 3-month window so
      the Show-more CTA appears immediately; later weeks provide
      next-available-events / show-all and long-horizon testing.
    - >
      The social graph is centred on the signed-in user `viewer`
      (db-follows.yaml): 6 mutual friends (alice, emma, frank, gina,
      hugo, nia) and 10 one-way followees (omar, pablo, quinn, rita,
      samir, tara, ulysses, s01–s03). Going (db-attendances.yaml) and
      interested (db-saves.yaml) records by these people are spread
      across the global dataset so the People filter's Friends vs
      Following (and going vs interested) intents surface visibly
      different event sets. Out-of-graph users (bob, s04/s05, t01–t05)
      act as controls, and a few friends-only records verify privacy
      hiding.
    - >
      First run on a clean browser profile — localStorage key
      `explorer.coachmark.saveGoing.shown` MUST be unset so the
      coachmark renders on the first non-past card.

  steps:
    - id: 1
      title: "Default landing: 3-month window, timeline rail, Show-more CTA"
      description: >
        Open / (Home) as an anonymous visitor on a desktop viewport
        (≥ lg, 1280×800). Do not change any filter.
      expected: >
        • The DateRangePicker reads roughly "Today → Today + 3 months".
        • The SummaryBar above the event list shows:
            - a period chip with the same range,
            - no tag chips, no location chip, no interest chip, no "Clear all" link
              (no removable filters yet),
            - no result-count tail; counts live in the list header.
        • Each EventListPanel card renders a left date rail
          (data-testid="event-card-rail") with weekday, month and day
          number plus a dot on a continuous timeline line. There are no
          sticky day headers (data-testid="event-list-day-header").
        • Exactly 10 cards render; below them a centered
          "Show 10 more" button (data-testid="event-list-show-more")
          is visible. No next-available-events CTA yet.
        • The first non-past card pulses (animate-pulse on the
          action cluster) and a blue-50 hint panel under it reads
          "Tap the bookmark to save events to your calendar, or
          the check to mark you're going." with a × button
          (aria-label="Dismiss hint"), data-testid="event-card-coachmark".

    - id: 2
      title: "Show-more → next available events progression"
      description: >
        Click "Show 10 more" until no in-window
        events remain.
      expected: >
        • After the first click, 10 → up to 20 cards render.
        • Count in the EventListPanel header stays truthful to the
          filtered result set.
        • Once all in-window events are listed, the CTA flips to
          "Show X next available events"
          (data-testid="event-list-extend-period"). Clicking it
          advances `end_date` to the end of the first future
          3-month batch with matching events (URL `end_date` query
          param updates), skipping empty windows if needed. The
          weeks 14–20 events (evt-ux-024…027) appear at the bottom
          and the period chip label updates.

    - id: 3
      title: "Empty state → blue-50 panel with Find / Clear / Suggest"
      description: >
        Open the FilterSheet (or desktop tag pills) and apply a
        tag filter that no in-window event matches — e.g. select
        only "level:advanced".
      expected: >
        • The EventListPanel renders a blue-50 empty-state panel
          (data-testid="event-list-empty") with three buttons:
          "Find next events"
          (data-testid="event-list-empty-extend"), "Clear filters"
          (data-testid="event-list-empty-clear"), and "Suggest an
          event". The EventListPanel header reads "0 / 0".
        • Clicking "Find next events" advances `end_date` only when a
          later batch has matching events. If none exists within the
          lookup horizon, the CTA reads "No future events found" and
          is disabled.
        • Clicking "Clear filters" removes the tag chip from the
          SummaryBar, the cards return, and the panel disappears.

    - id: 4
      title: "One-line SummaryBar chips are interactive + truthful"
      description: >
        Apply two tag filters (e.g. "dance-style:salsa" +
        "format:social") and one interest filter (Following @alice).
      expected: >
        • The bar remains exactly one line and never wraps or scrolls
          horizontally. Visible chips follow Date → Area → Dance →
          Reach → People priority.
        • Each visible chip opens its matching FilterSheet section.
          The final filter chip opens the main Filters sheet.
        • Narrow the viewport until chips no longer fit. Lower-priority
          active filters disappear and the final chip reads `+X`, where X
          counts hidden primary filter groups plus active secondary groups.
        • Widen the viewport until nothing is hidden or folded. The final
          chip shows only the regular filter icon, without a `+0` label.
        • Whenever the list is capped, the EventListPanel header reads
          "Displayed 10 / N" (or the current rendered count), and when
          filters narrow the set the denominator narrows too.

    - id: 5
      title: "Mobile FilterSheet"
      description: >
        Switch to a 390×844 viewport (iPhone 14 Pro). Reload /.
      expected: >
        • The inline desktop filter stack is hidden (CSS, via
          `hidden lg:flex`).
        • A "Filters" trigger button is visible above the list
          (square, secondary style) showing the active filter
          content compact enough to sit above the map/list.
        • The sticky SummaryBar remains one line. Its area chip uses
          data-testid="summary-chip-area" and overflow folds into the
          final `+X` filter chip.
        • A fixed bottom-right icon capsule
          (data-testid="view-switcher") sits above the BottomNav and
          safe-area inset. In List it contains only Map + Calendar.
        • Tapping it opens a bottom-sheet
          (data-testid="filter-sheet") with header "Filters" and a
          close × (aria-label="Close filters").
        • Inside, the same DateRange / TagFilterPills / Interest
          controls render. State is shared with the SummaryBar in
          real time (changing a filter inside the sheet updates
          the count in the footer Apply CTA AND the SummaryBar
          underneath the backdrop).
        • Footer has "Clear all"
          (data-testid="filter-sheet-clear-all", disabled when 0
          active) and a primary Apply CTA
          (data-testid="filter-sheet-apply") reading
          "Show N events" (bg-blue-500) or
          "No matches — close" when N=0.
        • Pressing Escape OR tapping the backdrop closes the sheet.
          Body scroll is locked while open.

    - id: "5b"
      title: "Contextual view capsule → fullscreen map → List"
      description: >
        Still at 390×844, tap Map in the bottom-right view capsule. Tap
        a marker, tap another marker, pan the map, then tap List in the
        same capsule.
      expected: >
        • Map opens fullscreen with the one-line filter header
          (data-testid="map-fullscreen-header"). The old back arrow and
          labeled "View list" CTA are absent.
        • The capsule now contains only List + Calendar, with the same
          fixed 40×40 icon button dimensions used in every view.
        • Tapping a marker shows a compact bottom preview (name, date,
          location, tags, people going, Save, Details); tapping another
          pin replaces it; tapping/panning the map dismisses it.
        • Panning surfaces the "Search this area" pill; committing it
          refreshes pins + count without moving the view capsule.
        • The List icon returns to Explorer list state with filters,
          area, sorting, and the shared date range preserved.
        • Tapping the area chip/label opens the area picker sheet
          (data-testid="area-sheet") with My area / Anywhere presets and
          a mini-map bbox selector; Apply is a session override, and
          "Set as my default area" persists to the profile.

    - id: 6
      title: "Map fullscreen toggle (desktop) + Search-this-area pill"
      description: >
        Back on desktop. Locate the map shell
        (data-testid="explorer-map-shell").
      expected: >
        • On DESKTOP a ⤴ toggle (data-testid="map-fullscreen-toggle",
          secondary square 8×8) sits top-right of the map. Clicking it
          sets `data-fullscreen="true"` and the shell becomes
          `fixed inset-0 z-[8000] bg-white`. Toggle icon flips to
          ×. Clicking × restores the embedded shell. On mobile the
          entry point is the map miniature / SummaryBar Map toggle
          instead of this ⤴ button.
        • Pan the map (drag) to New York (lat ~40.76, lng ~-73.99),
          or any city away from the current effective area.
          A "Search this area" pill
          (data-testid="map-search-this-area", bg-blue-500, top
          center, z-702) becomes visible.
        • Click it. The area chip in the SummaryBar updates to
          something like "Custom area" / "Map view" with a × that,
          when clicked, restores the default area AND removes the
          chip. evt-ux-028 (New York Salsa Rooftop Social) appears
          when the map area is committed or the user switches to
          worldwide/show-all browsing.

    - id: "6b"
      title: "Calendar dates stay synchronized across views"
      description: >
        Open Calendar from List, navigate to the next period, edit Dates
        from the period chip, then switch Calendar → Map → Calendar → Map → List.
      expected: >
        • Calendar's capsule contains only List + Map. The embedded map
          and its existing calendar/map layout toggle remain available.
        • Prev / next / today updates `start_date` and `end_date` to the
          exact visible grid, including adjacent-month spillover dates.
          The URL/filter range uses an inclusive end date.
        • The period chip displays that exact range and opens the Dates
          section in the main FilterSheet.
        • Choosing a Dates range moves Calendar to the selected first date;
          once rendered, the full visible grid becomes the active range.
        • Calendar → Map opens `/?view=map`; Map → Calendar opens `/calendar`
          with `view=map` removed; Map → List removes `view=map`.
          Date, area, tag, and People filters remain active, and List/Map
          results use the same timeframe last displayed by Calendar.

    - id: 7
      title: "Coachmark dismissal persists"
      description: >
        Still on desktop, click the × in the blue-50 hint panel on
        the first non-past card.
      expected: >
        • The hint panel disappears AND the animate-pulse class is
          removed from the action cluster on the first card.
        • Reload the page. The coachmark MUST NOT re-render. Inspect
          localStorage: `explorer.coachmark.saveGoing.shown === "1"`.
        • Past events MUST never receive the coachmark even on a
          fresh profile (the guard is `idx === 0 && !isPast`).

    - id: 8
      title: "Frontend rules compliance spot-check"
      description: >
        Inspect the new surfaces in DevTools (Elements).
      expected: >
        • No `rounded-*` class on SummaryBar chips, FilterSheet
          panel/header/footer, map overlays, the Show-more or
          Extend-period buttons, or the coachmark hint panel.
          Avatars / status dots may still use `rounded-full`.
        • Primary CTAs ("Show N events", "Search this area",
          active-count badges) use `bg-blue-500 text-white
          hover:bg-blue-600`.
        • Secondary CTAs ("Filters" trigger, fullscreen toggle,
          "Clear all" links) use the
          `border border-slate-200 bg-white text-slate-700
          hover:bg-slate-50` family.
        • No `window.alert/confirm/prompt` is invoked by any of
          the new components.
        • No new top-level dependency was added (check
          `frontend/package.json` diff is empty for `dependencies`
          and `devDependencies`).

    - id: 9
      title: "My Events tabs, contextual views, and journey map"
      description: >
        Sign in as viewer@example.com and open /mine/calendar at 390×844,
        then repeat the map check on desktop.
      expected: >
        • Upcoming opens as a month-grouped list with Madrid, Paris, Lisbon,
          Rome, and Amsterdam in chronological order. Paris has a real image;
          every other row collapses the image column. No list row has an order
          number or Save/Going action.
        • Saved contains Paris (also Going), Berlin, and Secret Venue. Rows show
          compact bookmark and hand actions. The unmapped event remains in List
          and Calendar, while Map reports one event without a map location.
        • Past contains the 12 passport attendances, recent-first in List and
          oldest-first on Map. Its + search includes past events by default.
        • List shows Calendar + Map in the floating capsule; Calendar shows
          List + Map; Map shows List + Calendar. The separate + expands search
          inline above the controls without navigating to Explore.
        • Upcoming Map initially selects event 1 and shows one bottom preview.
          Pins are blue numbered circles with city labels. Route defaults on for
          Upcoming/Past and off for Saved; enabling Saved Route draws arrows.
          Turning Route off keeps every pin and changes labels to #1, #2, etc.
        • Swiping the single preview follows chronology and updates the selected
          pin. Curved arrows remain visually subordinate to pins and clusters
          use a distinct count treatment.
  # ──── NOTIFICATIONS COVERAGE ────────────────────────────────────────
  notifications:
    name: "Notifications system integration with Explorer and tribe activity"
    description: >
      Verify comprehensive notification coverage spanning all core
      notification types triggered by social activity (follows,
      attendances, reviews, messages) within the explorer-ux-overhaul
      scenario. This enables testing the broader notification system
      alongside Explorer UI interactions (e.g., seeing "Friend is going"
      badges while browsing the landing page).

    cast:
      - handle: viewer
        email: viewer@example.com
        preferences: "All notifications enabled (email + push)"
        roles: "Signed-in user, central hub of social graph"
      - handle: alice
        email: alice@example.com
        preferences: "All enabled; subset of push-only (interests, milestones)"
        roles: "Mutual friend of viewer; posts Going/reviews/messages"
      - handle: emma
        email: emma@example.com
        preferences: "Email ON for activity; push OFF for interests/milestones"
        roles: "Mutual friend; moderate engagement"
      - handle: frank
        email: frank@example.com
        preferences: "Selective: email ON, push ON (activity); inverted on milestones"
        roles: "Mutual friend; opt-out on review prompts"
      - handle: bob
        email: bob@example.com
        preferences: "Email-only (no push); control for push opt-out testing"
        roles: "Out-of-graph control; independent attendee"
      - handle: gina
        email: gina@example.com
        preferences: "All enabled"
        roles: "Mutual friend; event participant"
      - handle: hugo
        email: hugo@example.com
        preferences: "All enabled except review prompts (both channels)"
        roles: "Mutual friend; event participant"
      - handle: nia
        email: nia@example.com
        preferences: "All enabled"
        roles: "Mutual friend; message participant"

    covered_notification_types:
      - kind: new_follower
        trigger: "emit_notifications: true in db-follows.yaml"
        example: "viewer follows alice (new_follower to alice)"
        participants: "alice (recipient), viewer (actor)"

      - kind: new_friend
        trigger: "emit_notifications: true in db-follows.yaml + mutual follow"
        example: "viewer ↔ alice (bidirectional follow)"
        participants: "viewer + alice (both directions)"

      - kind: subscription_going
        trigger: "emit_notifications: true in db-attendances.yaml + share_publicly: true"
        example: "alice marks Going publicly → viewer [follower] receives notification"
        participants: "Users who mark Going (alice, bob, carol, etc.); followers see it"

      - kind: subscription_review
        trigger: "emit_notifications: true in db-events.yaml + ratings section"
        example: "alice posts review on evt-ux-past-social → her followers see subscription_review"
        participants: "alice, frank, emma, rita post reviews; viewers of these users see them"

      - kind: event_message
        trigger: "emit_notifications: true in db-event-messages.yaml (new file)"
        example: "alice posts message on evt-ux-008 → all Going/Saved users (bob, carol, dave, etc.) see it"
        participants: "Message authors on evt-ux-008 (alice, bob, carol, dave, emma, frank, gina, hugo); evt-ux-011 (nia, omar, pablo, quinn, rita)"

      - kind: event_message_reply
        trigger: "Replies in db-event-messages.yaml threads with emit_notifications: true"
        example: "emma replies to alice's question on evt-ux-008 → alice + thread participants notified"
        participants: "Reply threads on evt-ux-008 and evt-ux-011"

      - kind: subscription_saved
        trigger: "emit_notifications: true in db-saves.yaml (if saves have notifications)"
        example: "user marks event saved with share_publicly: true"
        participants: "Followers see when users save events"

      - kind: subscription_suggested
        trigger: "User-submitted event approvals (if supported in scenario)"
        example: "Approved suggestion fan-out to suggester's followers"
        participants: "Suggestion authors and their subscribers"

    expected_inbox_states:
      viewer:
        - "new_follower from mutual friends (alice, emma, frank, gina, hugo, nia); one-way followees (omar, pablo, etc.)"
        - "new_friend from mutual friends"
        - "subscription_going when friends mark Going publicly"
        - "subscription_review from friend reviews on past events"
        - "event_message from messages on evt-ux-008 and evt-ux-011"
        - "event_message_reply from thread participation"

      alice:
        - "new_follower when viewer starts following"
        - "new_friend when viewer becomes mutual"
        - "subscription_going from her public attendance on evt-ux-008"
        - "subscription_review notification when she posts review on evt-ux-past-social"
        - "event_message notifications from posts/replies on evt-ux-008"

      bob:
        - "Same as alice, BUT push notifications disabled (email-only)"
        - "subscription_going from public attendances"
        - "event_message from evt-ux-008 (Going user)"

      emma:
        - "All activity notifications (follows, Going, reviews, messages)"
        - "Email for interests/milestones; push disabled for those features"

    seeding_summary:
      - "db-follows.yaml: emit_notifications=true → new_follower, new_friend (9 kinds covered)"
      - "db-attendances.yaml: emit_notifications=true → subscription_going (8+ events with public attendances)"
      - "db-events.yaml: emit_notifications=true + ratings section → subscription_review (12 reviews across 3 past events)"
      - "db-event-messages.yaml: emit_notifications=true + top-level posts + threads → event_message, event_message_reply (8+ messages on 2 events)"
      - "mock-users.yaml: expanded with notification preference toggles for viewer, alice, emma, frank, bob, gina, hugo, nia"

    test_approach:
      - "Seed scenario: `task start:scenario SCENARIO=explorer-ux-overhaul`"
      - "Verify Postgres notifications table contains rows for all covered kinds"
      - "Inspect notification_preferences rows to confirm user toggles match mock-users.yaml"
      - "Manual UI test: Open explorer as viewer → check app notification inbox for activity (friends going, reviews, messages)"
      - "Verify read/unread state toggling in notifications center"
      - "Test preference opt-out: confirm bob receives emails but no push notifications"

    deferred_notifications:
      - "event_reminder: scheduler-based (pre-event notifications) — can be tested post-seed with manual scheduler call"
      - "event_review_prompt: scheduler-based (post-event prompts) — deferred to scheduler testing"
      - "interest_event: scheduler-based (matches saved searches) — requires interest_profiles + scheduler run"
      - "milestone_unlocked: Milestones UNLOCK during seeding (viewer has 12 passport attendances → cities_10, countries_8, events_12+ unlocked); notifications are created by scheduler post-seed"
      - "follow_request / follow_request_approved: Phase E8 feature; deferred if E8 not active in scenario"

    milestone_data_in_scenario:
      - "viewer@example.com has 12 seeded passport attendances (evt-passport-01 through evt-passport-12)"
      - "Passport attendances span 10 distinct cities: Paris, Barcelona, Berlin, Milan, Amsterdam, Vienna, Prague, London, Lisbon, Rome"
      - "Passport attendances span 8 distinct countries: France, Spain, Germany, Italy, Netherlands, Austria, Czech Republic, UK"
      - "Milestones unlocked during initial seed: cities_10, countries_8, events_12+ (specific values depend on exact event counts)"
      - "All users have milestone notification preferences configured (email/push toggles)"
      - "To test milestone_unlocked notifications: Run scheduler post-seed → notifications created for milestone recipients"
