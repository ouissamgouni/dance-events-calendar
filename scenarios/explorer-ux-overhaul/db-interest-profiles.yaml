# Seeds the viewer's Interest Profile so "For You" page shows personalized
# recommendations deterministically from the first sign-in.
#
# Every signed-in user auto-gets a permissive "Default" profile on first
# login (backend/services/user_bootstrap.py: whole-Europe bbox, no dance
# tags, reach=international, matches_enabled=false) so bootstrap is
# idempotent and skips creating it once a profile already exists here.
#
# This profile scopes "For You" recommendations to Salsa + Bachata across the
# default "Europe & nearby" bbox with no reach restriction.
interest_profiles:
  - user: viewer@example.com
    label: "Salsa + Bachata"
    area_name: "Europe +"
    min_lat: 24
    min_lng: -18
    max_lat: 69
    max_lng: 50
    dance_tags: ["dance-style:salsa", "dance-style:bachata"]
    reach_tags: []
    matches_enabled: false
    is_active: true
