test_plan:
  name: "Duplicates Management — Admin Duplicate Review Workflow"
  description: >
    Verify the admin "Duplicates" panel end-to-end: on-demand scanning of
    upcoming events for near-duplicate titles, manual flagging of pairs the
    similarity check misses, per-event "Keep" resolution (which removes and
    tags the rejected sibling with a reason), group dismissal ("not
    duplicates") which is sticky across future scans, the scan history log,
    and the "Potential duplicates" section on the admin event detail panel,
    and merging duplicates into one event (fields picked per field, saves,
    Going and reviews moved over, old links redirected).

    Uses 2 calendars: "salsa-primary" (canonical) and "community-listings"
    (re-posts the same nights under similar or, in one case, very
    different wording). 4 candidate pairs are seeded:
      - Pair A (dup-a-primary / dup-a-aggregator): near-identical titles —
        auto-detectable by the title-similarity scan.
      - Pair B (dup-b-primary / dup-b-aggregator): near-identical titles —
        auto-detectable, used to exercise the "dismiss" flow instead of
        "keep".
      - Pair D (dup-d-primary / dup-d-aggregator): identical titles listed
        two days apart — caught by the extended ±1 day window, which only
        accepts near-identical titles. dup-d-lookalike ("Rueda Casino
        Night El Sol", two days before dup-d-primary) is similar but not
        near-identical, so it is never grouped.
      - Pair K (dup-k-primary / dup-k-aggregator): same real event, but
        deliberately dissimilar titles — the similarity scan will NOT
        group these; only the admin's manual "Flag as Duplicates" bulk
        action can.
    unique-tango has no duplicate and must never appear in any group.

  preconditions:
    - "task start:scenario SCENARIO=duplicates-management"
    - "task db:up && task db:migrate"
    - "settings.yaml seeds duplicate_auto_detect_enabled: false — duplicates are only found via the manual 'Scan now' action or manual flagging, not automatically during sync."
    - "Signed in as admin (Dev Mock)."

  steps:
    # ── Sync brings events in with no groups yet (auto-detect is off) ──
    - id: 1
      title: "Sync brings in 10 events, no duplicate groups yet"
      description: >
        Trigger a manual sync from the admin Calendars panel (or
        POST /api/admin/sync). Then open the admin "Duplicates" panel.
      expected: >
        GET /api/events returns 10 upcoming events. The "Duplicates" button
        in the admin action bar shows no pending-count badge. The Pending
        tab of the Duplicates panel is empty.

    # ── Manual full scan finds the 2 similar-title pairs ────────────────
    - id: 2
      title: "'Scan now' finds pairs A, B and D, but not pair K"
      description: >
        In the Duplicates panel, click "Scan now".
      expected: >
        POST /api/admin/duplicates/scan runs a full scan. Three pending
        groups appear in the Pending tab:
        - one containing "Friday Salsa Social at Le Balajo" (dup-a-primary)
          and "Friday Salsa Social - Le Balajo" (dup-a-aggregator)
        - one containing "Bachata Sensual Workshop with Maria"
          (dup-b-primary) and "Bachata Sensual Workshop - Maria"
          (dup-b-aggregator)
        - one containing both "Rueda de Casino Night at El Sol" listings
          (dup-d-primary on Thursday, dup-d-aggregator on Saturday), but not
          dup-d-lookalike
        Neither dup-k-primary nor dup-k-aggregator ("Kizomba Fusion Night"
        / "Monthly Kiz and Afro Social") appear in any group — their
        titles are too dissimilar for the automatic check. unique-tango
        ("Tango Milonga Under the Stars") does not appear either. The
        Duplicates button badge now shows "3".

    - id: 3
      title: "History tab logs the full scan"
      description: "Switch to the History tab in the Duplicates panel."
      expected: >
        The most recent entry shows scan_type "full", status "completed",
        "3 candidates found, 3 group(s) created", and a finished timestamp.

    # ── Event detail panel surfaces the "Potential duplicates" section ──
    - id: 4
      title: "Opening an event from a group shows its duplicate candidate"
      description: >
        In the Pending tab, click the title "Friday Salsa Social at Le
        Balajo" (dup-a-primary).
      expected: >
        The admin event detail side panel opens for dup-a-primary and
        shows a "Potential duplicates" section listing
        "Friday Salsa Social - Le Balajo" (dup-a-aggregator) with "Keep this
        event", "Merge…" and "Not duplicates" actions. The group card in the
        Duplicates panel offers "Merge…" too.

    # ── Keep resolves the group and removes the rejected sibling ─────────
    - id: 5
      title: "'Keep' resolves pair A and removes the rejected sibling"
      description: >
        From either the event detail panel or the Duplicates panel group
        card, click "Keep" for dup-a-primary.
      expected: >
        POST /api/admin/duplicates/{id}/keep returns the group with
        status "resolved" and kept_event_id = dup-a-primary. The group
        moves from Pending to the Resolved tab, showing dup-a-primary as
        "kept" and dup-a-aggregator as "rejected" with reason
        "Duplicate of dup-a-primary — Friday Salsa Social at Le Balajo".
        dup-a-aggregator is now Removed (reason Duplicate; a BlockedEvent
        row exists) and no longer appears in
        GET /api/events or the public Explorer view. The Duplicates
        button badge drops to "2".

    # ── Dismiss keeps both events, and the decision is sticky ───────────
    - id: 6
      title: "'Not duplicates — dismiss group' keeps both events untouched"
      description: >
        On the Bachata Sensual Workshop group, click
        "Not duplicates — dismiss group".
      expected: >
        POST /api/admin/duplicates/{id}/dismiss returns status
        "dismissed". The group moves to the Resolved tab (shown as
        dismissed). Both dup-b-primary and dup-b-aggregator remain
        visible and unblocked in GET /api/events. The Duplicates button
        badge drops to "1" (pair D is still pending).

    - id: 7
      title: "Re-scanning does not recreate the dismissed pair's group"
      description: >
        Click "Scan now" again in the Duplicates panel.
      expected: >
        The Pending tab still holds only pair D — dup-b-primary and
        dup-b-aggregator already co-occurred in a group once (now
        dismissed), so the scan does not recreate a group for that pair.
        The History tab shows a second "full" scan entry with
        "2 candidates found, 0 group(s) created" (pairs B and D are
        still title-similarity matches, but no new group is created: B's
        dismissal is sticky and D is already grouped). dup-a's
        pair is no longer even considered a candidate since
        dup-a-aggregator is now removed.

    # ── Manual flagging catches the dissimilar-title pair ───────────────
    - id: 8
      title: "Bulk 'Flag as Duplicates' groups the dissimilar-title pair"
      description: >
        Open the Events panel. Multi-select "Kizomba Fusion Night -
        Session Latina" (dup-k-primary) and "Monthly Kiz and Afro Social"
        (dup-k-aggregator). Click "Flag as Duplicates".
      expected: >
        POST /api/admin/duplicates/manual creates a new pending group
        with source "manual" containing both events. It appears in the
        Duplicates panel's Pending tab. The Duplicates button badge shows
        "2". A toast confirms "Flagged 2 event(s) as duplicates."

    - id: 9
      title: "'Keep' resolves the manually-flagged group the same way"
      description: >
        In the Duplicates panel, click "Keep" for dup-k-primary on the
        manual group.
      expected: >
        The group becomes "resolved" with kept_event_id = dup-k-primary.
        dup-k-aggregator is now removed with reason
        "Duplicate of dup-k-primary — Kizomba Fusion Night - Session
        Latina". The Duplicates button badge returns to "1".

    # ── Final state check ───────────────────────────────────────────────
    - id: 10
      title: "History tab lists all 3 scans; Resolved tab lists all 3 groups"
      description: >
        Review the History and Resolved tabs of the Duplicates panel.
      expected: >
        History shows 3 entries: 2 "full" scans and 1 "manual_pair" scan,
        in reverse-chronological order. Resolved shows 3 groups: pair A
        (resolved), pair B (dismissed), pair K (resolved). Pair D is still
        pending.

    - id: 11
      title: "Only the 2 rejected events are hidden; the unique event is untouched"
      description: "Call GET /api/events (public, unauthenticated)."
      expected: >
        8 events are returned: dup-a-primary, dup-b-primary,
        dup-b-aggregator, dup-d-primary, dup-d-aggregator,
        dup-d-lookalike, dup-k-primary, unique-tango ("Tango Milonga
        Under the Stars"). dup-a-aggregator and dup-k-aggregator are
        excluded. unique-tango and dup-d-lookalike never appeared in any
        duplicate group at any point in this test.

    - id: 12
      title: "'Keep' on the day-off pair blocks the later listing and tells who saved it"
      description: >
        As Sam, open "Rueda de Casino Night at El Sol" on Saturday
        (dup-d-aggregator) and Save it. As admin, in the Duplicates panel,
        click "Keep" for dup-d-primary. Then sign in as Sam and open the
        notifications bell.
      expected: >
        The group becomes "resolved" with kept_event_id = dup-d-primary.
        dup-d-aggregator is removed; dup-d-lookalike stays visible.
        The Duplicates button badge returns to "0". Sam has "Event removed ·
        Rueda de Casino Night at El Sol — It was listed twice; see Rueda de
        Casino Night at El Sol."; tapping it opens dup-d-primary (Thursday).
        His save is not moved over automatically.

    - id: 13
      title: "Side panel lists events happening at the same time"
      description: >
        Open the Events panel and click "Kizomba Fusion Night - Session
        Latina" (dup-k-primary). Scroll to "Happening at the same time".
      expected: >
        "Monthly Kiz and Afro Social" (dup-k-aggregator) is listed first
        (same venue, overlapping 20:30–00:30) with its time, venue and
        audience chip only — no "Likely duplicate", "Flag" or "Merge…".
        Clicking it opens an Event overview modal above the panel (picture,
        status, date, venue, description) with Close and "Open in admin";
        Close returns to dup-k-primary. Events on other nights are not
        listed.

    - id: 17
      title: "Potential duplicates: search, flag and scan from the side panel"
      description: >
        Open "Tango Milonga Under the Stars" (unique-tango) in the side
        panel. Under Potential duplicates, type "salsa" in the search box,
        click "Friday Salsa Social at Le Balajo", then Cancel. Click it
        again and choose "Flag as duplicate". Then open dup-d-lookalike and
        click "Scan".
      expected: >
        The section is always shown with a search box and a Scan button.
        Results exclude the open event. Clicking one opens its overview with
        Cancel and "Flag as duplicate"; Cancel closes only the overview.
        Flagging toasts "Flagged as duplicate" and the new manual group shows
        under the search box with Keep / Merge… / Not duplicates. Scan on
        dup-d-lookalike lists its groups, or "No duplicates found."

    # ── Merge ────────────────────────────────────────────────────────────
    - id: 14
      title: "Merge shows each event side by side"
      description: >
        As Sam, save "Bachata Sensual Workshop - Maria" (dup-b-aggregator).
        As Admin, in Events select dup-b-primary and dup-b-aggregator and
        click "Merge…".
      expected: >
        The "Merge 2 events" dialog shows one column per event (title, date,
        id, engagement such as "1 saved") plus a Result column. Only the
        fields that differ get a row (at least Title); identical ones are summed
        up as "N identical fields: …". dup-b-primary is preselected as Kept,
        "Notify 1 person who saved or is going" is checked, and a warning
        says it can't be undone.

    - id: 15
      title: "Merging moves people over and removes the duplicate"
      description: >
        Pick the aggregator's title in the Title row, then Merge… → "Yes,
        merge 2 events". Open dup-b-aggregator in the side panel. Also open
        "Merge…" from a Potential duplicates group in the side panel and
        click inside the dialog.
      expected: >
        dup-b-primary now has the aggregator's title and Sam's save. The
        aggregator reads Removed with a "Merged" chip and "Merged into
        dup-b-primary" (opens the kept event). Sam has "Event removed · … It
        was listed twice; your plans moved to …" which opens dup-b-primary.
        The kept event's history lists an accepted admin change for the
        title. From the side panel the merge dialog sits above the panel and
        clicking in it keeps both open.

    - id: 16
      title: "Old links open the kept event"
      description: "Signed out, open /event/dup-b-aggregator."
      expected: "The URL is replaced by /event/dup-b-primary and the kept event loads."
