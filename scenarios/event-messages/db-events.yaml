# Pre-seeded boards. New categories are spread across events; reply chains on
# ev-board give the 4 / 3 / 1 / 0 reply-count spread requested.
messages:
  # ── ev-board: 4 threads, reply counts 4 / 3 / 1 / 0 ──────────────────
  - key: board-q
    event_id: ev-board
    email: bob@example.com
    category: question
    body: "Is there a beginner lesson before the social starts?"
  - reply_to: board-q
    event_id: ev-board
    email: carol@example.com
    body: "Yes — a 30-min intro at 7:30pm."
  - reply_to: board-q
    event_id: ev-board
    email: dave@example.com
    body: "Great, I'll come early for it too."
  - reply_to: board-q
    event_id: ev-board
    email: erin@example.com
    body: "Do we need a partner for the lesson?"
  - reply_to: board-q
    event_id: ev-board
    email: frank@example.com
    body: "No partner needed — everyone rotates."

  - key: board-acc
    event_id: ev-board
    email: carol@example.com
    category: accommodation
    body: "Splitting an Airbnb near Skybar — 2 spots left, anyone in?"
  - reply_to: board-acc
    event_id: ev-board
    email: dave@example.com
    body: "Interested! What's the nightly rate?"
  - reply_to: board-acc
    event_id: ev-board
    email: erin@example.com
    body: "I might join for Friday only."
  - reply_to: board-acc
    event_id: ev-board
    email: grace@example.com
    body: "Sent you a message about the dates."

  - key: board-ride
    event_id: ev-board
    email: dave@example.com
    category: ride
    body: "Driving in from Cascais around 7pm — room for 2."
  - reply_to: board-ride
    event_id: ev-board
    email: erin@example.com
    body: "Could I grab a lift back too?"

  - key: board-tix
    event_id: ev-board
    email: erin@example.com
    category: tickets
    body: "One spare early-bird ticket at face value — message me."

  # ── ev-saved: one meetup thread ──────────────────────────────────────
  - key: saved-meetup
    event_id: ev-saved
    email: carol@example.com
    category: meetup
    body: "Meeting at the bar counter at 8 — look for the red rose."

  # ── ev-going: one lost-and-found thread ──────────────────────────────
  - key: going-lost
    event_id: ev-going
    email: bob@example.com
    category: lost_found
    body: "Left a black jacket last week — did anyone hand one in?"

  # ── ev-series-upcoming: meetup + question alongside the review roll-up ─
  - key: series-meetup
    event_id: ev-series-upcoming
    email: carol@example.com
    category: meetup
    body: "First-timers — we gather by the entrance at 8, come say hi!"
  - key: series-q
    event_id: ev-series-upcoming
    email: dave@example.com
    category: question
    body: "Is the floor sprung wood or tile this week?"

  # ── ev-past: read-only board (accommodation thread + a question) ──────
  - key: past-acc
    event_id: ev-past
    email: alice@example.com
    category: accommodation
    body: "Anyone need a roommate to split the place near the venue?"
  - reply_to: past-acc
    event_id: ev-past
    email: carol@example.com
    body: "I was looking too — let's compare places!"
  - key: past-q
    event_id: ev-past
    email: bob@example.com
    category: question
    body: "Was there a cloakroom at this venue?"
