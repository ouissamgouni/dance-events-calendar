# Resolved series so the upcoming edition can surface the roll-up of reviews
# left on last week's sibling (cross-edition aggregation).
event_series:
  - canonical_title: Tuesday Kizomba Nights
    status: resolved
    source: manual
    members:
      - ev-series-past
      - ev-series-upcoming

