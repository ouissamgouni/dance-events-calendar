# Event-messages scenario — nine events covering every board state.
#
# Primary user = Alice ("you"). Engagement (Going ∪ Saved) decides who is
# notified when someone posts, and the board goes read-only once an event ends.
#
#   ev-board          upcoming — LIVE board pre-seeded with 4 threads whose
#                     reply counts are 4 / 3 / 1 / 0. Alice is Going.
#   ev-empty          upcoming — no messages yet (empty-state + Ask CTA).
#   ev-saved          upcoming — Alice SAVED it; other attendees/savers present.
#   ev-going          upcoming — Alice is GOING; other attendees/savers present.
#   ev-no-audience    upcoming — nobody engaged. Posting is allowed but fans
#                     out to no one; the poster is auto-engaged (auto-saved).
#   ev-not-engaged    upcoming — Alice neither saved nor Going. Others engaged.
#                     Proves posting is allowed for a non-engaged user and that
#                     a post reaches the engaged crowd but not Alice (yet).
#   ev-series-upcoming upcoming — member of a resolved series; shows the series'
#                     Typical Experience roll-up (reviews) alongside messages.
#   ev-series-past    past — reviewed sibling that feeds the roll-up above.
#   ev-past           past — read-only board with pre-seeded messages + reviews.
base_week: 0
events:
  - id: ev-board
    calendar_id: salsa-cal-001
    title: Friday Salsa Social
    description: "Upcoming social — coordinate accommodation, rides, tickets, meetups, and questions here."
    location: "Skybar, Lisbon, Portugal"
    latitude: 38.7139
    longitude: -9.1394
    start: w1 Fri 20:00
    end: w1 Fri 23:00
    price_is_free: true
    tags:
      - format:social
      - dance-style:salsa
      - reach:local

  - id: ev-empty
    calendar_id: salsa-cal-001
    title: Saturday Beginner Social
    description: "Upcoming social with no messages yet — try the empty board's Ask a question CTA."
    location: "Community Hall, Lisbon, Portugal"
    latitude: 38.7223
    longitude: -9.1393
