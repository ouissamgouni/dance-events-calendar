  - id: ev-series-upcoming
    calendar_id: salsa-cal-001
    title: Tuesday Kizomba Nights — Upcoming
    description: "Upcoming edition of a weekly series. Not yet happened, so the board shows the series' Typical Experience roll-up instead of its own reviews."
