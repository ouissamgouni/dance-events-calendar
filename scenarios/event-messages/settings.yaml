# Turn INSTANT email mode ON for the event_messages feature, on top of the
# default digest mode, so this scenario exercises the immediate (no-schedule)
# email path. With instant ON, a plain dispatch tick emails a new post/reply
# right away (stamps instant_emailed_at); the digest step is skipped for that
# notification (instant wins — exactly one email per row).
#
# Reviews are enabled (show_ratings) so the series roll-up on ev-series-upcoming
# and the Community Experience block on ev-past render from first boot.
# review_mood_headline_min_reviews is lowered so the Typical Experience
# headline appears even with a handful of reviews. Series auto-detection is off
# so the seeded resolved series is the only grouping.
settings:
  event_messages_email_instant: true
  show_ratings: true
  review_mood_headline_min_reviews: 1
  series_auto_detect_enabled: false
