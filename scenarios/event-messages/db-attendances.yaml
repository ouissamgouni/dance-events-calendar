  - event_id: ev-series-past
    email: carol@example.com
    share_publicly: true
    share_audience: public
  - event_id: ev-series-past
    email: dave@example.com
    share_publicly: true
    share_audience: public
  - event_id: ev-past
    email: alice@example.com
