# Discover "show more / shuffle / invite" scenario.
#
# A single mutual friend (alice) follows a large candidate pool
# (pop01..pop15). Because the pool (15) exceeds one page on both
# surfaces (/discover page size 12, My network page size 6), the
# "Show more" and "Shuffle" controls become exercisable, and the
# "Invite a friend" CTA is always present as the can't-find-people
# escape hatch.
#
# All candidates share the same rank signals (1 mutual witness, 0
# subscribers), so the deterministic order is handle ascending:
# pop01, pop02, ..., pop15.
users:
  - email: viewer@example.com
    name: Vera Viewer
    handle: viewer
    account_visibility: public
  - email: alice@example.com
    name: Alice Rivera
    handle: alice
    account_visibility: public
