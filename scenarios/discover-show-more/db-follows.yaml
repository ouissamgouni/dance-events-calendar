# Follow graph for the discover show-more / shuffle scenario.
#
# viewer <-> alice are mutual friends. alice follows all 15 candidates,
# so each candidate has exactly one mutual witness (alice). viewer does
# not follow any candidate, so all 15 are suggestable on both /discover
# and Account -> My network -> Suggestions.
follows:
  - follower: viewer
    followee: alice
  - follower: alice
    followee: viewer
  - follower: alice
    followee: pop01
