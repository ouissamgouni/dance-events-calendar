# FoF graph — drives the deterministic ranking exposed at
# GET /api/social/me/suggestions for `viewer`:
#
#   viewer <-> alice, bob, carol   (mutual friends)
#   alice -> pop1, pop2, pop3-pop10, privatepop (10 candidates)
#   bob   -> pop1, pop2            (2 candidates)
#   carol -> pop1                  (1 candidate)
#
# Expected suggestions for `viewer` (ordered by mutual count desc):
#   pop1 (3 mutuals: alice + bob + carol)
#   pop2 (2 mutuals: alice + bob)
#   pop3-pop10 (1 mutual each: alice)
#   privatepop (1 mutual: alice; account_visibility does not hide suggestions)
#
# The expanded pool ensures enough candidates to show pagination controls
# across different surfaces when combined with other scenarios.
#
# `loner` has no follow edges → response must be empty.
follows:
  - follower: viewer
    followee: alice
  - follower: alice
    followee: viewer
  - follower: viewer
    followee: bob
  - follower: bob
    followee: viewer
  - follower: viewer
    followee: carol
  - follower: carol
    followee: viewer
  - follower: alice
    followee: pop1
  - follower: alice
    followee: pop2
  - follower: alice
    followee: pop3
  - follower: alice
    followee: pop4
  - follower: alice
    followee: pop5
  - follower: alice
    followee: pop6
  - follower: alice
    followee: pop7
  - follower: alice
    followee: pop8
  - follower: alice
    followee: pop9
  - follower: alice
    followee: pop10
  - follower: alice
    followee: privatepop
  - follower: alice
    followee: hiddenpop
  - follower: bob
    followee: pop1
  - follower: bob
    followee: pop2
  - follower: bob
    followee: hiddenpop
  - follower: carol
    followee: pop1
