test_plan:
  name: "Event schedule – Program, My Plan and admin publishing"
  description: >
    Covers the mobile attendee program and the full admin schedule workflow
    across four events. The primary fixture uses the real five-day Back 2
    Mambo 2026 first-weekend program (66
    sessions transcribed from the official poster). The published attendee
    snapshot has three simultaneous Friday 14:00 workshops, multi-hour
    bootcamps, combined-hall socials/shows, cross-midnight night parties, a
    roomless Monday afterparty and one cancelled session. The draft changes
    the first workshop title so publication isolation is visible immediately.
    Additional fixtures cover a published compact program, an admin-only draft,
    and an event without a schedule, with Going, planner and notification-opt-out users.

  preconditions:
    - "task start:scenario SCENARIO=event-schedule"
    - "Sign in as Maya Dancer for attendee checks or Dev Admin for admin checks."

  steps:
    - id: 1
      title: "Open and filter the published mobile program"
      description: >
        Open Back 2 Mambo 2026 and choose Program. Select Friday 16 October,
        then open Filter schedule and inspect the Level, Activity type and
        Instructor controls. Open the Instructor picker, search for a name,
        select it, close and reopen the filter sheet, and try a combination
        with no matching sessions.
      expected: >
        Program and My Plan are above a compact Filter schedule bar, followed
        immediately by the day selector. The grid shows only rooms used Friday,
        with time labels fixed while rooms scroll. The published title is
        "Shines / Partnerwork", not the draft-only title. The three Level pills
        remain on one row, Activity type pills wrap, and all controls have
        comfortable mobile tap targets. Instructor opens a nested sheet with a
        stable header, search and single-select radio rows; choosing one returns
        to the filter sheet. Reset is disabled with no draft filters and enabled
        after a selection. Unapplied drafts survive closing and reopening without
        changing the grid. The result count updates immediately, the bottom CTA
        stays fixed while content scrolls, and zero matches shows a disabled
        "No sessions match" action. Applied filters appear only in the compact
        summary bar.

    - id: 2
      title: "Compare simultaneous choices"
      description: "Tap the 14:00 time label."
      expected: >
        A sheet shows three sessions in Grand Hall, Lounge Hall and Nyx (Jemis &
        Dyanna, Joana Coimbra, Alexis Ruiz) plus the Main Hall Afternoon Social
        Party. Room, venue, instructor, title and level are readable without
        fabricated copy.

    - id: 3
      title: "Open details and toggle My Plan"
      description: "Open Musicality Intro, add it to My Plan, then remove it."
      expected: >
        The details sheet has one primary plan action whose saved state updates
        immediately. Returning to the grid preserves the scroll position.

    - id: 4
      title: "Inspect seeded conflicts and cancellation"
      description: "Switch to My Plan while signed in as Maya Dancer."
      expected: >
        Friday's two 14:00 workshops show a subtle overlap warning. Saturday's
        cancelled Groovy ChaCha Partnerwork (Rumen & Yulia, Nyx 20:00) remains
        visible and explicitly says it was cancelled.

    - id: 5
      title: "Check late-night grouping"
      description: "Return to Friday's Program and scroll past midnight."
      expected: >
        Shows (00:00) and Mambo Night Party (01:00–07:00) remain grouped under
        Friday because the schedule day cutoff is 06:00. The grid extends into
        Saturday morning. Shows Rehearsals cannot be added to My Plan.

    - id: 6
      title: "Inspect the unpublished admin draft"
      description: "Sign in as Dev Admin and open the event Schedule editor."
      expected: >
        The draft grid shows "Shines / Partnerwork – Updated draft" and the
        Publish action reports one changed session. Preview as attendee displays
        the draft banner and updated title while the normal attendee route does not.

    - id: 7
      title: "Create a warning without blocking save"
      description: "Create a session overlapping an existing Grand Hall session."
      expected: >
        The editor warns about the room conflict and offers Cancel or Save anyway.
        Saving intentionally is allowed and the issue appears in the publish review.

    - id: 8
      title: "Publish reviewed changes"
      description: "Open Publish, leave the broad Going update unchecked, review the diff and confirm. Refresh the attendee Program."
      expected: >
        A new publication version is created and the attendee route now shows
        the updated title and any intentionally saved overlapping session.
        Impacted planners are notified automatically, while other Going users
        receive no broad update unless the checkbox is selected before publishing.

    - id: 9
      title: "Inspect planners"
      description: "Open Program Settings and expand People with plans."
      expected: >
        Maya and Noor appear with plan counts and expandable session titles.
        Maya is marked Going; Noor demonstrates that a planner need not be Going.
        Leo, Sara and Omar do not appear because they have no planned sessions.

    - id: 10
      title: "Check session list tools"
      description: "Open Sessions, choose a date, filter by instructor, level and type, then clear the filters."
      expected: >
        The same controls as the calendar are available. The first table column
        contains weekday and date, only matching rows remain, and the calendar
        and list advance to the earliest day with a result when necessary.

    - id: 11
      title: "Check calendar positioning and autocomplete"
      description: "Scroll late in a day, then change a date or filter and choose an instructor suggestion."
      expected: >
        The grid positions the first matching session instead of retaining the
        previous late timeslot. Instructor search offers names from the program.

    - id: 12
      title: "Check schedule states across events"
      description: "Open Prague Salsa Weekender, Brno Bachata Lab and Vienna Social Night as attendee and admin."
      expected: >
        Prague has a distinct published Program and Lina has a plan. Brno has
        an editable draft but no attendee Program action. Vienna offers Create
        schedule to admin and has no attendee Program action.

    - id: 13
      title: "Check Settings and preview"
      description: "Select a timezone from Event timezone, save it, then open Preview."
      expected: >
        Timezones are searchable/selectable IANA values. The embedded preview
        begins at filters and date pills without the full app header or tabs.

    - id: 14
      title: "Check remove actions and back navigation"
      description: "Remove a My Plan row with its cross, inspect the session-sheet remove action, and navigate Event → Program → Event → Back."
      expected: >
        The row uses a cross rather than a menu. The sheet action has subtle red
        text and border. Back returns through Event to the original surface and
        never loops between Event and Program.

    - id: 15
      title: "Check adjacent session boundaries"
      description: "Edit Latin Salsa Fusion and compare it with Crazy Partnerwork."
      expected: >
        No Scheduling conflict appears because Crazy Partnerwork ends exactly
        when Latin Salsa Fusion starts; real overlaps still produce a warning.
