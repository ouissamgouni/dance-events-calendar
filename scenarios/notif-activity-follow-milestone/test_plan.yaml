test_plan:
  name: "Friend milestones — activity notification"
  description: >
    When someone you follow reaches a Dance Passport milestone, followers
    receive grouped `subscription_milestone` activity in-app, by push, and
    by email. Each milestone remains an atomic row, while milestones found
    in one evaluation share a group_key. Fan-out is gated by the actor's `passport_visibility`:
    public notifies followers, private notifies nobody. Rows are deduped
    on the milestone key (`subject_key`).

  preconditions:
    - "Start Mailpit: `mailpit --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025`"
    - >-
      Start scenario:
      `SCENARIO=notif-activity-follow-milestone RESET=1 task start:scenario`
    - "Open the Mailpit inbox at http://127.0.0.1:8025 and clear existing messages."
    - >-
      Alice (public passport) attends five past events and unlocks "First
      Steps" plus "Regular" together. Mallory (private passport) attends one
      and unlocks "First Steps".

  cast:
    - "Alice — actor, PUBLIC passport; unlocks First Steps + Regular."
    - "Mallory — actor, PRIVATE passport; unlocks First Steps."
    - "Bob — follows Alice; friend_milestones email + push ON."
    - "Carol — follows Mallory (private) → visibility-gate control."
    - "Dave — follows nobody → negative control."

  steps:
    - id: 1
      title: "Trigger a dispatch tick"
      description: >
        `SCENARIO=notif-activity-follow-milestone task notify:trigger:scenario`
        so the milestone service evaluates passports and fans out.
      expected: >
        Alice and Mallory each get their own self `milestone_unlocked`
        row; the friend fan-out runs for Alice (public) only.

    - id: 2
      title: "Follower of a public passport is notified"
      description: >
        `GET /api/notifications` as Bob.
      expected: >
        Bob has ONE visible `subscription_milestone` item saying Alice
        unlocked 2 milestones and naming First Steps and Regular. Two atomic
        rows share a non-null group_key and member_ids contains both IDs.

    - id: 3
      title: "Follower of a private passport is NOT notified"
      description: >
        `GET /api/notifications` as Carol.
      expected: >
        Carol has zero `subscription_milestone` rows — Mallory's private
        passport suppresses friend fan-out despite Carol following her.

    - id: 4
      title: "Non-follower gets nothing"
      description: >
        `GET /api/notifications` as Dave.
      expected: >
        Zero subscription_milestone rows.

    - id: 5
      title: "Dedup on repeat ticks"
      description: >
        Trigger a second dispatch tick.
      expected: >
        Bob still has exactly two atomic subscription_milestone rows and one
        visible grouped item. The `subject_key` dedupe prevents duplicates.

    - id: 6
      title: "Immediate push + instant email"
      description: >
        Bob has friend_milestones push + email ON, and settings.yaml
        enables friend_milestones INSTANT email mode. The plain dispatch
        tick from step 1 (no `--immediate-emails`) delivers both.
      expected: >
        Bob receives ONE push and ONE instant email, each saying Alice
        unlocked 2 milestones and naming First Steps and Regular. Both raw
        rows have pushed_at and instant_emailed_at stamped.

    - id: 7
      title: "Digest email on the scheduled/forced tick"
      description: >
        In the admin Milestones settings, turn friend milestone Instant email
        OFF and leave Digest ON. Then run
        `SCENARIO=notif-activity-follow-milestone task notify:trigger:scenario -- --immediate-emails`
        `--immediate-emails` passes `force=True` so the per-user digest
        schedule is bypassed.
      expected: >
        Bob receives a DIGEST email containing one logical milestone item with
        both names. Both raw rows have emailed_at stamped; enabling instant
        suppresses digest delivery until instant is turned off.

    - id: 8
      title: "A later evaluation stays separate"
      description: >
        After Alice's first batch is delivered, add enough new past attendance
        to cross another milestone threshold and trigger another tick.
      expected: >
        Bob sees a second in-app item with a different group_key. Marking one
        item read updates all of its member IDs without changing the other
        batch, and the later batch delivers separately by email and push.
