# Alice + Mallory each attend one past event → each unlocks the
# "First Steps" milestone on the next milestone-service tick. No RSVP
# fan-out needed here (events are past), so emit_notifications stays off.
emit_notifications: false
attendances:
  - event_id: ev-past
    email: alice@example.com
    share_publicly: true
    share_audience: public
  - event_id: ev-past2
    email: mallory@example.com
    share_publicly: true
    share_audience: public
