test_plan:
  name: "Activity digest — all features in one email"
  description: >
    Comprehensive digest-email render test. One actor (Alice) generates
    activity across EVERY digest-eligible feature bucket and a single
    follower (Bob) with all `email_*` toggles ON receives ONE combined
    digest email whose body carries a section for each feature:
    friends_going (Alice is going), social_activity (a new follower + a
    new friend), friend_reviews (Alice reviewed an event),
    friend_milestones (Alice reached a passport milestone),
    interest_matches (a new event matched Bob's profile),
    suggested_events (Alice's suggested event was approved),
    milestone_unlocked (Bob's OWN first passport milestone) and
    event_messages (Alice posted on a board Bob is going to) — plus the
    "People you may want to follow" suggestions section and the
    engagement CTA block. Carol (all toggles OFF) is the negative probe.
    Push is silent (every user has push_* OFF). Run once with Combined
    digest (v2) ON for the single card email, then flip it OFF in admin
    to see the legacy per-feature list emails.

  preconditions:
    - "Start Mailpit: `mailpit --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025`"
    - >-
      Start scenario:
      `SCENARIO=notif-activity-digest-email RESET=1 task start:scenario`
    - "Open the Mailpit inbox at http://127.0.0.1:8025 and clear existing messages."

  cast:
    - "Alice — actor; Going ev-friend, reviewed ev-review, attended ev-past (milestone), suggested ev-suggested (approved), posted on ev-messages. Mutual friend of Bob."
    - "Bob   — follower with EVERY `email_*` toggle ON → one all-features digest. Also attended ev-past (his OWN first milestone) and is Going ev-messages (engaged recipient of Alice's board post)."
    - "Carol — follower with EVERY `email_*` toggle OFF → in-app only."
    - "diego, elena — followed by Alice; surfaced as Bob's mutual-friend suggestions."
    - "curator-bachata — admin-managed curator, also followed by Alice; surfaced as a third suggestion alongside diego/elena."

  steps:
    - id: 1
      title: "Trigger one dispatch tick — every feature's rows are seeded and the digest ships"
      description: >
        `SCENARIO=notif-activity-digest-email task notify:trigger:scenario -- --immediate-emails`
        `--immediate-emails` passes `force=True` to
        `activity_email.run_once` so the per-user digest schedule
        (default tue+fri @ 09:00 local) is bypassed for this run only.
        The same tick runs the interest matcher and the milestone
        service, so all five feature kinds are pending by the time the
        digest is assembled.
      expected: >
        In-app rows created for Bob across all features. `activity.digests=1`
        (Bob only — Carol's user-level toggles are all false, blocking
        email delivery). No `skipped_off_schedule` in the diagnostic
        (force bypasses the slot check).

    - id: 2
      title: "One digest email folds in every feature line"
      description: >
        Open Bob's digest email in Mailpit and read the activity list.
      expected: >
        Bob receives exactly ONE combined digest email prefixed with
        "Movida:" containing a section for each feature:
        friends_going — "Alice is going to Bachata Friendly Social";
        social_activity — "Carol started following you" and "You and Alice
        are now friends"; friend_reviews — "Alice shared their experience
        of Rooftop Salsa Social"; friend_milestones — "Alice reached a
        milestone: ..."; interest_matches — "International Salsa Congress
        Paris matched your ... alert"; suggested_events — "Alice suggested
        the event Rooftop Kizomba Sunset"; milestone_unlocked (Your
        achievements) — "🎉 You unlocked ..." for Bob's own first milestone,
        whose card tile is a 🏅 medal (NOT a duplicate 🎉); event_messages —
        "Alice asked ... Sunday Social Practica". Carol receives 0 emails.

    - id: 3
      title: "Push channel remains silent"
      description: >
        Verify no push attempted (every user has push_* OFF).
      expected: >
        `activity.pushed=0`.

    - id: 4
      title: "People you may want to follow section"
      description: >
        Open Bob's digest email in Mailpit and inspect the section below
        the activity list.
      expected: >
        A section titled "People you may want to follow" lists 3 rows —
        diego, elena and curator-bachata — each ranked via Bob and
        Alice's mutual friendship (`mutual_friend_count=1`). Each row
        shows: a circular avatar (diego/elena/curator-bachata all have an
        `avatar_url`, so no gray-circle placeholder should appear), a
        "Friend of 1 mutual friend · N followers" line (diego shows 2
        followers — Alice and Carol both follow him; elena and
        curator-bachata show 1 follower — Alice only), and a blue
        "Follow" button. The Follow button links to
        `{app}/u/{handle}?follow=1` (where `{app}` is the scenario's
        actual assigned frontend origin, e.g. `http://localhost:<SC_WEB_PORT>`
        — NOT a hardcoded `localhost:5173`; clicking it while signed in
        auto-follows that person on page load). Carol receives no email
        so this section is moot for her.

    - id: 5
      title: "Engagement links"
      description: >
        Inspect the CTA block at the bottom of Bob's digest email, above
        the unsubscribe footer.
      expected: >
        All four CTAs render on a single horizontal line (one table row):
        "Open Movida" (a button prefixed with the open.png icon, linking
        to `{app}/`, the Movida home page — not the notifications settings
        anchor), followed immediately by three smaller plain links (not
        buttons, `font-size:12px`), each prefixed with its icon: "Invite a
        friend" (share.png) links to `{app}/invite`; "Install Movida"
        (save-pink.png) links to `{app}/install`; "Settings"
        (setting.png) links to `{app}/account#notifications` (the
        "Notifications & email" section). `{app}` is the scenario's actual
        assigned frontend origin (dynamic port), not a hardcoded
        `localhost:5173` — and the `open.png`/`share.png`/etc. icons must
        render (both depend on the scenario's `PUBLIC_APP_URL` override
        matching the live frontend port).

    - id: 6
      title: "Combined digest OFF → legacy per-feature emails"
      description: >
        Reset Mailpit, open admin Settings → Activity digest, toggle
        "Combined digest" OFF, then re-run the digest trigger
        (`task notify:trigger:scenario -- --immediate-emails`).
      expected: >
        Instead of the single combined card, Bob now receives SEPARATE
        legacy list emails — one per feature bucket that has activity
        (friends_going, social_activity, friend_reviews,
        friend_milestones, interest_matches, suggested_events,
        milestone_unlocked, event_messages) — each a plain per-feature
        digest. Carol still receives 0 emails. Toggling the flag back ON
        restores the single combined card from step 2.
