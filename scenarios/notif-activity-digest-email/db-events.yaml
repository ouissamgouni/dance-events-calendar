# All-features digest fixture. Alice generates activity across every
# feature bucket; Bob (all email_* ON) folds them into ONE digest:
#   ev-friend    — Alice is Going          → friends_going line
#   ev-review    — Alice reviewed it       → friend_reviews line
#   ev-past      — Alice attended (past)   → friend_milestones line (subscription_milestone)
#                  Bob also attended       → milestone_unlocked line (Bob's OWN first milestone)
#   ev-interest  — matches Bob's profile   → interest_matches line
#   ev-suggested — Alice's suggestion OK'd → suggested_events line (subscription_suggested)
#   ev-messages  — Bob is going; Alice posts→ event_messages line (event_message)
# `emit_notifications: true` drives the review + event-message fan-out;
# `emit_suggested` fans out the approved-suggestion notification.
base_week: 0
emit_notifications: true
events:
  - id: ev-friend
    calendar_id: salsa-cal-001
    title: Bachata Friendly Social
    description: "Alice is going — drives the friends_going line."
    location: "Studio Azul, Paris, France"
    latitude: 48.8662
    longitude: 2.3744
    start: w1 Wed 19:30
    end: w1 Wed 22:30
    tags:
      - format:social
      - dance-style:bachata
      - reach:local

  - id: ev-review
    calendar_id: salsa-cal-001
    title: Rooftop Salsa Social
    description: "Past event Alice reviewed — drives the friend_reviews line."
    location: "Skybar, Lisbon, Portugal"
    latitude: 38.7139
    longitude: -9.1394
    start: w-1 Wed 05:00
    end: w-1 Wed 08:00
    tags:
      - format:social
      - dance-style:salsa
      - reach:local

  - id: ev-past
    calendar_id: salsa-cal-001
    title: Beginner Salsa Night
    description: "Past event Alice attended — unlocks her first milestone."
    location: "Casa del Ritmo, Madrid, Spain"
    latitude: 40.4168
    longitude: -3.7038
    start: w-1 Mon 18:00
    end: w-1 Mon 20:00
    tags:
      - format:social
      - dance-style:salsa
      - reach:local

  - id: ev-interest
    calendar_id: salsa-cal-001
    title: International Salsa Congress Paris
    description: "Upcoming event matching Bob's interest profile."
    location: "Le Grand Salon, Paris, France"
    latitude: 48.8566
    longitude: 2.3522
    start: w1 Sat 20:00
    end: w1 Sat 23:59
    tags:
      - format:social
      - dance-style:salsa
      - reach:international

  - id: ev-suggested
    calendar_id: salsa-cal-001
    title: Rooftop Kizomba Sunset
    description: "Event Alice suggested — approval drives the suggested_events line."
    location: "Terrace 9, Paris, France"
    latitude: 48.8600
    longitude: 2.3500
    start: w1 Thu 20:00
    end: w1 Thu 23:00
    tags:
      - format:social
      - dance-style:kizomba
      - reach:local

  - id: ev-messages
    calendar_id: salsa-cal-001
    title: Sunday Social Practica
    description: "Bob is going; Alice posts on the board → event_messages line."
    location: "Studio Verde, Paris, France"
    latitude: 48.8570
    longitude: 2.3600
    start: w1 Sun 18:00
    end: w1 Sun 21:00
    tags:
      - format:social
      - dance-style:salsa
      - reach:local

ratings:
  - event_id: ev-review
    email: alice@example.com
    overall_sentiment: amazing
    comment: "Incredible floor and DJ!"
    status: approved

# Alice's suggested event was approved → fan out subscription_suggested to
# her followers (Bob email ON → section; Carol email OFF → no section).
emit_suggested:
  - event_id: ev-suggested
    email: alice@example.com

# Alice posts on ev-messages' board; Bob (Going) receives an event_message
# notification → event_messages section in his digest.
messages:
  - event_id: ev-messages
    email: alice@example.com
    category: question
    body: "Anyone carpooling from the center before the practica?"
