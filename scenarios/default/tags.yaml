  # ─────────────────────────────────────────────────────────────────────
  # Review aspects (scope: aspect) — mirrors scenarios/prod/tags.yaml so the
  # adaptive review flow is testable in every scenario that inherits these
  # default tags. Each group is one aspect surfaced in the review flow: the
  # user picks a headline sentiment, chooses the aspects that drove it, then
  # rates (1-5 stars) and tags each. Tags carry a `polarity`
  # (positive|negative) so the public "Community summary" can split
  # "People loved" from "People mentioned".
  #
  # NOTE: the aspect "Venue" group uses slug `venue-quality` (not `venue`)
  # because the event-scope `venue` group above already owns that slug and
  # the seeder matches tag groups by slug only.
  # ─────────────────────────────────────────────────────────────────────
  - slug: music
    label: 🎵 Music
    ordinal: 100
    allow_multiple: true
    color: "#f59e0b"
    scope: aspect
    tags:
      - { slug: great-dj, label: Great DJs, polarity: positive }
      - {
          slug: great-playlist,
          label: Great song selection,
          polarity: positive,
        }
      - { slug: good-variety, label: Good variety, polarity: positive }
      - { slug: great-energy, label: Great energy, polarity: positive }
      - { slug: good-sound, label: Good sound quality, polarity: positive }
      - {
          slug: smooth-transitions,
          label: Smooth transitions,
          polarity: positive,
        }
      - {
          slug: music-fit-event,
          label: Music fit the event,
          polarity: positive,
        }
      - { slug: live-band, label: Great live band, polarity: positive }
      - {
          slug: music-not-fit,
          label: Music didn't fit the event,
          polarity: negative,
        }
      - { slug: too-loud, label: Too loud, polarity: negative }
      - { slug: too-quiet, label: Too quiet, polarity: negative }
      - { slug: bad-sound, label: Poor sound, polarity: negative }
      - { slug: too-many-remixes, label: Too many remixes, polarity: negative }
      - {
          slug: too-little-variety,
          label: Too little variety,
          polarity: negative,
        }
      - { slug: songs-repeated, label: Songs repeated, polarity: negative }

