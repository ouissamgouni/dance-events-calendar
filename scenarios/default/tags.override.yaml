# Dev-only additions on top of scenarios/tags.yaml, inherited by every scenario
# without its own tags.yaml / tags.override.yaml (many fixtures reference vibe:*
# and format:congress).
tag_groups:
  - slug: format
    tags:
      - slug: festival
        synonyms: ["encuentro"]
      - slug: congress
        label: Congress
        ordinal: 5
        synonyms: ["congreso"]

  - slug: misc
    tags:
      - slug: ogouni-going
        label: OGoing !
        ordinal: 0
        is_hero_filter: true
        hero_ordinal: 0

  - slug: vibe
    label: Vibe
    ordinal: 70
    allow_multiple: true
    color: "#e879f9"
    tags:
      - slug: good-music
        label: Good Music
      - slug: crowded
        label: Crowded
      - slug: spacious
        label: Spacious
      - slug: high-level-dancers
        label: High-Level Dancers
      - slug: social-atmosphere
        label: Social Atmosphere
      - slug: live-band
        label: Live Band

  - slug: atmosphere
    tags:
      - { slug: large-event, label: Large event, enabled: false }

  - slug: venue-quality
    tags:
      - {
          slug: poor-food,
          label: Poor food,
          polarity: negative,
          enabled: false,
        }
      - {
          slug: poor-drinks,
          label: Poor drinks,
          polarity: negative,
          enabled: false,
        }
