test_plan:
  name: "Search event - Multi-attribute event finder"
  description: >
    Verify the global event finder across title, structured place, and tag
    attributes, plus the shared responsive presentation of event and people
    search. The finder works for signed-out visitors and remains independent
    from the explorer's current filters.

  preconditions:
    - "Run with: task start:scenario SCENARIO=search-event"
    - >
      The seeded data includes three visible upcoming "Moonrise" matches,
      including one at week 16 outside the default next-3-month explorer
      window, plus one hidden and one past Moonrise control row that must stay
      out of search results.
    - >
      The seeded data also includes nine visible upcoming "Rooftop" matches so
      the dropdown limit can be checked without changing code or browser state.
    - >
      evt-se-014 has structured city/country values and the Pool venue tag, but
      neither "Pool" nor "France" appears in its title.

  steps:
    - id: 1
      title: "Desktop header shows aligned event and people inputs"
      description: >
        Open / on a desktop viewport as an anonymous visitor.
      expected: >
        At 1024px or wider, the global header shows aligned event and people
        inputs. The event placeholder reads "Search by event, place, or tag".
        The main event list, map, and SummaryBar render normally beneath them.

    - id: 2
      title: "Moonrise query returns only visible upcoming matches"
      description: >
        Open the explorer event search and type "moonrise".
      expected: >
        Exactly three results appear: evt-se-001, evt-se-002, and evt-se-003.
        Each result uses the shared rich event card with its available image,
        date/time, location, tags, community context and Save/Going actions.
        Hidden Moonrise (evt-se-004) and Past Moonrise (evt-se-005) do not appear.

    - id: 3
      title: "Search is global across future events, not limited to current explorer window"
      description: >
        Keep the Moonrise results open and compare them with the visible
        explorer list beneath the popover.
      expected: >
        The far-future row evt-se-003 (week 16) appears in search even though
        it is outside the explorer's default next-3-month list. The underlying
        event list and map do not change while the search popover is open.

    - id: 4
      title: "Place and broad tag queries explain non-title matches"
      description: >
        Search for "France", then "Pool", then "Paris Pool".
      expected: >
        France finds events through structured country data. Pool finds
        evt-se-014 even though Pool is absent from its title, and its row shows
        "Matched: Pool". Paris Pool finds evt-se-014 once with place/tag context.

    - id: 5
      title: "Selecting a search result opens the event detail page"
      description: >
        Click the far-future Moonrise result.
      expected: >
        The app navigates to /event/evt-se-003. The event detail page loads the
        Lisbon fixture and shows the same title as the result row.

    - id: 6
      title: "Rooftop query supports scrolling and keyboard controls"
      description: >
        Return to /, reopen the event search, and type "rooftop". Use ArrowDown
        and Enter at least once.
      expected: >
        All nine visible upcoming rooftop matches are available in the
        scrollable popover. Arrow keys move the active card highlight, Enter
        opens the active event detail page, and Escape closes the popover.

    - id: 7
      title: "Tablet and mobile searches open below the header"
      description: >
        Check a 768–1023px viewport and a mobile viewport around 390x844.
      expected: >
        Event and people inputs are replaced by icon triggers. Tapping either
        icon opens a full-width-with-gutters panel directly below the header;
        the header does not shift or overflow. Event matching is identical,
        and people results still open their profile pages.

    - id: 8
      title: "Signed-in behavior matches signed-out behavior"
      description: >
        Optionally sign in as Dev User from /login and repeat the Moonrise
        query.
      expected: >
        The same three visible Moonrise results appear in the same order. Event
        search availability and matching are not restricted to authenticated
        users.

    - id: 9
      title: "Full-page search has one clear control"
      description: >
        From the Explore search entry, open the event-name search page and type
        "moonrise" on Safari or Chrome.
      expected: >
        The field shows exactly one clear cross. Clearing it empties the field,
        removes the query from the URL and restores the minimum-query prompt.

    - id: 10
      title: "Changing a full-results query restores the refreshed Show all action"
      description: >
        Search for "moonrise", choose Show all matching events, then replace
        the query with "rooftop" without leaving the search page.
      expected: >
        Moonrise opens full results with Show more when applicable. Typing the
        new query returns to the limited preview and shows "Show all 9 matching
        events" for Rooftop. Choosing it opens Rooftop full results and does not
        immediately bounce back to preview.

    - id: 11
      title: "Search Back returns directly to its entry page"
      description: >
        Open text search from Explore, choose Show all, then use the search
        page's Back button. Repeat from the global header while on /calendar.
      expected: >
        The Explore journey returns directly to /, without an intermediate
        reduced result list. The global-header journey returns directly to the
        original /calendar URL, including its query string.
